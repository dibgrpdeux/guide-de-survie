<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تمثيلات 3D: كرام، فيشر، لويس - ENSTP</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #fff7ed; color: #1e293b; margin: 0; }
    .dark body { background: #1a1410; color: #f8fafc; }
    
    .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border: 2px solid rgba(249, 115, 22, 0.2); box-shadow: 0 10px 30px rgba(249, 115, 22, 0.15); }
    .dark .glass-panel { background: rgba(30, 20, 15, 0.9); border-color: rgba(249, 115, 22, 0.3); }
    
    .tab-btn { transition: all 0.3s ease; }
    .tab-btn.active { background: linear-gradient(135deg, #f97316, #ea580c); color: white; border-color: transparent; box-shadow: 0 10px 20px -10px rgba(249, 115, 22, 0.6); }
    
    #canvas-3d { width: 100%; height: 500px; position: relative; border-radius: 1rem; overflow: hidden; background: radial-gradient(circle at center, #1a1410, #0f172a); }
    
    .molecule-select { background: #fff; border: 2px solid #fed7aa; color: #9a3412; font-weight: 700; }
    .dark .molecule-select { background: #1e293b; border-color: #ea580c; color: #fb923c; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- الترويسة -->
    <div class="glass-panel rounded-3xl p-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-amber-600 rounded-2xl flex items-center justify-center text-3xl text-white shadow-lg shadow-orange-500/30">
          <i class="fa-solid fa-cubes"></i>
        </div>
        <div>
          <h1 class="text-2xl md:text-3xl font-black text-orange-900 dark:text-orange-400">تمثيلات 3D: كرام، فيشر، لويس</h1>
          <p class="text-sm text-gray-600 dark:text-gray-400">تفاعل مع المجسمات ثلاثية الأبعاد للمركبات ذات المدارات d.</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 border border-orange-200 dark:border-slate-700 flex items-center justify-center text-orange-600 dark:text-orange-400 shadow-sm transition">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:block"></i>
        </button>
        <a href="ma-reussite.html" class="px-5 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm shadow-md transition flex items-center gap-2">
          <i class="fa-solid fa-arrow-right"></i> العودة لنجاحي
        </a>
      </div>
    </div>

    <!-- اختيار المركب -->
    <div class="glass-panel rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <label class="font-bold text-orange-900 dark:text-orange-400 text-lg">اختر المركب:</label>
      <select id="compound-select" onchange="updateAll()" class="molecule-select p-3 rounded-xl outline-none w-full md:w-96 cursor-pointer">
        <option value="FeCl3">كلوريد الحديد (FeCl₃)</option>
        <option value="CuSO4">كبريتات النحاس (CuSO₄)</option>
        <option value="CrCl3">كلوريد الكروم (CrCl₃)</option>
        <option value="CoCl2">كلوريد الكوبالت (CoCl₂)</option>
        <option value="NiCl2">كلوريد النيكل (NiCl₂)</option>
        <option value="MnCl2">كلوريد المنغنيز (MnCl₂)</option>
      </select>
    </div>

    <!-- أزرار التبويب -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <button onclick="switchTab('cram')" id="tab-cram" class="tab-btn active glass-panel p-5 rounded-2xl flex items-center justify-center gap-3 border-2 border-transparent">
        <i class="fa-solid fa-cube text-2xl"></i>
        <span class="text-lg font-black">كرام (Cram)</span>
      </button>
      <button onclick="switchTab('fischer')" id="tab-fischer" class="tab-btn glass-panel p-5 rounded-2xl flex items-center justify-center gap-3 border-2 border-transparent">
        <i class="fa-solid fa-bars-staggered text-2xl"></i>
        <span class="text-lg font-black">فيشر (Fischer)</span>
      </button>
      <button onclick="switchTab('lewis')" id="tab-lewis" class="tab-btn glass-panel p-5 rounded-2xl flex items-center justify-center gap-3 border-2 border-transparent">
        <i class="fa-solid fa-circle-nodes text-2xl"></i>
        <span class="text-lg font-black">لويس (Lewis)</span>
      </button>
    </div>

    <!-- معلومات المركب -->
    <div class="glass-panel rounded-2xl p-4 bg-orange-50 dark:bg-slate-800/50 text-center">
      <h3 class="text-lg font-black text-orange-900 dark:text-orange-300" id="compound-name">كلوريد الحديد (FeCl₃)</h3>
      <p class="text-sm text-gray-600 dark:text-gray-400 mt-1" id="compound-desc"></p>
    </div>

    <!-- حاوية الرسم -->
    <div class="glass-panel rounded-3xl p-4">
      <div id="canvas-3d"></div>
      <p class="text-center text-xs text-gray-500 mt-2" id="representation-note">
        <i class="fa-solid fa-info-circle text-orange-500"></i> استخدم الماوس للتدوير.
      </p>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. الوضع الليلي
    // ==========================================
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    // ==========================================
    // 2. بيانات المركبات
    // ==========================================
    const compoundsData = {
      'FeCl3': { name: 'كلوريد الحديد (FeCl₃)', desc: 'الحديد Fe³⁺ ([Ar] 3d⁵), 3 ليكندات Cl. هندسة مثلثية مستوية.', center: 'Fe', ligands: ['Cl', 'Cl', 'Cl'], geometry: 'trigonal_planar', dElectrons: 5 },
      'CuSO4': { name: 'كبريتات النحاس (CuSO₄)', desc: 'النحاس Cu²⁺ ([Ar] 3d⁹), 4 ليكندات O. هندسة مربعية مستوية.', center: 'Cu', ligands: ['O', 'O', 'O', 'O'], geometry: 'square_planar', dElectrons: 9 },
      'CrCl3': { name: 'كلوريد الكروم (CrCl₃)', desc: 'الكروم Cr³⁺ ([Ar] 3d³), 3 ليكندات Cl. هندسة مثلثية.', center: 'Cr', ligands: ['Cl', 'Cl', 'Cl'], geometry: 'trigonal_planar', dElectrons: 3 },
      'CoCl2': { name: 'كلوريد الكوبالت (CoCl₂)', desc: 'الكوبالت Co²⁺ ([Ar] 3d⁷), 2 ليكندات Cl. هندسة خطية.', center: 'Co', ligands: ['Cl', 'Cl'], geometry: 'linear', dElectrons: 7 },
      'NiCl2': { name: 'كلوريد النيكل (NiCl₂)', desc: 'النيكل Ni²⁺ ([Ar] 3d⁸), 2 ليكندات Cl. هندسة خطية.', center: 'Ni', ligands: ['Cl', 'Cl'], geometry: 'linear', dElectrons: 8 },
      'MnCl2': { name: 'كلوريد المنغنيز (MnCl₂)', desc: 'المنغنيز Mn²⁺ ([Ar] 3d⁵), 2 ليكندات Cl. هندسة خطية.', center: 'Mn', ligands: ['Cl', 'Cl'], geometry: 'linear', dElectrons: 5 }
    };

    let currentTab = 'cram';
    let scene, camera, renderer, controls, group;

    // ==========================================
    // 3. التبديل بين التبويبات
    // ==========================================
    function switchTab(tabId) {
      currentTab = tabId;
      ['cram', 'fischer', 'lewis'].forEach(t => {
        document.getElementById('tab-' + t).classList.remove('active');
        document.getElementById('tab-' + t).classList.add('border-transparent');
      });
      document.getElementById('tab-' + tabId).classList.add('active');
      document.getElementById('tab-' + tabId).classList.remove('border-transparent');
      drawCurrentTab();
    }

    // ==========================================
    // 4. تحديث الكل
    // ==========================================
    function updateAll() {
      const key = document.getElementById('compound-select').value;
      const data = compoundsData[key];
      document.getElementById('compound-name').innerText = data.name;
      document.getElementById('compound-desc').innerText = data.desc;
      drawCurrentTab();
    }

    // ==========================================
    // 5. تهيئة Three.js
    // ==========================================
    function init3D() {
      const container = document.getElementById('canvas-3d');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 8);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.5;

      // إضاءة
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);
      const pointLight = new THREE.PointLight(0xf97316, 1);
      pointLight.position.set(-5, 0, 5);
      scene.add(pointLight);

      group = new THREE.Group();
      scene.add(group);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // ==========================================
    // 6. رسم الروابط والليكندات (دوال مساعدة)
    // ==========================================
    function clearGroup() {
      while(group.children.length > 0) {
        const child = group.children[0];
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
        group.remove(child);
      }
    }

    function createAtom(x, y, z, radius, color, text) {
      const geo = new THREE.SphereGeometry(radius, 32, 32);
      const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.1 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      
      // إضافة النص فوق الذرة باستخدام Canvas Texture
      if (text) {
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.font = 'bold 64px Cairo';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 64, 64);
        
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.position.set(x, y, z);
        sprite.scale.set(radius * 2, radius * 2, 1);
        group.add(sprite);
      }
      
      return mesh;
    }

    function createBond(start, end, radius, color) {
      const dir = new THREE.Vector3().subVectors(end, start);
      const length = dir.length();
      const geo = new THREE.CylinderGeometry(radius, radius, length, 8);
      const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 });
      const bond = new THREE.Mesh(geo, mat);
      bond.position.copy(start.clone().add(end).multiplyScalar(0.5));
      bond.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
      return bond;
    }

    // ==========================================
    // 7. رسم كرام 3D
    // ==========================================
    function drawCram() {
      document.getElementById('representation-note').innerHTML = '<i class="fa-solid fa-info-circle text-orange-500"></i> تمثيل كرام: يوضح التوزيع الفراغي الحقيقي للروابط.';
      clearGroup();
      
      const key = document.getElementById('compound-select').value;
      const data = compoundsData[key];
      
      // رسم الذرة المركزية
      group.add(createAtom(0, 0, 0, 0.6, 0xf97316, data.center));
      
      const numLigands = data.ligands.length;
      const bondLength = 2;
      
      if (data.geometry === 'linear') {
        // روابط على المحور X
        const pos1 = new THREE.Vector3(-bondLength, 0, 0);
        const pos2 = new THREE.Vector3(bondLength, 0, 0);
        group.add(createBond(new THREE.Vector3(0,0,0), pos1, 0.1, 0xfed7aa));
        group.add(createBond(new THREE.Vector3(0,0,0), pos2, 0.1, 0xfed7aa));
        group.add(createAtom(pos1.x, pos1.y, pos1.z, 0.4, 0xfbbf24, data.ligands[0]));
        group.add(createAtom(pos2.x, pos2.y, pos2.z, 0.4, 0xfbbf24, data.ligands[1]));
        
      } else if (data.geometry === 'trigonal_planar') {
        // 3 روابط بزوايا 120 درجة
        for (let i = 0; i < numLigands; i++) {
          const angle = (i * 120 - 90) * Math.PI / 180;
          const pos = new THREE.Vector3(Math.cos(angle) * bondLength, Math.sin(angle) * bondLength, 0);
          group.add(createBond(new THREE.Vector3(0,0,0), pos, 0.1, 0xfed7aa));
          group.add(createAtom(pos.x, pos.y, pos.z, 0.4, 0xfbbf24, data.ligands[i]));
        }
        
      } else if (data.geometry === 'square_planar') {
        // 4 روابط في مستوى XY
        const angles = [-90, 0, 90, 180];
        for (let i = 0; i < numLigands; i++) {
          const angle = angles[i] * Math.PI / 180;
          const pos = new THREE.Vector3(Math.cos(angle) * bondLength, Math.sin(angle) * bondLength, 0);
          group.add(createBond(new THREE.Vector3(0,0,0), pos, 0.1, 0xfed7aa));
          group.add(createAtom(pos.x, pos.y, pos.z, 0.4, 0xfbbf24, data.ligands[i]));
        }
      }
    }

    // ==========================================
    // 8. رسم فيشر 3D
    // ==========================================
    function drawFischer() {
      document.getElementById('representation-note').innerHTML = '<i class="fa-solid fa-info-circle text-orange-500"></i> تمثيل فيشر: إسقاط مسطح. الروابط الأفقية (X) للأمام، والعمودية (Y) للخلف.';
      clearGroup();
      
      const key = document.getElementById('compound-select').value;
      const data = compoundsData[key];
      
      // رسم الذرة المركزية
      group.add(createAtom(0, 0, 0, 0.6, 0xf97316, data.center));
      
      const numLigands = data.ligands.length;
      const bondLength = 2;
      
      if (numLigands === 2) {
        // عمودي
        const pos1 = new THREE.Vector3(0, bondLength, 0);
        const pos2 = new THREE.Vector3(0, -bondLength, 0);
        group.add(createBond(new THREE.Vector3(0,0,0), pos1, 0.1, 0xfed7aa));
        group.add(createBond(new THREE.Vector3(0,0,0), pos2, 0.1, 0xfed7aa));
        group.add(createAtom(pos1.x, pos1.y, pos1.z, 0.4, 0xfbbf24, data.ligands[0]));
        group.add(createAtom(pos2.x, pos2.y, pos2.z, 0.4, 0xfbbf24, data.ligands[1]));
        
      } else if (numLigands === 3) {
        // أعلى (عمودي)، يمين، يسار
        const posTop = new THREE.Vector3(0, bondLength, 0);
        const posLeft = new THREE.Vector3(-bondLength, 0, 0);
        const posRight = new THREE.Vector3(bondLength, 0, 0);
        group.add(createBond(new THREE.Vector3(0,0,0), posTop, 0.1, 0xfed7aa));
        group.add(createBond(new THREE.Vector3(0,0,0), posLeft, 0.1, 0xfed7aa));
        group.add(createBond(new THREE.Vector3(0,0,0), posRight, 0.1, 0xfed7aa));
        group.add(createAtom(posTop.x, posTop.y, posTop.z, 0.4, 0xfbbf24, data.ligands[0]));
        group.add(createAtom(posLeft.x, posLeft.y, posLeft.z, 0.4, 0xfbbf24, data.ligands[1]));
        group.add(createAtom(posRight.x, posRight.y, posRight.z, 0.4, 0xfbbf24, data.ligands[2]));
        
      } else if (numLigands === 4) {
        // 4 روابط (شكل صليب)
        const positions = [
          new THREE.Vector3(0, bondLength, 0),      // أعلى (خلف)
          new THREE.Vector3(0, -bondLength, 0),     // أسفل (خلف)
          new THREE.Vector3(-bondLength, 0, 0),     // يسار (أمام)
          new THREE.Vector3(bondLength, 0, 0)       // يمين (أمام)
        ];
        positions.forEach((pos, i) => {
          group.add(createBond(new THREE.Vector3(0,0,0), pos, 0.1, 0xfed7aa));
          group.add(createAtom(pos.x, pos.y, pos.z, 0.4, 0xfbbf24, data.ligands[i]));
        });
      }
    }

    // ==========================================
    // 9. رسم لويس 3D
    // ==========================================
    function drawLewis() {
      document.getElementById('representation-note').innerHTML = '<i class="fa-solid fa-info-circle text-orange-500"></i> تمثيل لويس: إلكترونات التكافؤ (نقاط زرقاء) موزعة حول الذرة المركزية.';
      clearGroup();
      
      const key = document.getElementById('compound-select').value;
      const data = compoundsData[key];
      
      // رسم الذرة المركزية
      group.add(createAtom(0, 0, 0, 0.6, 0xf97316, data.center));
      
      const numLigands = data.ligands.length;
      const bondLength = 2.2;
      
      // رسم الروابط
      for (let i = 0; i < numLigands; i++) {
        const angle = (i / numLigands) * Math.PI * 2;
        const pos = new THREE.Vector3(Math.cos(angle) * bondLength, Math.sin(angle) * bondLength, 0);
        group.add(createBond(new THREE.Vector3(0,0,0), pos, 0.1, 0xfed7aa));
        group.add(createAtom(pos.x, pos.y, pos.z, 0.4, 0xfbbf24, data.ligands[i]));
      }
      
      // رسم إلكترونات التكافؤ (نقاط زرقاء) في الفضاء
      const numElectrons = data.dElectrons;
      const electronRadius = 1.2;
      const electronGeo = new THREE.SphereGeometry(0.08, 8, 8);
      const electronMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8, emissiveIntensity: 0.5 });
      
      for (let i = 0; i < numElectrons; i++) {
        // توزيع إلكترونات d في فضاء ثلاثي (زوايا عشوائية)
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const x = electronRadius * Math.sin(phi) * Math.cos(theta);
        const y = electronRadius * Math.sin(phi) * Math.sin(theta);
        const z = electronRadius * Math.cos(phi);
        
        const electron = new THREE.Mesh(electronGeo, electronMat);
        electron.position.set(x, y, z);
        group.add(electron);
      }
    }

    // ==========================================
    // 10. الرسم الحالي
    // ==========================================
    function drawCurrentTab() {
      if (currentTab === 'cram') drawCram();
      if (currentTab === 'fischer') drawFischer();
      if (currentTab === 'lewis') drawLewis();
    }

    // ==========================================
    // 11. التهيئة عند التحميل
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      init3D();
      updateAll();
    });

    // التعامل مع تغيير الحجم
    window.addEventListener('resize', () => {
      const container = document.getElementById('canvas-3d');
      if (!container) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
