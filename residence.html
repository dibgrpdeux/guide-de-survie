<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دليل الإقامة الجامعية - ENSTP</title>
  
  <!-- كود الترجمة -->
  <script src="translate.js"></script>
  <style>
    body { top: 0 !important; }
    .skiptranslate iframe { display: none !important; }
    .goog-te-banner-frame { display: none !important; }
    #goog-gt-tt { display: none !important; }
    #google_translate_element { display: none; } 
    .lang-btn { background: transparent; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.2s; color: #64748b; }
    .lang-btn:hover { background: #f1f5f9; color: #1e293b; }
    .lang-btn.active { background: #4f46e5; color: white; }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; }
    .ambient-bg {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12), transparent 40%),
                  radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.10), transparent 45%),
                  linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.95); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
    }
    .glass-nav { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
    .map-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .map-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <div class="ambient-bg"></div>

  <!-- الهيدر -->
  <header class="sticky top-0 z-50 glass-nav px-4 lg:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-md">E</div>
        <div>
          <h1 class="font-bold text-gray-900 text-base leading-tight">ENSTP <span class="text-indigo-600">Résidence</span></h1>
          <p class="text-[11px] text-gray-500" data-i18n="nav_app_sub">المدرسة الوطنية العليا</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-gray-200 shadow-sm">
          <button onclick="setLanguage('ar')" id="btn-ar" class="lang-btn active">🇩🇿 عربي</button>
          <button onclick="setLanguage('fr')" id="btn-fr" class="lang-btn">🇫🇷 FR</button>
          <button onclick="setLanguage('en')" id="btn-en" class="lang-btn">🇬🇧 EN</button>
        </div>
        <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs font-bold flex items-center gap-2 transition" data-i18n="nav_home">الرئيسية</a>
      </div>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="max-w-6xl mx-auto px-4 lg:px-8 py-10 flex-grow w-full space-y-8">

    <!-- القائمة الرئيسية -->
    <div id="mainMenu" class="space-y-8 animate-fade-in">
      <div class="text-center space-y-3">
        <h2 class="text-3xl md:text-4xl font-black text-gray-900" data-i18n="res_title">اختر إقامتك الجامعية</h2>
        <p class="text-sm text-gray-600 max-w-2xl mx-auto" data-i18n="res_subtitle">تعرف على موقع إقامتك، المسافة بينها وبين المدرسة، والفيديوهات والمرافق القريبة منها.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- قاريدي -->
        <button onclick="showDetails('gueridi')" class="glass-card p-6 rounded-3xl flex flex-col items-center text-center gap-4 hover:scale-105 transition group">
          <div class="w-20 h-20 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-3xl group-hover:bg-indigo-600 group-hover:text-white transition">
            <i class="fa-solid fa-building-user"></i>
          </div>
          <div>
            <h3 class="font-bold text-gray-900 text-xl" data-i18n="res_gueridi">الإقامة الجامعية قاريدي</h3>
            <p class="text-xs text-gray-500 mt-1" data-i18n="res_gueridi_loc">قاريدي، الجزائر العاصمة</p>
          </div>
        </button>

        <!-- امحمد يوسفي -->
        <button onclick="showDetails('youssefi')" class="glass-card p-6 rounded-3xl flex flex-col items-center text-center gap-4 hover:scale-105 transition group">
          <div class="w-20 h-20 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-3xl group-hover:bg-emerald-600 group-hover:text-white transition">
            <i class="fa-solid fa-building-user"></i>
          </div>
          <div>
            <h3 class="font-bold text-gray-900 text-xl" data-i18n="res_youssefi">الإقامة الجامعية امحمد يوسفي</h3>
            <p class="text-xs text-gray-500 mt-1" data-i18n="res_youssefi_loc">حسين داي، الجزائر العاصمة</p>
          </div>
        </button>

        <!-- سعيد حمدين -->
        <button onclick="showDetails('hamdine')" class="glass-card p-6 rounded-3xl flex flex-col items-center text-center gap-4 hover:scale-105 transition group">
          <div class="w-20 h-20 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-3xl group-hover:bg-amber-600 group-hover:text-white transition">
            <i class="fa-solid fa-building-user"></i>
          </div>
          <div>
            <h3 class="font-bold text-gray-900 text-xl" data-i18n="res_hamdine">الإقامة الجامعية سعيد حمدين</h3>
            <p class="text-xs text-gray-500 mt-1" data-i18n="res_hamdine_loc">سعيد حمدين، الجزائر العاصمة</p>
          </div>
        </button>
      </div>
    </div>

    <!-- صفحة التفاصيل -->
    <div id="detailsSection" class="hidden space-y-8 animate-fade-in">
      
      <button onclick="hideDetails()" class="px-4 py-2 rounded-xl bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 text-sm font-bold flex items-center gap-2 transition shadow-sm w-fit">
        <i class="fa-solid fa-arrow-right"></i>
        <span data-i18n="res_back">العودة لقائمة الإقامات</span>
      </button>

      <div class="border-b pb-4">
        <h2 id="detailTitle" class="text-3xl font-black text-indigo-900"></h2>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 glass-card p-4 rounded-3xl space-y-3">
          <h3 class="font-bold text-lg text-gray-800 px-2"><i class="fa-solid fa-map-location-dot text-indigo-500 mr-2"></i> <span data-i18n="res_map">الموقع على الخريطة</span></h3>
          <div id="mapContainer" class="map-container bg-gray-200"></div>
        </div>
        
        <div class="glass-card p-6 rounded-3xl space-y-4 flex flex-col justify-center">
          <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl mb-2">
            <i class="fa-solid fa-route"></i>
          </div>
          <h3 class="font-bold text-lg text-gray-800" data-i18n="res_distance">المسافة إلى المدرسة</h3>
          <p id="distanceText" class="text-sm text-gray-600 leading-relaxed"></p>
          <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 mt-2">
            <p class="text-xs font-bold text-indigo-800"><i class="fa-solid fa-car ml-1"></i> <span data-i18n="res_transport">وسيلة النقل المقترحة:</span></p>
            <p id="transportText" class="text-xs text-indigo-700 mt-1"></p>
          </div>
        </div>
      </div>

      <div class="glass-card p-4 rounded-3xl space-y-3">
        <h3 class="font-bold text-lg text-gray-800 px-2"><i class="fa-brands fa-youtube text-red-500 mr-2"></i> <span data-i18n="res_video">فيديو تعريفي</span></h3>
        <div id="videoContainer" class="video-container bg-gray-200 max-w-2xl mx-auto"></div>
      </div>

      <div class="space-y-4">
        <h3 class="font-bold text-xl text-gray-800 border-r-4 border-indigo-500 pr-3" data-i18n="res_facilities">المحلات والمرافق القريبة</h3>
        <div id="facilitiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

    </div>
  </main>

  <footer class="glass-nav border-t border-gray-200 py-6 px-4 text-center text-xs text-gray-500">
    <p>© 2026 ENSTP Kouba.</p>
  </footer>

  <script>
    let currentLang = localStorage.getItem('enstp_lang') || 'ar';

    function t(key) {
      return window.translations[currentLang][key] || key;
    }

    // تحديث اللغة
    const originalSetLanguage = window.setLanguage;
    window.setLanguage = function(lang) {
      currentLang = lang;
      originalSetLanguage(lang);
      // إعادة رسم المحلات إذا كنا في صفحة التفاصيل
      if(!document.getElementById('detailsSection').classList.contains('hidden')) {
        // إعادة فتح نفس الإقامة لتحديث النصوص
        const title = document.getElementById('detailTitle').innerText;
        if(title.includes('قاريدي') || title.includes('Gueridi')) showDetails('gueridi');
        else if(title.includes('يوسفي') || title.includes('Youssefi')) showDetails('youssefi');
        else if(title.includes('حمدين') || title.includes('Hamdine')) showDetails('hamdine');
      }
    };

    const residencesData = {
      'gueridi': {
        title: { ar: 'الإقامة الجامعية قاريدي', fr: 'Résidence Gueridi', en: 'Gueridi Residence' },
        mapSrc: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3196.375506523222!2d3.0174753152907654!3d36.76112497995362!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x128faffa7b3dae89%3A0x6b3b6b3b6b3b6b3b!2sCit%C3%A9%20Universitaire%20Gueridi%20Ben%20Aknoun!5e0!3m2!1sen!2sdz!4v1620000000000!5m2!1sen!2sdz',
        videoSrc: 'https://www.youtube.com/embed/cxKbbBfWCCw',
        distance: { ar: 'تبعد حوالي 5 دقائق عن المدرسة.', fr: 'À environ 5 minutes de l\'école.', en: 'About 5 minutes from the school.' },
        transport: { ar: 'قريبة جداً، يمكن المشي.', fr: 'Très proche, accessible à pied.', en: 'Very close, walkable.' },
        facilities: [
          { name: 'مطعم الإقامة الجامعية', icon: 'fa-utensils', type: 'مرفق', time: '12:00 - 14:00', distance: 'داخل الإقامة' },
          { name: 'سوبرماركت (Ardis / UNO)', icon: 'fa-cart-shopping', type: 'محل تجاري', time: '09:00 - 22:00', distance: '500 متر' },
          { name: 'صيدلية', icon: 'fa-prescription-bottle-medical', type: 'مرفق صحي', time: '08:00 - 20:00', distance: '400 متر' }
        ]
      },
      'youssefi': {
        title: { ar: 'الإقامة الجامعية امحمد يوسفي', fr: 'Résidence Mohamed Youssefi', en: 'Mohamed Youssefi Residence' },
        mapSrc: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3196.88915412985!2d3.07949431529025!3d36.75256397995596!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x128fadec61ab4433%3A0x7a1f7a1f7a1f7a1f!2sCit%C3%A9%20Universitaire%20Mohamed%20Youssefi%20Kouba!5e0!3m2!1sen!2sdz!4v1620000000000!5m2!1sen!2sdz',
        videoSrc: 'https://www.youtube.com/embed/agTlVSQ8760',
        distance: { ar: 'قريبة جداً من المدرسة (10-15 دقيقة).', fr: 'Très proche de l\'école (10-15 min).', en: 'Very close to school (10-15 min).' },
        transport: { ar: 'حافلات أو مشياً على الأقدام.', fr: 'Bus ou à pied.', en: 'Bus or walking.' },
        facilities: [
          { name: 'Oum Ibtihal', icon: 'fa-utensils', type: 'مطعم', time: '11:00 - 23:00', distance: 'قريب جداً' },
          { name: 'Le Four Magique', icon: 'fa-bread-slice', type: 'مخبزة', time: '06:00 - 20:00', distance: 'قريب' },
          { name: 'بيتزيريا نيفادا (Nevada food)', icon: 'fa-pizza-slice', type: 'مطعم', time: '11:00 - 23:00', distance: 'قريب' },
          { name: 'GALAXY Supermarket', icon: 'fa-cart-shopping', type: 'سوبرماركت', time: '08:00 - 22:00', distance: 'قريب' },
          { name: 'Librairie Hassen El djadida', icon: 'fa-book', type: 'مكتبة', time: '08:00 - 20:00', distance: 'الرويسو (Ruisseau)' },
          { name: 'Bazar montfleury golden', icon: 'fa-store', type: 'متجر', time: '09:00 - 21:00', distance: 'قريب' }
        ]
      },
      'hamdine': {
        title: { ar: 'الإقامة الجامعية سعيد حمدين', fr: 'Résidence Saïd Hamdine', en: 'Saïd Hamdine Residence' },
        mapSrc: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3198.123456789!2d3.08949431529025!3d36.73356397995596!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x128fb20000000000%3A0x123456789abcdef!2sCit%C3%A9%20Universitaire%20Sa%C3%AFd%20Hamdine!5e0!3m2!1sen!2sdz!4v1620000000000!5m2!1sen!2sdz',
        videoSrc: 'https://www.youtube.com/embed/hZg4e6hpkns',
        distance: { ar: 'تبعد حوالي 6 كم عن المدرسة.', fr: 'À environ 6 km de l\'école.', en: 'About 6 km from school.' },
        transport: { ar: 'حافلات النقل الحضري أو الترامواي.', fr: 'Bus urbains ou tramway.', en: 'Urban buses or tramway.' },
        facilities: [
          { name: 'مطعم الإقامة', icon: 'fa-utensils', type: 'مرفق', time: '12:00 - 14:30', distance: 'داخل الإقامة' },
          { name: 'مركز تجاري (Bab Ezzouar Mall)', icon: 'fa-cart-shopping', type: 'محل تجاري', time: '10:00 - 21:00', distance: '3 كم' },
          { name: 'صيدلية ليلية', icon: 'fa-prescription-bottle-medical', type: 'مرفق صحي', time: '24 ساعة', distance: '800 متر' },
          { name: 'محطة الترامواي', icon: 'fa-train', type: 'نقل', time: '05:00 - 23:00', distance: '400 متر' }
        ]
      }
    };

    function showDetails(id) {
      const data = residencesData[id];
      
      document.getElementById('mainMenu').classList.add('hidden');
      document.getElementById('detailsSection').classList.remove('hidden');
      
      document.getElementById('detailTitle').innerText = data.title[currentLang];
      
      document.getElementById('mapContainer').innerHTML = `<iframe src="${data.mapSrc}" allowfullscreen="" loading="lazy"></iframe>`;
      
      document.getElementById('distanceText').innerText = data.distance[currentLang];
      document.getElementById('transportText').innerText = data.transport[currentLang];
      
      document.getElementById('videoContainer').innerHTML = `<iframe src="${data.videoSrc}" allowfullscreen></iframe>`;
      
      const grid = document.getElementById('facilitiesGrid');
      grid.innerHTML = '';
      
      data.facilities.forEach(fac => {
        let colorClass = 'bg-blue-50 text-blue-600';
        if(fac.type === 'مرفق صحي') colorClass = 'bg-red-50 text-red-600';
        if(fac.type === 'محل تجاري' || fac.type === 'سوبرماركت' || fac.type === 'متجر') colorClass = 'bg-emerald-50 text-emerald-600';
        if(fac.type === 'نقل') colorClass = 'bg-amber-50 text-amber-600';
        if(fac.type === 'مطعم' || fac.type === 'مخبزة') colorClass = 'bg-orange-50 text-orange-600';
        if(fac.type === 'مكتبة') colorClass = 'bg-purple-50 text-purple-600';

        grid.innerHTML += `
          <div class="glass-card p-5 rounded-2xl border border-gray-100 flex flex-col gap-3">
            <div class="flex items-center gap-3 border-b border-gray-50 pb-3">
              <div class="w-10 h-10 rounded-xl ${colorClass} flex items-center justify-center text-lg">
                <i class="fa-solid ${fac.icon}"></i>
              </div>
              <div>
                <h4 class="font-bold text-gray-800 text-sm">${fac.name}</h4>
                <span class="text-[10px] font-bold text-gray-500">${fac.type}</span>
              </div>
            </div>
            <div class="space-y-2 text-xs text-gray-600">
              <p class="flex items-center gap-2"><i class="fa-regular fa-clock text-gray-400 w-4"></i> <span dir="ltr">${fac.time}</span></p>
              <p class="flex items-center gap-2"><i class="fa-solid fa-person-walking text-gray-400 w-4"></i> ${fac.distance}</p>
            </div>
          </div>
        `;
      });
      
      window.scrollTo(0, 0);
    }

    function hideDetails() {
      document.getElementById('detailsSection').classList.add('hidden');
      document.getElementById('mainMenu').classList.remove('hidden');
      document.getElementById('mapContainer').innerHTML = '';
      document.getElementById('videoContainer').innerHTML = '';
      window.scrollTo(0, 0);
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => setLanguage(currentLang), 100);
    });
  </script>
</body>
</html>
