    body { font-family: 'Cairo', sans-serif; background: #fff7ed; color: #1e293b; margin: 0; overflow-x: hidden; }

    .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border: 2px solid rgba(249, 115, 22, 0.2); box-shadow: 0 10px 30px rgba(249, 115, 22, 0.15); }
    .dark .glass-panel { background: rgba(30, 20, 15, 0.9); border-color: rgba(249, 115, 22, 0.3); }
    
    #canvas-3d-container { width: 100%; height: 500px; position: relative; border-radius: 1rem; overflow: hidden; background: radial-gradient(circle at center, #1a1410, #0f172a); }
    
    .element-select { background: #fff; border: 2px solid #fed7aa; color: #9a3412; font-weight: 700; }
    .dark .element-select { background: #1e293b; border-color: #ea580c; color: #fb923c; }
    
    /* تنسيق خانات الجدول الدوري المصغر */
    .pt-cell { transition: all 0.2s; cursor: pointer; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; font-size: 10px; }
    .pt-cell:hover { transform: scale(1.15); z-index: 10; box-shadow: 0 0 10px rgba(249,115,22,0.5); }
    .pt-cell.active { border: 2px solid #f97316; box-shadow: 0 0 15px rgba(249,115,22,0.8); }
  </style>

      </div>

      <div class="lg:col-span-2 space-y-6">

        <div id="element-info" class="glass-panel rounded-3xl p-6 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
          <div>
            <p class="text-xs text-orange-600 dark:text-orange-400 font-bold">الرمز</p>
            <p class="text-3xl font-black text-orange-900 dark:text-white" id="el-symbol">H</p>
          </div>
          <div>

          </div>
          <div>
            <p class="text-xs text-orange-600 dark:text-orange-400 font-bold">الكتلة الذرية</p>

          </div>
          <div>

          </div>
        </div>

          <div id="canvas-3d-container">

            <div class="absolute inset-0 flex items-center justify-center text-white" id="loading-3d">
              <i class="fa-solid fa-spinner fa-spin text-4xl text-orange-500"></i>
            </div>
          </div>
        </div>
        
        <!-- ملاحظة -->
        <p class="text-center text-xs text-gray-500 dark:text-gray-400">
          <i class="fa-solid fa-info-circle text-orange-500"></i> يمكنك استخدام الماوس (أو إصبعك) لتدوير الذرة وتكبيرها.
        </p>
      </div>

    </div>

      { z: 108, symbol: 'Hs', name: 'هاسيوم', mass: '269', config: '6d⁶ 7s²', shells: [2,8,18,32,32,14,2], group: 8, period: 7 },

      { z: 110, symbol: 'Ds', name: 'دارمشتاتيوم', mass: '281', config: '6d⁸ 7s²', shells: [2,8,18,32,32,16,2], group: 10, period: 7 },
      { z: 111, symbol: 'Rg', name: 'رونتجينيوم', mass: '282', config: '6d⁹ 7s²', shells: [2,8,18,32,32,17,2], group: 11, period: 7 },
      { z: 112, symbol: 'Cn', name: 'كوبرنيسيوم', mass: '285', config: '6d¹⁰ 7s²', shells: [2,8,18,32,32,18,2], group: 12, period: 7 },
      { z: 113, symbol: 'Nh', name: 'نيهونيوم', mass: '286', config: '7s² 7p¹', shells: [2,8,18,32,32,18,3], group: 13, period: 7 },
      { z: 114, symbol: 'Fl', name: 'فليروفيوم', mass: '289', config: '7s² 7p²', shells: [2,8,18,32,32,18,4], group: 14, period: 7 },
      { z: 115, symbol: 'Mc', name: 'موسكوفيوم', mass: '290', config: '7s² 7p³', shells: [2,8,18,32,32,18,5], group: 15, period: 7 },
      { z: 116, symbol: 'Lv', name: 'ليفرموريوم', mass: '293', config: '7s² 7p⁴', shells: [2,8,18,32,32,18,6], group: 16, period: 7 },
      { z: 117, symbol: 'Ts', name: 'تينيسين', mass: '294', config: '7s² 7p⁵', shells: [2,8,18,32,32,18,7], group: 17, period: 7 },
      { z: 118, symbol: 'Og', name: 'أوغانيسون', mass: '294', config: '7s² 7p⁶', shells: [2,8,18,32,32,18,8], group: 18, period: 7 }
    ];

    // ==========================================
    // 3. المتغيرات العامة لـ Three.js
    // ==========================================
    let scene, camera, renderer, controls, atomGroup;
    let isInitialized = false;

    // ==========================================
    // 4. رسم شبكة الجدول الدوري المصغر
    // ==========================================
    function renderPeriodicTable() {
      const grid = document.getElementById('periodic-table-grid');
      
      // تحديد عدد الأعمدة (18 مجموعة) وعدد الصفوف (7 دورات + اللانثانيدات والأكتينيدات)
      // لتبسيط العرض، سنستخدم شبكة مقاس 18x9 (لأن هناك 18 عموداً و 7 صفوف + صفين للعناصر الانتقالية الداخلية)
      grid.style.gridTemplateColumns = 'repeat(18, minmax(0, 1fr))';
      
      // إنشاء خريطة لتحديد موقع كل عنصر (الصف، العمود)
      // الصفوف: 1-7 للعناصر العادية، 8 لللانثانيدات، 9 للأكتينيدات
      const positions = {};
      
      elementsData.forEach(el => {
        let row = el.period;
        let col = el.group;
        
        // معالجة اللانثانيدات (58-71) والأكتينيدات (90-103)
        if (el.z >= 58 && el.z <= 71) {
          row = 8;
          col = el.z - 57 + 2; // تبدأ من العمود 3
        } else if (el.z >= 90 && el.z <= 103) {
          row = 9;
          col = el.z - 89 + 2;
        }
        
        positions[el.z] = { row, col };
      });

      // إنشاء الخلايا
      // نحتاج إلى 18 * 9 = 162 خانة
      for (let r = 1; r <= 9; r++) {
        for (let c = 1; c <= 18; c++) {
          // البحث عن العنصر الذي ينتمي لهذا الموقع
          let foundEl = null;
          for (let key in positions) {
            if (positions[key].row === r && positions[key].col === c) {
              foundEl = elementsData.find(e => e.z == key);
              break;
            }
          }

          const cell = document.createElement('div');
          cell.className = 'pt-cell';
          
          if (foundEl) {
            // تلوين الخلية حسب فئة العنصر (تبسيط: فلزات، لافلزات، غازات نبيلة)
            let bgColor = '#fef3c7'; // افتراضي
            if ([1, 6, 7, 8, 15, 16, 34].includes(foundEl.z)) bgColor = '#bfdbfe'; // لافلزات
            else if ([2, 10, 18, 36, 54, 86, 118].includes(foundEl.z)) bgColor = '#e9d5ff'; // غازات نبيلة
            else if (foundEl.z >= 21 && foundEl.z <= 30) bgColor = '#fecaca'; // فلزات انتقالية (مبسط)
            
            cell.style.backgroundColor = bgColor;
            cell.style.color = '#1e293b';
            cell.style.border = '1px solid #f97316';
            
            cell.innerHTML = `
              <span class="font-black text-[10px] leading-none">${foundEl.z}</span>
              <span class="font-black text-[12px] leading-none">${foundEl.symbol}</span>
            `;
            
            cell.onclick = () => {
              document.querySelectorAll('.pt-cell').forEach(c => c.classList.remove('active'));
              cell.classList.add('active');
              loadAtom(foundEl.z);
            };
          } else {
            cell.style.opacity = '0';
            cell.style.pointerEvents = 'none';
          }
          
          grid.appendChild(cell);
        }
      }
      
      // تحديد العنصر الافتراضي (الهيدروجين)
      setTimeout(() => {
        const firstCell = grid.querySelector('.pt-cell');
        if (firstCell) firstCell.click();
      }, 100);
    }

    // ==========================================
    // 5. إعداد Three.js ورسم الذرة
    // ==========================================
    function init3D() {
      if (isInitialized) return;
      isInitialized = true;

      const container = document.getElementById('canvas-3d-container');
      document.getElementById('loading-3d').style.display = 'none';

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.5;

      // إضاءة
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 10, 10);
      scene.add(dirLight);
      const pointLight = new THREE.PointLight(0xf97316, 1.5);
      pointLight.position.set(-10, -10, 5);
      scene.add(pointLight);

      atomGroup = new THREE.Group();
      scene.add(atomGroup);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      // التعامل مع تغيير الحجم
      window.addEventListener('resize', () => {
        if (!container) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });
    }

    // ==========================================
    // 6. تحميل وبناء الذرة 3D
    // ==========================================
    function loadAtom(z) {
      const el = elementsData.find(e => e.z === z);
      if (!el) return;

      // تحديث بطاقة المعلومات
      document.getElementById('el-symbol').innerText = el.symbol;
      document.getElementById('el-z').innerText = el.z;
      document.getElementById('el-mass').innerText = el.mass;
      document.getElementById('el-config').innerText = el.config;

      // مسح الذرة القديمة
      while(atomGroup.children.length > 0) {
        atomGroup.remove(atomGroup.children[0]);
      }

      // 1. رسم النواة (كرة برتقالية)
      // كلما زاد العدد الذري، كبرت النواة قليلاً
      const nucleusRadius = 0.8 + (z / 118) * 0.8; 
      const nucleusGeo = new THREE.SphereGeometry(nucleusRadius, 32, 32);
      const nucleusMat = new THREE.MeshStandardMaterial({ 
        color: 0xf97316, 
        emissive: 0xea580c, 
        emissiveIntensity: 0.4,
        roughness: 0.2,
        metalness: 0.1
      });
      const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
      atomGroup.add(nucleus);

      // 2. رسم المدارات والإلكترونات
      const shells = el.shells; // مصفوفة عدد الإلكترونات في كل مستوى
      
      shells.forEach((count, i) => {
        // نصف قطر المدار (يزداد مع رقم المستوى)
        const radius = nucleusRadius + 2 + (i * 1.8);
        
        // رسم المدار (حلقة)
        const orbitGeo = new THREE.TorusGeometry(radius, 0.04, 16, 100);
        const orbitMat = new THREE.MeshStandardMaterial({ 
          color: 0xfed7aa, 
          transparent: true, 
          opacity: 0.3,
          roughness: 0.5
        });
        const orbit = new THREE.Mesh(orbitGeo, orbitMat);
        orbit.rotation.x = Math.PI / 2; // جعله أفقياً
        atomGroup.add(orbit);

        // رسم الإلكترونات (كرات زرقاء)
        const electronGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const electronMat = new THREE.MeshStandardMaterial({ 
          color: 0x3b82f6, 
          emissive: 0x1d4ed8, 
          emissiveIntensity: 0.5 
        });
        
        // توزيع الإلكترونات على المدار
        for (let j = 0; j < count; j++) {
          const angle = (j / count) * Math.PI * 2;
          const electron = new THREE.Mesh(electronGeo, electronMat);
          
          // إضافة بعض التمايل العشوائي للمدارات (لتبدو أكثر واقعية)
          const tiltX = (Math.random() - 0.5) * 0.2;
          const tiltZ = (Math.random() - 0.5) * 0.2;
          
          electron.position.set(
            Math.cos(angle) * radius, 
            Math.sin(angle) * radius * tiltZ, 
            Math.sin(angle) * radius * tiltX
          );
          
          // لجعل الإلكترونات تدور، يمكن إضافتها لمجموعة فرعية، لكننا سنتركها ثابتة هنا
          // لتوضيح المبدأ، ولأن التحريك المستمر قد يشتت الانتباه.
          atomGroup.add(electron);
        }
      });
    }

    // ==========================================
    // 7. التهيئة
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      renderPeriodicTable();
      init3D();
    });
  </script>
