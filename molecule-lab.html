<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مختبر الجزيئات 3D - ENSTP</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- استدعاء مكتبة Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- استدعاء OrbitControls للتحكم بالماوس -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; overflow: hidden; }
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    .glass-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .control-panel { position: absolute; top: 20px; right: 20px; z-index: 10; width: 300px; padding: 20px; border-radius: 20px; }
    .info-panel { position: absolute; bottom: 20px; left: 20px; z-index: 10; padding: 15px; border-radius: 15px; max-width: 300px; }
    .btn-mode { transition: all 0.3s ease; }
    .btn-mode.active { background: #10b981; color: white; border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
  </style>
</head>
<body>

  <!-- حاوية الرسم 3D -->
  <div id="canvas-container"></div>

  <!-- لوحة التحكم -->
  <div class="glass-panel control-panel">
    <div class="flex items-center gap-3 mb-6 border-b border-gray-600 pb-4">
      <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-xl"><i class="fa-solid fa-atom"></i></div>
      <div>
        <h1 class="font-black text-lg">مختبر الجزيئات 3D</h1>
        <p class="text-xs text-gray-400">تفاعلات واهتزازات في الوقت الفعلي</p>
      </div>
    </div>

    <!-- اختيار النمط -->
    <label class="block text-sm font-bold text-gray-300 mb-2">نمط الحركة:</label>
    <div class="space-y-2 mb-6">
      <button onclick="changeMode('stretch')" id="mode-stretch" class="btn-mode active w-full text-right px-4 py-3 rounded-xl border border-gray-600 bg-slate-700/50 text-sm font-bold flex items-center gap-2">
        <i class="fa-solid fa-arrows-left-right text-emerald-400"></i> اهتزاز شد (Stretching)
      </button>
      <button onclick="changeMode('bend')" id="mode-bend" class="btn-mode w-full text-right px-4 py-3 rounded-xl border border-gray-600 bg-slate-700/50 text-sm font-bold flex items-center gap-2">
        <i class="fa-solid fa-angles-up text-emerald-400"></i> اهتزاز انحناء (Bending)
      </button>
      <button onclick="changeMode('rotate')" id="mode-rotate" class="btn-mode w-full text-right px-4 py-3 rounded-xl border border-gray-600 bg-slate-700/50 text-sm font-bold flex items-center gap-2">
        <i class="fa-solid fa-rotate text-emerald-400"></i> دوران الجزيء (Rotation)
      </button>
    </div>

    <!-- التحكم في السرعة -->
    <label class="block text-sm font-bold text-gray-300 mb-2">سرعة الاهتزاز: <span id="speed-val" class="text-emerald-400">1.0x</span></label>
    <input type="range" id="speed-slider" min="0" max="3" step="0.1" value="1" class="w-full accent-emerald-500">

    <div class="mt-6 text-xs text-gray-400 bg-slate-800/50 p-3 rounded-lg">
      <i class="fa-solid fa-info-circle text-emerald-400"></i> استخدم الماوس (أو إصبعك) لتدوير الجزيء وتكبير/تصغير المشهد.
    </div>
  </div>

  <!-- لوحة المعلومات -->
  <div class="glass-panel info-panel">
    <h3 class="font-bold text-emerald-400 mb-1" id="molecule-name">جزيء الماء (H₂O)</h3>
    <p class="text-xs text-gray-300" id="mode-desc">حركة تمدد وانقباض متناظرة للروابط.</p>
  </div>

  <script>
    // ==========================================
    // 1. إعداد المشهد 3D
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a); // لون الخلفية

    // الكاميرا
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 6);

    // المحرك (Renderer)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // التحكم بالماوس (دوران، تكبير)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = false;

    // ==========================================
    // 2. إضافة الإضاءة
    // ==========================================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight1.position.set(5, 5, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x3b82f6, 0.5);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    // ==========================================
    // 3. بناء الجزيء (H2O)
    // ==========================================
    // ذرة الأكسجين (الأحمر)
    const oxygenGeo = new THREE.SphereGeometry(0.6, 32, 32);
    const oxygenMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2, metalness: 0.1 });
    const oxygen = new THREE.Mesh(oxygenGeo, oxygenMat);
    scene.add(oxygen);

    // ذرتي الهيدروجين (الأبيض)
    const hydrogenGeo = new THREE.SphereGeometry(0.35, 32, 32);
    const hydrogenMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2, metalness: 0.1 });
    
    const h1 = new THREE.Mesh(hydrogenGeo, hydrogenMat);
    scene.add(h1);
    
    const h2 = new THREE.Mesh(hydrogenGeo, hydrogenMat);
    scene.add(h2);

    // الروابط (Cylinders)
    // دالة لإنشاء رابطة بين نقطتين
    function createBond(pos1, pos2) {
      const direction = new THREE.Vector3().subVectors(pos2, pos1);
      const length = direction.length();
      
      const bondGeo = new THREE.CylinderGeometry(0.1, 0.1, length, 8);
      const bondMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.5 });
      const bond = new THREE.Mesh(bondGeo, bondMat);
      
      // وضع الرابطة في المنتصف بين الذرتين
      bond.position.copy(pos1.clone().add(pos2).multiplyScalar(0.5));
      
      // توجيه الرابطة
      bond.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.clone().normalize()
      );
      
      return bond;
    }

    let bond1 = createBond(new THREE.Vector3(0,0,0), new THREE.Vector3(-1,0.5,0));
    let bond2 = createBond(new THREE.Vector3(0,0,0), new THREE.Vector3(1,0.5,0));
    scene.add(bond1);
    scene.add(bond2);

    // ==========================================
    // 4. منطق الحركة والاهتزاز
    // ==========================================
    let currentMode = 'stretch';
    let speed = 1;
    let time = 0;

    function changeMode(mode) {
      currentMode = mode;
      
      // تحديث الأزرار
      ['stretch', 'bend', 'rotate'].forEach(m => {
        const btn = document.getElementById('mode-' + m);
        if (m === mode) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      
      // تحديث الوصف
      const desc = document.getElementById('mode-desc');
      if (mode === 'stretch') desc.innerText = "حركة تمدد وانقباض متناظرة للروابط.";
      if (mode === 'bend') desc.innerText = "حركة تغيير زاوية الروابط (مثل المقص).";
      if (mode === 'rotate') desc.innerText = "دوران الجزيء بالكامل حول محوره.";
    }

    document.getElementById('speed-slider').addEventListener('input', (e) => {
      speed = parseFloat(e.target.value);
      document.getElementById('speed-val').innerText = speed.toFixed(1) + 'x';
    });

    // حلقة الرسم (Animation Loop)
    function animate() {
      requestAnimationFrame(animate);
      time += 0.02 * speed;

      if (currentMode === 'stretch') {
        // وضعية الهيدروجين الأساسية
        const baseX = 1.0;
        const baseY = 0.5;
        
        // تأثير الشد (كلما زادت القيمة، ابتعد الهيدروجين)
        const stretch = Math.sin(time) * 0.3;
        
        const posH1 = new THREE.Vector3(-(baseX + stretch), baseY, 0);
        const posH2 = new THREE.Vector3((baseX + stretch), baseY, 0);
        
        // تحديث مواضع الذرات
        h1.position.copy(posH1);
        h2.position.copy(posH2);
        
        // إعادة بناء الروابط
        scene.remove(bond1);
        scene.remove(bond2);
        bond1 = createBond(new THREE.Vector3(0,0,0), posH1);
        bond2 = createBond(new THREE.Vector3(0,0,0), posH2);
        scene.add(bond1);
        scene.add(bond2);
        
      } else if (currentMode === 'bend') {
        // تأثير الانحناء (تغيير الزاوية)
        const angleOffset = Math.sin(time) * 0.4;
        
        const baseAngle = Math.PI / 4; // 45 درجة
        const angle1 = -baseAngle - angleOffset;
        const angle2 = -baseAngle + angleOffset;
        
        const length = 1.2;
        const posH1 = new THREE.Vector3(Math.cos(angle1) * length, Math.sin(angle1) * length, 0);
        const posH2 = new THREE.Vector3(Math.cos(angle2) * length, Math.sin(angle2) * length, 0);
        
        h1.position.copy(posH1);
        h2.position.copy(posH2);
        
        scene.remove(bond1);
        scene.remove(bond2);
        bond1 = createBond(new THREE.Vector3(0,0,0), posH1);
        bond2 = createBond(new THREE.Vector3(0,0,0), posH2);
        scene.add(bond1);
        scene.add(bond2);

      } else if (currentMode === 'rotate') {
        // دوران الجزيء بالكامل
        const group = new THREE.Group();
        // (في هذا المثال المبسط، سنقوم بتدوير المشهد كاملاً)
        scene.rotation.y = time * 0.5;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // بدء الحركة
    animate();

    // ==========================================
    // 5. التعامل مع تغيير حجم النافذة
    // ==========================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
