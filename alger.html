<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loisirs & Voyages à Alger - ENSTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; }
    .map-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .map-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <h1 class="font-bold text-gray-900 text-lg"><i class="fa-solid fa-map-location-dot text-teal-600"></i> الترفيه والرحلات في العاصمة</h1>
      <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-xs font-bold">الرئيسية</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
    <div id="categoriesBar" class="flex flex-wrap gap-2 justify-center sticky top-[60px] z-40 bg-white/80 p-2 rounded-2xl backdrop-blur-md shadow-sm border border-gray-100"></div>
    <div id="placesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <div id="placeModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-4xl w-full p-6 lg:p-8 space-y-6 shadow-2xl relative max-h-[95vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 flex items-center justify-center transition z-20"><i class="fa-solid fa-xmark text-lg"></i></button>
      <div class="border-b pb-4 pr-10">
        <h2 id="modalTitle" class="text-2xl font-black text-gray-900"></h2>
        <p id="modalSubtitle" class="text-sm text-indigo-600 font-bold mt-1"></p>
      </div>
      <div id="modalGalleryContainer" class="space-y-2">
        <h4 class="font-bold text-gray-900 text-sm"><i class="fa-solid fa-images text-indigo-500 mr-1.5"></i> معرض الصور:</h4>
        <div id="modalGallery" class="flex overflow-x-auto gap-3 pb-2 snap-x"></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-4 text-sm text-gray-700 leading-relaxed">
          <div>
            <h4 class="font-bold text-gray-900 text-sm mb-1"><i class="fa-solid fa-circle-info text-blue-500 mr-1.5"></i> لمحة تاريخية:</h4>
            <p id="modalHistory" class="bg-blue-50/60 p-3 rounded-xl border border-blue-100"></p>
          </div>
          <div>
            <h4 class="font-bold text-gray-900 text-sm mb-1"><i class="fa-solid fa-bus text-amber-500 mr-1.5"></i> كيفية الوصول:</h4>
            <p id="modalTransport" class="bg-amber-50/60 p-3 rounded-xl border border-amber-100"></p>
          </div>
        </div>
        <div id="modalVideoContainer" class="space-y-2 hidden">
          <h4 class="font-bold text-gray-900 text-sm"><i class="fa-brands fa-youtube text-red-500 mr-1.5"></i> فيديو تعريفي:</h4>
          <div id="modalVideo" class="video-container bg-gray-200"></div>
        </div>
      </div>
      <div class="space-y-2">
        <h4 class="font-bold text-gray-900 text-sm"><i class="fa-solid fa-map-location-dot text-indigo-500 mr-1.5"></i> الموقع على الخريطة:</h4>
        <div id="modalMap" class="map-container bg-gray-200"></div>
      </div>
    </div>
  </div>

  <script>
    const placesData = [
      // === الشواطئ (Plages) ===
      { id: 'sidi_fredj', category: 'شواطئ', title: 'سيدي فرج (Sidi Fredj)', icon: '🏖️', desc: 'شاطئ عائلي مع مرسى ومطاعم.', history: 'يبعد 25 كم عن وسط العاصمة. يتميز بمرسى ترفيهي ومطاعم أسماك. الدخول مجاني، ومواقف السيارات متوفرة.', transport: 'الطريق السيار A1. يمكن الجمع بينه وبين زرالدة في نفس اليوم.', map: 'Sidi Fredj Alger', images: ['SIDI-FREDJ.png', 'images (9).jpeg', 'images (10).jpeg'], videos: [] },
      { id: 'zeralda', category: 'شواطئ', title: 'زرالدة (Zeralda)', icon: '🏖️', desc: 'شاطئ عائلي برمل ناعم.', history: 'يبعد 35 كم. الخيار الآمن للعائلات، به منتجعات ومرافق. مواقف السيارات مدفوعة (~200 دج).', transport: 'الطريق السيار A1. يفضل الوصول قبل الساعة 10 صباحاً في الصيف.', map: 'Zeralda plage Alger', images: ['images (3).jpeg', 'images (4).jpeg', 'images (5).jpeg'], videos: [] },
      { id: 'ain_taya', category: 'شواطئ', title: 'عين طاية (Ain Taya)', icon: '🏖️', desc: 'أقرب شاطئ للعاصمة.', history: 'يبعد 22 كم فقط. شاطئ شعبي ومزدحم في عطلات نهاية الأسبوع. الدخول مجاني لكن المواقف محدودة.', transport: 'الاتجاه شرقاً. يفضل الذهاب في أيام الأسبوع لتجنب الازدحام.', map: 'Ain Taya plage Alger', images: [], videos: [] },
      { id: 'club_pins', category: 'شواطئ', title: 'نادي الصنوبر (Club des Pins)', icon: '🏖️', desc: 'شاطئ هادئ بمياه ضحلة.', history: 'يبعد 28 كم. أقل ازدحاماً، مثالي للأطفال الصغار نظراً لهدوء المياه.', transport: 'الطريق السيار A1 باتجاه الغرب.', map: 'Club des Pins Alger', images: [], videos: [] },

      // === الحدائق (Parcs et jardins) ===
      { id: 'jardin_essai', category: 'حدائق', title: 'حديقة التجارب بالحامة', icon: '🌳', desc: 'الرئة الخضراء للجزائر.', history: 'تأسست عام 1832، وهي إحدى أهم الحدائق النباتية في العالم، تضم آلاف الأنواع النباتية النادرة.', transport: 'مترو الأنفاق (محطة الحامة) أو الحافلات.', map: 'Jardin d\'Essai El Hamma Alger', images: [], videos: [{ id: 'DOHY1JVqmDU', title: 'زيارة حديقة التجارب' }] },
      { id: 'parc_ben_aknoun', category: 'حدائق', title: 'حديقة بن عكنون', icon: '🌳', desc: 'حديقة حيوانات ومسارات.', history: 'حديقة ترفيهية شهيرة تضم حديقة حيوانات كبيرة ومساحات خضراء واسعة، وجهة عائلية بامتياز.', transport: 'حافلات أو طاكسي.', map: 'Parc Ben Aknoun Alger', images: ['images (11).jpeg', 'images (12).jpeg'], videos: [] },
      { id: 'bois_arcades', category: 'حدائق', title: 'غابة الأركاد (حيدرة)', icon: '🌳', desc: 'مثالي للجري.', history: 'غابة حضرية هادئة في قلب حيدرة، تحتوي على مسارات للمشي والجري، وتوفر متنفساً للأهالي.', transport: 'سيارة أو حافلة إلى حيدرة.', map: 'Bois des Arcades Hydra Alger', images: ['images (13).jpeg', 'images (14).jpeg', 'images (15).jpeg'], videos: [] },
      { id: 'hamma_park', category: 'حدائق', title: 'حديقة الحامة (Hamma Park)', icon: '🌳', desc: 'حديقة خضراء في قلب الجزائر.', history: 'من أكبر الحدائق الحضرية في إفريقيا، تضم بحيرة اصطناعية ومساحات خضراء شاسعة.', transport: 'مترو الأنفاق (محطة الحامة).', map: 'Hamma Park Alger', images: [], videos: [{ id: 'NNHh_lcMfPo', title: 'زيارة حديقة الحامة' }] },

      // === الثقافة والتاريخ (Culture & Histoire) ===
      { id: 'casbah', category: 'ثقافة وتاريخ', title: 'قصبة الجزائر', icon: '🏛️', desc: 'تراث عالمي لليونسكو.', history: 'موقع تراثي عالمي منذ 1992. المدينة القديمة للجزائر، تأسست في القرن العاشر، وتضم قصوراً عثمانية ومساجد تاريخية وأزقة ضيقة. كانت مركزاً للمقاومة خلال الاحتلال الفرنسي [citation:1][citation:7].', transport: 'محطة مترو ساحة الشهداء، أو الحافلات.', map: 'Casbah Alger', images: [], videos: [{ id: 'K7f2zx0UFsg', title: 'زيارة القصبة' }] },
      { id: 'martyrs_memorial', category: 'ثقافة وتاريخ', title: 'مقام الشهيد (Maqam Echahid)', icon: '🗼', desc: 'نصب تذكاري لضحايا الثورة.', history: 'نصب تذكاري ضخم يخلد ذكرى شهداء حرب الاستقلال الجزائرية. يقع على تلة تطل على العاصمة، ويضم متحف المجاهد (المتحف الوطني للجهاد) الذي يوثق الثورة [citation:1][citation:10].', transport: 'سيارة أو حافلة إلى منطقة رياض الفتح.', map: 'Maqam Echahid Alger', images: [], videos: [] },
      { id: 'bardo_museum', category: 'ثقافة وتاريخ', title: 'المتحف الوطني باردو', icon: '🏛️', desc: 'فن وتاريخ وإثنوغرافيا.', history: 'يقع في قصر يعود للقرن الثامن عشر. يضم مجموعات أثرية لما قبل التاريخ، وفنوناً إفريقية وتقليدية. تم ترسيمه كمتحف عام 1930 [citation:3][citation:9].', transport: 'حافلات أو طاكسي (حي الحامة/المدنية).', map: 'Musée du Bardo Alger', images: [], videos: [{ id: 'Bx-EhrdmjbA', title: 'زيارة متحف الباردو' }] },
      { id: 'antiquities_museum', category: 'ثقافة وتاريخ', title: 'المتحف الوطني للآثار القديمة', icon: '🏺', desc: 'من أقدم متاحف الجزائر.', history: 'دُشن في موقعه الحالي عام 1897. يضم كنوزاً أثرية من مختلف الحضارات التي تعاقبت على الجزائر (الرومانية، الإسلامية، العثمانية). يتميز بطرازه الأندلسي المغربي [citation:3][citation:9].', transport: 'وسط العاصمة، حديقة الحرية.', map: 'National Museum of Antiquities Alger', images: [], videos: [] },
      { id: 'fine_arts_museum', category: 'ثقافة وتاريخ', title: 'المتحف الوطني للفنون الجميلة', icon: '🎨', desc: 'أكبر متاحف الفن في إفريقيا.', history: 'افتُتح عام 1930. يضم مجموعة كبيرة من اللوحات والمنحوتات الأوروبية والجزائرية. يقع في منطقة رياض الفتح [citation:3][citation:12].', transport: 'قريب من مقام الشهيد.', map: 'Musée des Beaux-Arts Alger', images: [], videos: [] },
      { id: 'notre_dame', category: 'ثقافة وتاريخ', title: 'كنيسة سيدة إفريقيا', icon: '⛪', desc: 'إطلالة بانورامية على الخليج.', history: 'كنيسة كاثوليكية تقع على تلة تطل على خليج الجزائر، تتميز بمعمارها البيزنطي وقبتها الزرقاء. اكتمل بناؤها عام 1872.', transport: 'الترامواي أو الحافلات.', map: 'Notre-Dame d\'Afrique Alger', images: ['images (17).jpeg', 'images (18).jpeg', 'images (19).jpeg'], videos: [] },
      { id: 'grande_poste', category: 'ثقافة وتاريخ', title: 'البريد المركزي (Grande Poste)', icon: '🏛️', desc: 'معلم معماري مميز.', history: 'مبنى تاريخي في قلب العاصمة، يتميز بمعماره الموريسكي (أوائل القرن العشرين). أصبح اليوم متحفاً مخصصاً لتاريخ البريد في الجزائر [citation:1][citation:10].', transport: 'مترو الأنفاق (محطة البريد المركزي).', map: 'Grande Poste Alger', images: [], videos: [{ id: 'QQbkX8MeCWI', title: 'زيارة البريد المركزي' }] },
      { id: 'tipaza_ruins', category: 'ثقافة وتاريخ', title: 'آثار تيبازة (Tipaza)', icon: '🏛️', desc: 'موقع أثري روماني وفينيقي.', history: 'تبعد 70 كم عن العاصمة. موقع تراث عالمي لليونسكو. كانت مركزاً تجارياً فينقياً ثم قاعدة رومانية. تضم آثاراً رومانية، بازيليكا مسيحية، ومقبرة ملكية موريتانية [citation:2][citation:5][citation:8].', transport: 'الطريق الوطني RN11. يمكن الجمع بين زيارة الآثار والشاطئ.', map: 'Tipaza Ruins', images: [], videos: [] },

      // === المساجد (Mosquées) ===
      { id: 'djamaa_djazair', category: 'مساجد', title: 'جامع الجزائر الأعظم', icon: '🕌', desc: 'أكبر مسجد في إفريقيا.', history: 'ثالث أكبر مسجد في العالم، يضم أعلى مئذنة في العالم (265 متراً)، ويقع على البحر مباشرة. الدخول مجاني.', transport: 'مترو الأنفاق أو الحافلات، يقع في المحمدية.', map: 'Djamaa El Djazair Alger', images: [], videos: [] },
      { id: 'ketchaoua', category: 'مساجد', title: 'مسجد كتشاوة', icon: '🕌', desc: 'مسجد تاريخي في القصبة.', history: 'من أقدم مساجد الجزائر (يعود للعهد العثماني)، تم تحويله إلى كاتدرائية في العهد الفرنسي ثم أعيد إلى مسجد.', transport: 'محطة مترو ساحة الشهداء، ثم مشياً إلى القصبة.', map: 'Ketchaoua Mosque Alger', images: [], videos: [] },

      // === وكالات السفر (Agences) ===
      { id: 'agence_sofiane', category: 'وكالات سفر', title: 'وكالة صفيان (Sofiane)', icon: '✈️', desc: 'رحلات منظمة ومخصصة في الجزائر.', history: 'وكالة محلية مقرها الجزائر العاصمة. تنظم رحلات إلى الصحراء (غرداية، جانت، تاسيلي) والشمال (قسنطينة، جميلة، تيمقاد). أسعار الرحلات الجماعية تبدأ من حوالي 1,560 يورو (7 أيام).', transport: 'الاتصال عبر منصة Evaneos.', map: 'Alger', images: [], videos: [], links: { web: 'https://www.evaneos.fr/algerie/voyage/agences/69793-sofiane/' } },
      { id: 'kenzia_travel', category: 'وكالات سفر', title: 'كنزيا ترافل (Kenzia Travel)', icon: '✈️', desc: 'رحلات إلى القالة وعنابة.', history: 'عروض خاصة لرحلات 4 أيام إلى القالة وعنابة. السعر يبدأ من 19,999 دج للشخص (يشمل الإقامة، النقل، الفطور، والجولات).', transport: 'الاتصال: 0553176311 / 0551407193.', map: 'Alger', images: [], videos: [], links: { phone: '0553176311' } }
    ];

    let currentCategory = 'الكل';

    function renderCategories() {
      const bar = document.getElementById('categoriesBar');
      bar.innerHTML = '';
      const cats = ['الكل', ...new Set(placesData.map(p => p.category))];
      
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `px-4 py-2 rounded-xl font-bold text-sm transition ${cat === currentCategory ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-gray-600 border hover:bg-gray-50'}`;
        btn.innerText = cat;
        btn.onclick = () => { currentCategory = cat; renderCategories(); renderCards(); };
        bar.appendChild(btn);
      });
    }

    function renderCards() {
      const grid = document.getElementById('placesGrid');
      grid.innerHTML = '';
      
      const filtered = currentCategory === 'الكل' ? placesData : placesData.filter(p => p.category === currentCategory);
      
      filtered.forEach(place => {
        let randomImage = null;
        if (place.images && place.images.length > 0) {
          randomImage = place.images[Math.floor(Math.random() * place.images.length)];
        }
        
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl overflow-hidden cursor-pointer group shadow-sm border border-gray-100 hover:shadow-md transition";
        card.onclick = () => openModal(place);
        
        const imageHTML = randomImage 
          ? `<img src="${randomImage}" class="w-full h-40 object-cover group-hover:scale-105 transition duration-500" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'w-full h-40 flex items-center justify-center bg-indigo-50 text-4xl\\'>${place.icon}</div>'">`
          : `<div class="w-full h-40 flex items-center justify-center bg-indigo-50 text-4xl group-hover:bg-indigo-100 transition">${place.icon}</div>`;
          
        card.innerHTML = `
          ${imageHTML}
          <div class="p-4 space-y-1">
            <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">${place.category}</span>
            <h3 class="font-bold text-gray-900 text-sm mt-1">${place.title}</h3>
            <p class="text-xs text-gray-500 line-clamp-2">${place.desc}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(place) {
      document.getElementById('placeModal').classList.remove('hidden');
      document.getElementById('modalTitle').innerText = place.title;
      document.getElementById('modalSubtitle').innerText = `الفئة: ${place.category}`;
      document.getElementById('modalHistory').innerText = place.history;
      document.getElementById('modalTransport').innerText = place.transport;
      
      const mapQuery = encodeURIComponent(place.map);
      document.getElementById('modalMap').innerHTML = `<iframe src="https://www.google.com/maps?q=${mapQuery}&output=embed" allowfullscreen="" loading="lazy"></iframe>`;
      
      const galleryContainer = document.getElementById('modalGalleryContainer');
      const gallery = document.getElementById('modalGallery');
      gallery.innerHTML = '';
      if (place.images && place.images.length > 0) {
        galleryContainer.classList.remove('hidden');
        place.images.forEach(img => {
          gallery.innerHTML += `<div class="flex-shrink-0 w-48 h-32 snap-center rounded-xl overflow-hidden border border-gray-200 bg-gray-50"><img src="${img}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-gray-400 text-xs\\'>صورة غير متوفرة</div>'"></div>`;
        });
      } else {
        galleryContainer.classList.add('hidden');
      }

      const videoContainer = document.getElementById('modalVideoContainer');
      if (place.videos && place.videos.length > 0) {
        videoContainer.classList.remove('hidden');
        document.getElementById('modalVideo').innerHTML = `<iframe src="https://www.youtube.com/embed/${place.videos[0].id}" allowfullscreen></iframe>`;
      } else {
        videoContainer.classList.add('hidden');
        document.getElementById('modalVideo').innerHTML = '';
      }
      
      document.querySelector('#placeModal > div').scrollTop = 0;
    }

    function closeModal() {
      document.getElementById('placeModal').classList.add('hidden');
      document.getElementById('modalMap').innerHTML = '';
      document.getElementById('modalVideo').innerHTML = '';
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCategories();
      renderCards();
    });
  </script>
</body>
</html>
