<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loisirs & Voyages à Alger - ENSTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #fff7ed; }
    .dark body { background: #1a1410; }
    
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(249, 115, 22, 0.15); }
    .dark .glass-card { background: rgba(30, 20, 15, 0.95); border-color: rgba(249, 115, 22, 0.2); }
    
    .map-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .map-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    
    /* Carousel Gallery */
    .gallery-scroll { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .gallery-scroll::-webkit-scrollbar { height: 6px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: #fdba74; border-radius: 10px; }
    .gallery-item { flex: 0 0 auto; width: 200px; height: 150px; scroll-snap-align: start; border-radius: 0.75rem; overflow: hidden; border: 1px solid #e2e8f0; background: #f8fafc; cursor: pointer; transition: transform 0.3s ease; }
    .gallery-item:hover { transform: scale(1.05); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    .lang-btn { background: transparent; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: #64748b; transition: 0.2s; }
    .lang-btn:hover { background: #ffedd5; color: #9a3412; }
    .lang-btn.active { background: #f97316; color: white; }

    .filter-btn { transition: all 0.3s ease; }
    .filter-btn.active { background: #f97316; color: white; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="sticky top-0 z-50 glass-card backdrop-blur-md border-b px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <h1 class="font-bold text-gray-900 dark:text-white text-lg flex items-center gap-2">
        <i class="fa-solid fa-map-location-dot text-orange-500"></i> الترفيه والرحلات في العاصمة
      </h1>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1 bg-gray-50 dark:bg-slate-800 p-1 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm">
          <button onclick="setLanguage('ar')" id="btn-ar" class="lang-btn active">🇩🇿 عربي</button>
          <button onclick="setLanguage('fr')" id="btn-fr" class="lang-btn">🇫🇷 FR</button>
          <button onclick="setLanguage('en')" id="btn-en" class="lang-btn">🇬🇧 EN</button>
        </div>
        <a href="index.html" class="px-4 py-2 rounded-xl bg-orange-100 dark:bg-slate-800 text-orange-700 dark:text-orange-400 hover:bg-orange-200 text-xs font-bold transition">الرئيسية</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
    <div id="categoriesBar" class="flex flex-wrap gap-2 justify-center sticky top-[60px] z-40 glass-card p-2 rounded-2xl shadow-sm border border-orange-100 dark:border-slate-700"></div>
    <div id="placesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <!-- نافذة التفاصيل -->
  <div id="placeModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-4xl w-full p-6 lg:p-8 space-y-6 shadow-2xl relative max-h-[95vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 flex items-center justify-center transition z-20"><i class="fa-solid fa-xmark text-lg"></i></button>
      
      <div class="border-b border-orange-100 dark:border-slate-700 pb-4 pr-10">
        <h2 id="modalTitle" class="text-2xl font-black text-gray-900 dark:text-white"></h2>
        <p id="modalSubtitle" class="text-sm text-orange-600 dark:text-orange-400 font-bold mt-1"></p>
      </div>

      <!-- معرض الصور المتحرك -->
      <div id="modalGalleryContainer" class="space-y-2">
        <h4 class="font-bold text-gray-900 dark:text-white text-sm"><i class="fa-solid fa-images text-orange-500 mr-1.5"></i> معرض الصور:</h4>
        <div id="modalGallery" class="gallery-scroll"></div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-4 text-sm text-gray-700 dark:text-gray-300 leading-relaxed">
          <div>
            <h4 class="font-bold text-gray-900 dark:text-white text-sm mb-1"><i class="fa-solid fa-circle-info text-blue-500 mr-1.5"></i> لمحة تاريخية:</h4>
            <p id="modalHistory" class="bg-blue-50/60 dark:bg-blue-900/20 p-3 rounded-xl border border-blue-100 dark:border-blue-800"></p>
          </div>
          <div>
            <h4 class="font-bold text-gray-900 dark:text-white text-sm mb-1"><i class="fa-solid fa-bus text-amber-500 mr-1.5"></i> كيفية الوصول:</h4>
            <p id="modalTransport" class="bg-amber-50/60 dark:bg-amber-900/20 p-3 rounded-xl border border-amber-100 dark:border-amber-800"></p>
          </div>
        </div>

        </div>
      </div>

      </div>
    </div>
  </div>

      { id: 'martyrs_memorial', category: 'ثقافة وتاريخ', title: 'مقام الشهيد', icon: '🗼', history: 'نصب تذكاري ضخم يخلد ذكرى شهداء حرب الاستقلال الجزائرية.', transport: 'سيارة أو حافلة إلى منطقة رياض الفتح.', map: 'Maqam Echahid Alger', images: ['images (45).jpeg', 'images (43).jpeg', 'images (44).jpeg' ], videos: [{ id: 'URc2i9CWkxk', title: 'مقام الشهيد' }] },

      { id: 'grande_poste', category: 'ثقافة وتاريخ', title: 'البريد المركزي', icon: '🏛️', history: 'مبنى تاريخي في قلب العاصمة، يتميز بمعماره الموريسكي.', transport: 'مترو الأنفاق (محطة البريد المركزي).', map: 'Grande Poste Alger', images: [ 'images (58).jpeg', 'images (59).jpeg' ], videos: [{ id: 'QQbkX8MeCWI', title: 'زيارة البريد المركزي' }] },

    let currentCategory = 'الكل';

    function renderCategories() {
      const bar = document.getElementById('categoriesBar');
      bar.innerHTML = '';
      const cats = ['الكل', ...new Set(placesData.map(p => p.category))];
      
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `filter-btn px-4 py-2 rounded-xl font-bold text-sm border border-orange-200 dark:border-slate-700 ${cat === currentCategory ? 'active' : 'bg-white dark:bg-slate-800 text-gray-600 dark:text-gray-300'}`;
        btn.innerText = cat;
        btn.onclick = () => { currentCategory = cat; renderCategories(); renderCards(); };
        bar.appendChild(btn);
      });
    }

    function renderCards() {
      const grid = document.getElementById('placesGrid');
      grid.innerHTML = '';
      
      const filtered = currentCategory === 'الكل' ? placesData : placesData.filter(p => p.category === currentCategory);
      
      filtered.forEach(place => {
        let randomImage = null;
        if (place.images && place.images.length > 0) {
          randomImage = place.images[Math.floor(Math.random() * place.images.length)];
        }
        
        const card = document.createElement('div');
        card.className = "glass-card rounded-2xl overflow-hidden cursor-pointer group shadow-sm border border-orange-100 dark:border-slate-700 hover:shadow-lg transition";
        card.onclick = () => openModal(place);
        
        const imageHTML = randomImage 
          ? `<img src="${randomImage}" class="w-full h-40 object-cover group-hover:scale-105 transition duration-500" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'w-full h-40 flex items-center justify-center bg-orange-50 dark:bg-slate-800 text-4xl\\'>${place.icon}</div>'">`
          : `<div class="w-full h-40 flex items-center justify-center bg-orange-50 dark:bg-slate-800 text-4xl group-hover:bg-orange-100 transition">${place.icon}</div>`;
          
        card.innerHTML = `
          ${imageHTML}
          <div class="p-4 space-y-1">
            <span class="text-[10px] font-bold text-orange-600 bg-orange-50 dark:bg-slate-800 px-2 py-0.5 rounded-md">${place.category}</span>
            <h3 class="font-bold text-gray-900 dark:text-white text-sm mt-1">${place.title}</h3>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(place) {
      document.getElementById('placeModal').classList.remove('hidden');
      document.getElementById('modalTitle').innerText = place.title;
      document.getElementById('modalSubtitle').innerText = `الفئة: ${place.category}`;
      document.getElementById('modalHistory').innerText = place.history;
      document.getElementById('modalTransport').innerText = place.transport;
      
      const mapQuery = encodeURIComponent(place.map);
      document.getElementById('modalMap').innerHTML = `<iframe src="https://www.google.com/maps?q=${mapQuery}&output=embed" allowfullscreen="" loading="lazy"></iframe>`;
      
      // Carousel Gallery
      const galleryContainer = document.getElementById('modalGalleryContainer');
      const gallery = document.getElementById('modalGallery');
      gallery.innerHTML = '';
      if (place.images && place.images.length > 0) {
        galleryContainer.classList.remove('hidden');
        place.images.forEach(img => {
          gallery.innerHTML += `<div class="gallery-item" onclick="window.open('${img}', '_blank')"><img src="${img}" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-gray-400 text-xs p-2 text-center\\'>صورة غير متوفرة</div>'"></div>`;
        });
      } else {
        galleryContainer.classList.add('hidden');
      }

      // عرض جميع الفيديوهات
      const videosContainer = document.getElementById('modalVideosContainer');
      videosContainer.innerHTML = '';
      if (place.videos && place.videos.length > 0) {
        videosContainer.classList.remove('hidden');
        place.videos.forEach((video, idx) => {
          videosContainer.innerHTML += `
            <div class="space-y-2">
              <h4 class="font-bold text-gray-900 dark:text-white text-sm"><i class="fa-brands fa-youtube text-red-500 mr-1.5"></i> ${video.title || 'فيديو ' + (idx + 1)}</h4>
              <div class="video-container bg-gray-200 dark:bg-slate-700">
                <iframe src="https://www.youtube.com/embed/${video.id}" allowfullscreen></iframe>
              </div>
            </div>
          `;
        });
      } else {
        videosContainer.classList.add('hidden');
      }
      
      document.querySelector('#placeModal > div').scrollTop = 0;
    }

    function closeModal() {
      document.getElementById('placeModal').classList.add('hidden');
      document.getElementById('modalMap').innerHTML = '';
      document.getElementById('modalVideosContainer').innerHTML = '';
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCategories();
      renderCards();
    });
  </script>
</body>
</html>
