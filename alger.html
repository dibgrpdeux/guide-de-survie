  <style>
    body { font-family: 'Cairo', sans-serif; background: #fff7ed; transition: background-color 0.4s, color 0.4s; }
    html.dark body { background: #1a1410; color: #f8fafc; }
    
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(249, 115, 22, 0.15); transition: all 0.3s ease; }
    html.dark .glass-card { background: rgba(30, 20, 15, 0.95); border-color: rgba(249, 115, 22, 0.2); }
    
    .map-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .map-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    
    .gallery-scroll { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .gallery-scroll::-webkit-scrollbar { height: 6px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: #fdba74; border-radius: 10px; }
    .gallery-item { flex: 0 0 auto; width: 200px; height: 150px; scroll-snap-align: start; border-radius: 0.75rem; overflow: hidden; border: 1px solid #e2e8f0; background: #f8fafc; cursor: pointer; transition: transform 0.3s ease; }
    .gallery-item:hover { transform: scale(1.05); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    .lang-btn { background: transparent; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: #64748b; transition: 0.2s; }
    .lang-btn:hover { background: #ffedd5; color: #9a3412; }
    .lang-btn.active { background: #f97316; color: white; }

    .filter-btn { transition: all 0.3s ease; }
    .filter-btn.active { background: #f97316; color: white; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); }

    /* Chat */
    #chatWindow { position: fixed; bottom: 110px; right: 20px; z-index: 1001; width: 320px; max-height: 420px; background: white; border-radius: 1rem; box-shadow: 0 20px 50px rgba(0,0,0,0.25); border: 1px solid #fed7aa; display: none; flex-direction: column; }
    #chatWindow.open { display: flex; }
    html.dark #chatWindow { background: #1e293b; border-color: #334155; color: #f8fafc; }
    @media (max-width: 640px) { #chatWindow { width: calc(100vw - 2rem); right: 1rem; left: 1rem; } }

    @keyframes kangarooJump { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-20px) scale(1.1) rotate(-8deg); } 60% { transform: translateY(-10px) scale(1) rotate(5deg); } }

    button, a, .glass-card { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>

      { id: 'djamaa_djazair', category: 'mosques', title: { ar: "جامع الجزائر الأعظم", fr: "Djamaa El Djazair", en: "Djamaa El Djazair" }, icon: '🕌', history: { ar: "ثالث أكبر مسجد في العالم، يضم أعلى مئذنة في العالم (265 متراً).", fr: "3e plus grande mosquée au monde, minaret le plus haut (265 m).", en: "3rd largest mosque in the world, tallest minaret (265 m)." }, transport: { ar: "مترو الأنفاق أو الحافلات، المحمدية.", fr: "Métro ou bus, Mohammadia.", en: "Metro or bus, Mohammadia." }, map: 'Djamaa El Djazair Alger', images: ['images (60).jpeg','images (61).jpeg','images (62).jpeg','images (63).jpeg'], videos: [{ id: 'jLedHzZuxE4', title: 'Djamaa El Djazair' }] },
      { id: 'ketchaoua', category: 'mosques', title: { ar: "مسجد كتشاوة", fr: "Mosquée Ketchaoua", en: "Ketchaoua Mosque" }, icon: '🕌', history: { ar: "من أقدم مساجد الجزائر (العهد العثماني).", fr: "L'une des plus anciennes mosquées d'Alger (époque ottomane).", en: "One of the oldest mosques in Algiers (Ottoman era)." }, transport: { ar: "محطة مترو ساحة الشهداء ثم مشياً.", fr: "Métro Place des Martyrs puis à pied.", en: "Metro Place des Martyrs then walk." }, map: 'Ketchaoua Mosque Alger', images: ['images (68).jpeg','images (69).jpeg','images (70).jpeg','images (71).jpeg','images (72).jpeg'], videos: [] }
    ];

    <script>
    let currentLang = localStorage.getItem('enstp_lang') || 'ar';
    let currentCategory = 'all';

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    function t(key) {
      const dict = window.ALGER_TRANSLATIONS[currentLang] || window.ALGER_TRANSLATIONS.ar;
      return dict[key] || key;
    }

    window.ALGER_TRANSLATIONS = {
      ar: {
        page_title: "الترفيه والسياحة - ENSTP", nav_home: "الرئيسية",
        leisure_title: "الترفيه والرحلات في العاصمة",
        cat_all: "الكل", cat_beaches: "شواطئ", cat_parks: "حدائق", cat_culture: "ثقافة وتاريخ", cat_mosques: "مساجد",
        modal_category: "الفئة:", modal_gallery: "معرض الصور:", modal_history: "لمحة تاريخية:",
        modal_transport: "كيفية الوصول:", modal_map: "الموقع على الخريطة:",
        chat_title: "المساعد الافتراضي", chat_welcome: "مرحباً! 👋 كيف يمكنني مساعدتك؟",
        chat_placeholder: "اكتب سؤالك...", chat_default: "شكراً!",
        chat_hello: "أهلاً!", chat_thanks: "على الرحب والسعة!",
        chat_leisure: "تصفح أماكن الترفيه في هذه الصفحة."
      },
      fr: {
        page_title: "Loisirs à Alger - ENSTP", nav_home: "Accueil",
        leisure_title: "Loisirs et sorties à Alger",
        cat_all: "Tous", cat_beaches: "Plages", cat_parks: "Parcs", cat_culture: "Culture", cat_mosques: "Mosquées",
        modal_category: "Catégorie :", modal_gallery: "Galerie :", modal_history: "Aperçu historique :",
        modal_transport: "Comment s'y rendre :", modal_map: "Emplacement :",
        chat_title: "Assistant virtuel", chat_welcome: "Bonjour ! 👋 Comment puis-je vous aider ?",
        chat_placeholder: "Votre question...", chat_default: "Merci !",
        chat_hello: "Bienvenue !", chat_thanks: "Avec plaisir !",
        chat_leisure: "Parcourez les lieux de loisirs sur cette page."
      },
      en: {
        page_title: "Leisure in Algiers - ENSTP", nav_home: "Home",
        leisure_title: "Leisure & Trips in Algiers",
        cat_all: "All", cat_beaches: "Beaches", cat_parks: "Parks", cat_culture: "Culture", cat_mosques: "Mosques",
        modal_category: "Category:", modal_gallery: "Gallery:", modal_history: "Historical overview:",
        modal_transport: "How to get there:", modal_map: "Location:",
        chat_title: "Virtual Assistant", chat_welcome: "Hello! 👋 How can I help you?",
        chat_placeholder: "Your question...", chat_default: "Thanks!",
        chat_hello: "Welcome!", chat_thanks: "You're welcome!",
        chat_leisure: "Browse leisure places on this page."
      }
    };

    window.applyAlgerTranslation = function(lang) {
      const dict = window.ALGER_TRANSLATIONS[lang] || window.ALGER_TRANSLATIONS.ar;
      if (dict.page_title) document.title = dict.page_title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          const icon = el.querySelector('i');
          if (icon) { el.innerHTML = ''; el.appendChild(icon); el.appendChild(document.createTextNode(' ' + dict[key])); }
          else el.innerText = dict[key];
        }
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (dict[key]) el.placeholder = dict[key];
      });
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;
      if (typeof renderCategories === 'function') renderCategories();
      if (typeof renderCards === 'function') renderCards();
    };

    window.setLanguage = function(lang) {
      currentLang = lang;
      localStorage.setItem('enstp_lang', lang);
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + lang);
      if (activeBtn) activeBtn.classList.add('active');
      window.applyAlgerTranslation(lang);
    };

    function renderCategories() {
      const bar = document.getElementById('categoriesBar');
      bar.innerHTML = '';
      const cats = ['all', 'beaches', 'parks', 'culture', 'mosques'];
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `filter-btn px-4 py-2 rounded-xl font-bold text-sm border border-orange-200 dark:border-slate-700 ${cat === currentCategory ? 'active' : 'bg-white dark:bg-slate-800 text-gray-600 dark:text-gray-300'}`;
        btn.innerText = t('cat_' + cat);
        btn.onclick = () => { currentCategory = cat; renderCategories(); renderCards(); };
        bar.appendChild(btn);
      });
    }

    function renderCards() {
      const grid = document.getElementById('placesGrid');
      grid.innerHTML = '';
      const filtered = currentCategory === 'all' ? placesData : placesData.filter(p => p.category === currentCategory);
      
      filtered.forEach(place => {
        let randomImage = null;
        if (place.images && place.images.length > 0) {
          randomImage = place.images[Math.floor(Math.random() * place.images.length)];
        }
        
        const card = document.createElement('div');
        card.className = "glass-card rounded-2xl overflow-hidden cursor-pointer group shadow-sm border border-orange-100 dark:border-slate-700 hover:shadow-lg transition";
        card.onclick = () => openModal(place);
        
        const imageHTML = randomImage 
          ? `<img src="${randomImage}" class="w-full h-40 object-cover group-hover:scale-105 transition duration-500" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-40 flex items-center justify-center bg-orange-50 dark:bg-slate-800 text-4xl\\'>${place.icon}</div>'">`
          : `<div class="w-full h-40 flex items-center justify-center bg-orange-50 dark:bg-slate-800 text-4xl group-hover:bg-orange-100 transition">${place.icon}</div>`;
          
        const title = place.title[currentLang] || place.title.ar;
        const catName = t('cat_' + place.category);

        card.innerHTML = `
          ${imageHTML}
          <div class="p-4 space-y-1">
            <span class="text-[10px] font-bold text-orange-600 bg-orange-50 dark:bg-slate-800 px-2 py-0.5 rounded-md">${catName}</span>
            <h3 class="font-bold text-gray-900 dark:text-white text-sm mt-1">${title}</h3>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(place) {
      document.getElementById('placeModal').classList.remove('hidden');
      const title = place.title[currentLang] || place.title.ar;
      const history = place.history[currentLang] || place.history.ar;
      const transport = place.transport[currentLang] || place.transport.ar;
      
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalSubtitle').innerText = `${t('modal_category')} ${t('cat_' + place.category)}`;
      document.getElementById('modalHistory').innerText = history;
      document.getElementById('modalTransport').innerText = transport;
      
      const mapQuery = encodeURIComponent(place.map);
      document.getElementById('modalMap').innerHTML = `<iframe src="https://www.google.com/maps?q=${mapQuery}&output=embed" allowfullscreen loading="lazy"></iframe>`;
      
      const galleryContainer = document.getElementById('modalGalleryContainer');
      const gallery = document.getElementById('modalGallery');
      gallery.innerHTML = '';
      if (place.images && place.images.length > 0) {
        galleryContainer.classList.remove('hidden');
        place.images.forEach(img => {
          gallery.innerHTML += `<div class="gallery-item" onclick="window.open('${img}', '_blank')"><img src="${img}" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-gray-400 text-xs p-2 text-center\\'>Image</div>'"></div>`;
        });
      } else {
        galleryContainer.classList.add('hidden');
      }

      const videosContainer = document.getElementById('modalVideosContainer');
      videosContainer.innerHTML = '';
      if (place.videos && place.videos.length > 0) {
        videosContainer.classList.remove('hidden');
        place.videos.forEach((video, idx) => {
          videosContainer.innerHTML += `
            <div class="space-y-2">
              <h4 class="font-bold text-gray-900 dark:text-white text-sm"><i class="fa-brands fa-youtube text-red-500 mr-1.5"></i> ${video.title || 'Video ' + (idx + 1)}</h4>
              <div class="video-container bg-gray-200 dark:bg-slate-700">
                <iframe src="https://www.youtube.com/embed/${video.id}" allowfullscreen></iframe>
              </div>
            </div>
          `;
        });
      } else {
        videosContainer.classList.add('hidden');
      }
      
      document.querySelector('#placeModal > div').scrollTop = 0;
    }

    function closeModal() {
      document.getElementById('placeModal').classList.add('hidden');
      document.getElementById('modalMap').innerHTML = '';
      document.getElementById('modalVideosContainer').innerHTML = '';
    }

    function toggleChat() {
      const chat = document.getElementById('chatWindow');
      if (!chat) return;
      chat.classList.toggle('hidden');
      chat.classList.toggle('open');
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const body = document.getElementById('chatBody');
      if (!input || !body) return;
      const msg = input.value.trim();
      if (!msg) return;
      body.innerHTML += `<div style="display:flex;justify-content:flex-end;"><div style="background:#f97316;color:white;padding:8px 12px;border-radius:12px 12px 4px 12px;max-width:80%;font-size:13px;">${msg}</div></div>`;
      input.value = '';
      body.scrollTop = body.scrollHeight;
      setTimeout(() => {
        let reply = t('chat_default');
        const m = msg.toLowerCase();
        if (m.includes("سياحة") || m.includes("ترفيه") || m.includes("tourisme") || m.includes("leisure") || m.includes("plage") || m.includes("شاطئ")) reply = "🏖️ " + t('chat_leisure');
        else if (m.includes("سلام") || m.includes("مرحبا") || m.includes("hello") || m.includes("bonjour")) reply = "👋 " + t('chat_hello');
        else if (m.includes("شكرا") || m.includes("merci") || m.includes("thanks")) reply = "💛 " + t('chat_thanks');
        body.innerHTML += `<div style="display:flex;justify-content:flex-start;"><div style="background:#ffedd5;color:#7c2d12;padding:8px 12px;border-radius:12px 12px 12px 4px;max-width:80%;font-size:13px;">${reply}</div></div>`;
        body.scrollTop = body.scrollHeight;
      }, 500);
    }

    const kangarooContainer = document.getElementById('kangarooContainer');
    const kangarooSvg = document.getElementById('kangarooSvg');
    if (kangarooContainer) {
      kangarooContainer.addEventListener('click', () => {
        if (kangarooSvg) {
          kangarooSvg.style.animation = 'none';
          kangarooSvg.offsetHeight;
          kangarooSvg.style.animation = 'kangarooJump 0.6s ease';
          setTimeout(() => { kangarooSvg.style.animation = ''; }, 700);
        }
        toggleChat();
      });
      kangarooContainer.addEventListener('mouseenter', () => { if (kangarooSvg) kangarooSvg.style.transform = 'scale(1.1)'; });
      kangarooContainer.addEventListener('mouseleave', () => { if (kangarooSvg) kangarooSvg.style.transform = ''; });
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      const savedLang = localStorage.getItem('enstp_lang') || 'ar';
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + savedLang);
      if (activeBtn) activeBtn.classList.add('active');
      currentLang = savedLang;
      window.applyAlgerTranslation(savedLang);
      renderCategories();
      renderCards();
      const chatInput = document.getElementById('chatInput');
      if (chatInput) {
        chatInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });
      }
    });
  </script>
</body>
</html>
