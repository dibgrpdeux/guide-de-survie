<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loisirs à Alger - ENSTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; }
    .map-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .map-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <h1 class="font-bold text-gray-900 text-lg"><i class="fa-solid fa-map-location-dot text-teal-600"></i> الترفيه في العاصمة</h1>
      <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-xs font-bold">الرئيسية</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div id="placesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <!-- نافذة التفاصيل -->
  <div id="placeModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-4xl w-full p-6 lg:p-8 space-y-6 shadow-2xl relative max-h-[95vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 flex items-center justify-center transition z-20"><i class="fa-solid fa-xmark text-lg"></i></button>
      
      <div class="border-b pb-4 pr-10">
        <h2 id="modalTitle" class="text-2xl font-black text-gray-900"></h2>
        <p id="modalSubtitle" class="text-sm text-indigo-600 font-bold mt-1"></p>
      </div>

      <div id="modalGalleryContainer" class="space-y-2">
        <h4 class="font-bold text-gray-900 text-sm"><i class="fa-solid fa-images text-indigo-500 mr-1.5"></i> معرض الصور:</h4>
        <div id="modalGallery" class="flex overflow-x-auto gap-3 pb-2 snap-x"></div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-4 text-sm text-gray-700 leading-relaxed">
          <div>
            <h4 class="font-bold text-gray-900 text-sm mb-1"><i class="fa-solid fa-landmark text-amber-500 mr-1.5"></i> لمحة تاريخية:</h4>
            <p id="modalHistory" class="bg-amber-50/60 p-3 rounded-xl border border-amber-100"></p>
          </div>
          <div>
            <h4 class="font-bold text-gray-900 text-sm mb-1"><i class="fa-solid fa-bus text-blue-500 mr-1.5"></i> كيفية الوصول:</h4>
            <p id="modalTransport" class="bg-blue-50/60 p-3 rounded-xl border border-blue-100"></p>
          </div>
        </div>
        <div id="modalVideoContainer" class="space-y-2 hidden">
          <h4 class="font-bold text-gray-900 text-sm"><i class="fa-brands fa-youtube text-red-500 mr-1.5"></i> فيديو تعريفي:</h4>
          <div id="modalVideo" class="video-container bg-gray-200"></div>
        </div>
      </div>

      <div class="space-y-2">
        <h4 class="font-bold text-gray-900 text-sm"><i class="fa-solid fa-map-location-dot text-indigo-500 mr-1.5"></i> الموقع على الخريطة:</h4>
        <div id="modalMap" class="map-container bg-gray-200"></div>
      </div>
    </div>
  </div>

  <script>
    const placesData = [
      { id: 'sidi_fredj', title: 'سيدي فرج (Sidi Fredj)', category: 'شواطئ', icon: '🏖️', history: 'من أقدم وأشهر الشواطئ في الجزائر العاصمة...', transport: 'يمكن الوصول إليه عبر الحافلات...', map: 'Sidi Fredj Alger', images: ['SIDI-FREDJ.png', 'images (9).jpeg', 'images (10).jpeg'], videos: [] },
      { id: 'zeralda', title: 'زرالدة (Zeralda)', category: 'شواطئ', icon: '🏖️', history: 'شاطئ واسع يقع غرب العاصمة...', transport: 'الحافلات المتجهة إلى زرالدة...', map: 'Zeralda plage Alger', images: ['images (3).jpeg', 'images (4).jpeg', 'images (5).jpeg'], videos: [] },
      { id: 'jardin_essai', title: 'حديقة التجارب بالحامة', category: 'حدائق', icon: '🌳', history: 'تأسست عام 1832...', transport: 'مترو الأنفاق (محطة الحامة)...', map: 'Jardin d\'Essai El Hamma Alger', images: [], videos: [{ id: 'DOHY1JVqmDU', title: 'زيارة حديقة التجارب' }] },
      { id: 'casbah', title: 'قصبة الجزائر', category: 'ثقافة', icon: '🏛️', history: 'موقع تراثي عالمي...', transport: 'محطة مترو ساحة الشهداء...', map: 'Casbah Alger', images: [], videos: [{ id: 'K7f2zx0UFsg', title: 'زيارة القصبة' }] }
    ];

    function renderCards() {
      const grid = document.getElementById('placesGrid');
      grid.innerHTML = '';
      placesData.forEach(place => {
        let randomImage = null;
        if (place.images && place.images.length > 0) {
          randomImage = place.images[Math.floor(Math.random() * place.images.length)];
        }
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl overflow-hidden cursor-pointer group shadow-sm border border-gray-100 hover:shadow-md transition";
        card.onclick = () => openModal(place);
        const imageHTML = randomImage 
          ? `<img src="${randomImage}" class="w-full h-40 object-cover group-hover:scale-105 transition duration-500" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'w-full h-40 flex items-center justify-center bg-indigo-50 text-4xl\\'>${place.icon}</div>'">`
          : `<div class="w-full h-40 flex items-center justify-center bg-indigo-50 text-4xl group-hover:bg-indigo-100 transition">${place.icon}</div>`;
        card.innerHTML = `
          ${imageHTML}
          <div class="p-4 space-y-1">
            <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">${place.category}</span>
            <h3 class="font-bold text-gray-900 text-sm mt-1">${place.title}</h3>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(place) {
      document.getElementById('placeModal').classList.remove('hidden');
      document.getElementById('modalTitle').innerText = place.title;
      document.getElementById('modalSubtitle').innerText = `الفئة: ${place.category}`;
      document.getElementById('modalHistory').innerText = place.history;
      document.getElementById('modalTransport').innerText = place.transport;
      
      const mapQuery = encodeURIComponent(place.map);
      document.getElementById('modalMap').innerHTML = `<iframe src="https://www.google.com/maps?q=${mapQuery}&output=embed" allowfullscreen="" loading="lazy"></iframe>`;
      
      const galleryContainer = document.getElementById('modalGalleryContainer');
      const gallery = document.getElementById('modalGallery');
      gallery.innerHTML = '';
      if (place.images && place.images.length > 0) {
        galleryContainer.classList.remove('hidden');
        place.images.forEach(img => {
          gallery.innerHTML += `<div class="flex-shrink-0 w-48 h-32 snap-center rounded-xl overflow-hidden border border-gray-200 bg-gray-50"><img src="${img}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-gray-400 text-xs\\'>صورة غير متوفرة</div>'"></div>`;
        });
      } else {
        galleryContainer.classList.add('hidden');
      }

      const videoContainer = document.getElementById('modalVideoContainer');
      if (place.videos && place.videos.length > 0) {
        videoContainer.classList.remove('hidden');
        document.getElementById('modalVideo').innerHTML = `<iframe src="https://www.youtube.com/embed/${place.videos[0].id}" allowfullscreen></iframe>`;
      } else {
        videoContainer.classList.add('hidden');
        document.getElementById('modalVideo').innerHTML = '';
      }
      document.querySelector('#placeModal > div').scrollTop = 0;
    }

    function closeModal() {
      document.getElementById('placeModal').classList.add('hidden');
      document.getElementById('modalMap').innerHTML = '';
      document.getElementById('modalVideo').innerHTML = '';
    }

    window.addEventListener('DOMContentLoaded', renderCards);
  </script>
</body>
</html>
