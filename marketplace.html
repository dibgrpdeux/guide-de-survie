<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سوق الطالب - ENSTP</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; }
    .dark body { background: #0f172a; color: #f8fafc; }
    
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 1); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05); }
    .dark .glass-card { background: rgba(30, 41, 59, 0.9); border-color: rgba(255,255,255,0.1); }
    
    .product-card { transition: all 0.3s ease; }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -5px rgba(249, 115, 22, 0.15); border-color: #f97316; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 lg:p-8">

  <!-- الهيدر -->
  <header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-gray-200 dark:border-slate-700 px-4 py-3.5 mb-8 rounded-2xl">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-brand-500 flex items-center justify-center text-white font-black text-lg shadow-md">
          <i class="fa-solid fa-store"></i>
        </div>
        <div>
          <h1 class="font-bold text-gray-900 dark:text-white text-base leading-tight">سوق الطالب</h1>
          <p class="text-[11px] text-gray-500 dark:text-gray-400">بيع وشراء بين طلبة ENSTP</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-gray-100 dark:bg-slate-800 flex items-center justify-center text-gray-600 dark:text-gray-300 transition">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:block text-brand-400"></i>
        </button>
        <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-slate-700 text-xs font-bold transition">الرئيسية</a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto w-full flex-grow space-y-8">

    <!-- إضافة منتج -->
    <div class="glass-card rounded-3xl p-6 md:p-8 border border-brand-100 dark:border-slate-700">
      <h2 class="text-xl font-black text-gray-900 dark:text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-brand-500"></i> أضف منتجك للبيع
      </h2>
      <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1 text-gray-700 dark:text-gray-300">اسم المنتج:</label>
          <input type="text" id="prod-title" required placeholder="مثال: آلة حاسبة علمية Casio" class="w-full p-3 rounded-xl border border-gray-200 dark:border-slate-600 bg-gray-50 dark:bg-slate-900 outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1 text-gray-700 dark:text-gray-300">السعر (دج):</label>
          <input type="number" id="prod-price" required placeholder="مثال: 2500" class="w-full p-3 rounded-xl border border-gray-200 dark:border-slate-600 bg-gray-50 dark:bg-slate-900 outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1 text-gray-700 dark:text-gray-300">رقم الهاتف (واتساب):</label>
          <input type="tel" id="prod-phone" required placeholder="05XXXXXXXX" dir="ltr" class="w-full p-3 rounded-xl border border-gray-200 dark:border-slate-600 bg-gray-50 dark:bg-slate-900 outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1 text-gray-700 dark:text-gray-300">رابط الصورة (اختياري):</label>
          <input type="url" id="prod-image" placeholder="https://..." dir="ltr" class="w-full p-3 rounded-xl border border-gray-200 dark:border-slate-600 bg-gray-50 dark:bg-slate-900 outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-bold mb-1 text-gray-700 dark:text-gray-300">الوصف / التفاصيل:</label>
          <textarea id="prod-desc" rows="2" required placeholder="حالة المنتج، سبب البيع..." class="w-full p-3 rounded-xl border border-gray-200 dark:border-slate-600 bg-gray-50 dark:bg-slate-900 outline-none focus:ring-2 focus:ring-brand-500"></textarea>
        </div>
        <button type="submit" class="md:col-span-2 bg-gradient-to-r from-brand-500 to-brand-600 text-white font-black text-lg py-3 rounded-xl shadow-lg hover:shadow-brand-500/40 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-upload"></i> نشر المنتج
        </button>
      </form>
    </div>

    <!-- شبكة المنتجات -->
    <div>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-black text-gray-900 dark:text-white flex items-center gap-2">
          <i class="fa-solid fa-box-open text-brand-500"></i> المنتجات المعروضة
        </h2>
        <div class="relative w-64 hidden md:block">
          <i class="fa-solid fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="search-products" placeholder="ابحث عن منتج..." class="w-full pr-10 pl-4 py-2 rounded-xl border border-gray-200 dark:border-slate-700 text-sm outline-none">
        </div>
      </div>
      
      <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- سيتم إدراج المنتجات هنا -->
      </div>
      
      <div id="no-products" class="hidden text-center py-16">
        <i class="fa-solid fa-box-open text-6xl text-gray-300 dark:text-slate-600 mb-4"></i>
        <p class="text-gray-500 dark:text-gray-400 text-lg font-bold">لا توجد منتجات معروضة حالياً.</p>
        <p class="text-sm text-gray-400 mt-1">كن أول من يضيف منتجاً!</p>
      </div>
    </div>

  </main>

  <footer class="border-t border-gray-200 dark:border-slate-700 py-6 text-center text-xs text-gray-500 mt-8">
    <p>© 2026 ENSTP القبة - سوق الطالب.</p>
  </footer>

  <script>
    // Dark Mode
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    // البيانات
    let products = JSON.parse(localStorage.getItem('enstp_marketplace')) || [];

    // عرض المنتجات
    function renderProducts(filter = '') {
      const grid = document.getElementById('productsGrid');
      const noProd = document.getElementById('no-products');
      
      const filtered = products.filter(p => p.title.toLowerCase().includes(filter.toLowerCase()) || p.desc.toLowerCase().includes(filter.toLowerCase()));

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noProd.classList.remove('hidden');
        return;
      }
      noProd.classList.add('hidden');

      grid.innerHTML = filtered.map((p, i) => {
        let waPhone = p.phone.replace(/^0/, '213');
        let imgHtml = p.image 
          ? `<img src="${p.image}" class="w-full h-48 object-cover rounded-t-2xl" onerror="this.src='https://via.placeholder.com/400x300/f1f5f9/94a3b8?text=No+Image'">` 
          : `<div class="w-full h-48 bg-gray-100 dark:bg-slate-800 rounded-t-2xl flex items-center justify-center"><i class="fa-solid fa-image text-4xl text-gray-300"></i></div>`;

        return `
        <div class="glass-card product-card rounded-2xl overflow-hidden border border-gray-100 dark:border-slate-700 flex flex-col">
          ${imgHtml}
          <div class="p-4 flex-grow flex flex-col">
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg text-gray-900 dark:text-white">${p.title}</h3>
              <span class="bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-400 font-black text-sm px-2 py-1 rounded-lg whitespace-nowrap">${p.price} دج</span>
            </div>
            <p class="text-sm text-gray-600 dark:text-gray-400 mb-4 flex-grow">${p.desc}</p>
            <div class="flex gap-2 mt-auto">
              <a href="https://wa.me/${waPhone}?text=مرحباً، أنا مهتم بمنتجك: ${p.title}" target="_blank" class="flex-1 bg-green-500 text-white font-bold py-2 rounded-xl text-sm hover:bg-green-600 transition flex items-center justify-center gap-1">
                <i class="fa-brands fa-whatsapp"></i> تواصل
              </a>
              <button onclick="deleteProduct(${i})" class="bg-red-50 text-red-500 px-3 py-2 rounded-xl hover:bg-red-100 transition">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    // إضافة منتج
    document.getElementById('productForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('prod-title').value;
      const price = document.getElementById('prod-price').value;
      const phone = document.getElementById('prod-phone').value;
      const image = document.getElementById('prod-image').value;
      const desc = document.getElementById('prod-desc').value;

      products.push({ title, price, phone, image, desc });
      localStorage.setItem('enstp_marketplace', JSON.stringify(products));
      
      document.getElementById('productForm').reset();
      renderProducts();
      alert("✅ تم نشر منتجك بنجاح!");
    });

    // حذف منتج
    function deleteProduct(index) {
      if (!confirm("هل تريد حذف هذا المنتج؟")) return;
      products.splice(index, 1);
      localStorage.setItem('enstp_marketplace', JSON.stringify(products));
      renderProducts();
    }

    // البحث
    document.getElementById('search-products').addEventListener('input', (e) => {
      renderProducts(e.target.value);
    });

    // التهيئة
    document.addEventListener('DOMContentLoaded', () => {
      renderProducts();
    });
  </script>
</body>
</html>
