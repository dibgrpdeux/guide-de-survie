<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سوق الطالب - ENSTP</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- الهيدر -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b px-4 py-3 mb-8 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-orange-500 flex items-center justify-center text-white font-black text-lg shadow-md"><i class="fa-solid fa-store"></i></div>
        <div>
          <h1 class="font-bold text-gray-900 text-base leading-tight">سوق الطالب</h1>
          <p class="text-[11px] text-gray-500">بيع وشراء بين طلبة ENSTP</p>
        </div>
      </div>
      <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs font-bold transition">الرئيسية</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-12 space-y-8">

    <!-- إضافة منتج -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
      <h2 class="text-xl font-black text-gray-900 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-orange-500"></i> أضف منتجك للبيع
      </h2>
      <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="prod-title" required placeholder="اسم المنتج (مثال: آلة حاسبة Casio)" class="p-3 rounded-xl border w-full outline-none focus:ring-2 focus:ring-orange-500">
        <input type="number" id="prod-price" required placeholder="السعر (دج)" class="p-3 rounded-xl border w-full outline-none focus:ring-2 focus:ring-orange-500">
        <input type="tel" id="prod-phone" required placeholder="رقم الهاتف (واتساب)" dir="ltr" class="p-3 rounded-xl border w-full outline-none focus:ring-2 focus:ring-orange-500">
        <input type="url" id="prod-image" placeholder="رابط الصورة (اختياري)" dir="ltr" class="p-3 rounded-xl border w-full outline-none focus:ring-2 focus:ring-orange-500">
        <textarea id="prod-desc" required placeholder="الوصف / الحالة..." rows="2" class="p-3 rounded-xl border w-full md:col-span-2 outline-none focus:ring-2 focus:ring-orange-500"></textarea>
        <button type="submit" id="submitBtn" class="md:col-span-2 bg-orange-500 text-white font-black text-lg py-3 rounded-xl shadow-lg hover:bg-orange-600 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-upload"></i> نشر المنتج
        </button>
      </form>
    </div>

    <!-- شبكة المنتجات -->
    <div>
      <h2 class="text-2xl font-black text-gray-900 mb-4 flex items-center gap-2"><i class="fa-solid fa-box-open text-orange-500"></i> المنتجات المعروضة</h2>
      <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- سيتم إدراج المنتجات هنا -->
      </div>
      <div id="loading" class="text-center py-10 hidden">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-orange-500"></i>
        <p class="text-gray-500 mt-2">جاري تحميل المنتجات...</p>
      </div>
    </div>

  </main>

  <!-- استدعاء Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // نفس إعدادات Firebase الخاصة بالمنتدى
    const firebaseConfig = {
      apiKey: "AIzaSyCvRORhsSl05y-8pu4fERx3gpSYT_XIwrk",
      authDomain: "enstp-forum-c5a28.firebaseapp.com",
      projectId: "enstp-forum-c5a28",
      storageBucket: "enstp-forum-c5a28.firebasestorage.app",
      messagingSenderId: "129732313908",
      appId: "1:129732313908:web:c06215b2fde653b76c9b61"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('productForm');
    const grid = document.getElementById('productsGrid');
    const loading = document.getElementById('loading');
    const submitBtn = document.getElementById('submitBtn');

    // إضافة منتج إلى Firestore
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري النشر...';

      try {
        await addDoc(collection(db, "marketplace"), {
          title: document.getElementById('prod-title').value,
          price: document.getElementById('prod-price').value,
          phone: document.getElementById('prod-phone').value,
          image: document.getElementById('prod-image').value,
          desc: document.getElementById('prod-desc').value,
          createdAt: serverTimestamp()
        });
        form.reset();
      } catch (err) {
        alert("حدث خطأ أثناء النشر: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-upload"></i> نشر المنتج';
      }
    });

    // عرض المنتجات في الوقت الفعلي (لكل الزوار)
    loading.classList.remove('hidden');
    const q = query(collection(db, "marketplace"), orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      loading.classList.add('hidden');
      grid.innerHTML = '';
      
      if (snapshot.empty) {
        grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500 bg-white rounded-2xl border">لا توجد منتجات معروضة حالياً.</div>';
        return;
      }

      snapshot.forEach((doc) => {
        const p = doc.data();
        const waPhone = p.phone.replace(/^0/, '213');
        let imgHtml = p.image 
          ? `<img src="${p.image}" class="w-full h-48 object-cover" onerror="this.src='https://via.placeholder.com/400x300/f1f5f9/94a3b8?text=No+Image'">` 
          : `<div class="w-full h-48 bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-image text-4xl text-gray-300"></i></div>`;

        grid.innerHTML += `
          <div class="bg-white rounded-2xl border overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
            ${imgHtml}
            <div class="p-4 flex-grow flex flex-col">
              <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-lg text-gray-900">${p.title}</h3>
                <span class="bg-orange-100 text-orange-700 font-black text-sm px-2 py-1 rounded-lg whitespace-nowrap">${p.price} دج</span>
              </div>
              <p class="text-sm text-gray-600 mb-4 flex-grow">${p.desc}</p>
              <div class="flex gap-2 mt-auto">
                <a href="https://wa.me/${waPhone}?text=مرحباً، أنا مهتم بمنتجك: ${p.title}" target="_blank" class="flex-1 bg-green-500 text-white font-bold py-2 rounded-xl text-sm hover:bg-green-600 flex items-center justify-center gap-1">
                  <i class="fa-brands fa-whatsapp"></i> تواصل
                </a>
                <button onclick="deleteProduct('${doc.id}')" class="bg-red-50 text-red-500 px-3 py-2 rounded-xl hover:bg-red-100">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>`;
      });
    });

    // حذف منتج
    window.deleteProduct = async (id) => {
      if (!confirm("هل أنت متأكد من حذف هذا المنتج؟")) return;
      try {
        await deleteDoc(doc(db, "marketplace", id));
      } catch (e) { alert("خطأ في الحذف: " + e.message); }
    };
  </script>
</body>
</html>
