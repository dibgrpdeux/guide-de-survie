<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page_title">سوق الطالب - ENSTP</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' }

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; transition: background-color 0.4s, color 0.4s; }
    html.dark body { background: #0f172a; color: #f8fafc; }
    
    .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: all 0.3s ease; }
    html.dark .glass-card { background: #1e293b; border-color: #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    
    .glass-nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; transition: all 0.3s ease; }
    html.dark .glass-nav { background: #0f172a; border-bottom-color: #334155; }

    .lang-btn { background: transparent; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: #64748b; transition: 0.2s; }
    .lang-btn:hover { background: #ffedd5; color: #9a3412; }
    .lang-btn.active { background: #f97316; color: white; }

    #chatWindow { position: fixed; bottom: 110px; right: 20px; z-index: 1001; width: 320px; max-height: 420px; background: white; border-radius: 1rem; box-shadow: 0 20px 50px rgba(0,0,0,0.25); border: 1px solid #fed7aa; display: none; flex-direction: column; }
    #chatWindow.open { display: flex; }
    html.dark #chatWindow { background: #1e293b; border-color: #334155; color: #f8fafc; }
    @media (max-width: 640px) { #chatWindow { width: calc(100vw - 2rem); right: 1rem; left: 1rem; } }

    @keyframes kangarooJump { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-20px) scale(1.1) rotate(-8deg); } 60% { transform: translateY(-10px) scale(1) rotate(5deg); } }

    button, a, .glass-card { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #f97316 !important; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15) !important; }
  </style>
</head>

    <div>

  <div id="chatWindow" class="hidden">
    <div style="background: linear-gradient(135deg, #f97316, #f59e0b); color: white; padding: 12px 16px; border-radius: 1rem 1rem 0 0; font-weight: 700; display: flex; justify-content: space-between; align-items: center;">

  <script>
    let currentLang = localStorage.getItem('enstp_lang') || 'ar';

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    function t(key) {
      const dict = window.MARKETPLACE_TRANSLATIONS[currentLang] || window.MARKETPLACE_TRANSLATIONS.ar;
      return dict[key] || key;
    }

    window.MARKETPLACE_TRANSLATIONS = {
      ar: {
        page_title: "سوق الطالب - ENSTP", nav_home: "الرئيسية",
        market_title: "سوق الطالب", market_subtitle: "بيع وشراء بين طلبة ENSTP",
        market_add_title: "أضف منتجك للبيع",
        market_prod_title: "اسم المنتج (مثال: آلة حاسبة Casio)",
        market_prod_price: "السعر (دج)",
        market_prod_phone: "رقم الهاتف (واتساب)",
        market_prod_image: "رابط الصورة (اختياري)",
        market_prod_desc: "الوصف / الحالة...",
        market_publish: "نشر المنتج",
        market_products: "المنتجات المعروضة", market_loading: "جاري تحميل المنتجات...",
        market_contact: "تواصل", market_empty: "لا توجد منتجات معروضة حالياً.",
        chat_title: "المساعد الافتراضي", chat_welcome: "مرحباً! 👋 كيف يمكنني مساعدتك؟",
        chat_placeholder: "اكتب سؤالك...", chat_default: "شكراً!",
        chat_hello: "أهلاً!", chat_thanks: "على الرحب والسعة!",
        chat_market: "تصفح المنتجات أو أضف منتجك في هذه الصفحة."
      },
      fr: {
        page_title: "Marché Étudiant - ENSTP", nav_home: "Accueil",
        market_title: "Marché Étudiant", market_subtitle: "Achat et vente entre étudiants ENSTP",
        market_add_title: "Ajouter votre produit",
        market_prod_title: "Nom du produit (ex : calculatrice Casio)",
        market_prod_price: "Prix (DA)",
        market_prod_phone: "Téléphone (WhatsApp)",
        market_prod_image: "Lien de l'image (optionnel)",
        market_prod_desc: "Description / État...",
        market_publish: "Publier le produit",
        market_products: "Produits en vente", market_loading: "Chargement...",
        market_contact: "Contacter", market_empty: "Aucun produit pour l'instant.",
        chat_title: "Assistant virtuel", chat_welcome: "Bonjour ! 👋 Comment puis-je vous aider ?",
        chat_placeholder: "Votre question...", chat_default: "Merci !",
        chat_hello: "Bienvenue !", chat_thanks: "Avec plaisir !",
        chat_market: "Parcourez les produits ou ajoutez le vôtre sur cette page."
      },
      en: {
        page_title: "Student Market - ENSTP", nav_home: "Home",
        market_title: "Student Market", market_subtitle: "Buy and sell between ENSTP students",
        market_add_title: "Add your product",
        market_prod_title: "Product name (e.g. Casio calculator)",
        market_prod_price: "Price (DA)",
        market_prod_phone: "Phone (WhatsApp)",
        market_prod_image: "Image URL (optional)",
        market_prod_desc: "Description / Condition...",
        market_publish: "Publish product",
        market_products: "Products for sale", market_loading: "Loading...",
        market_contact: "Contact", market_empty: "No products yet.",
        chat_title: "Virtual Assistant", chat_welcome: "Hello! 👋 How can I help you?",
        chat_placeholder: "Your question...", chat_default: "Thanks!",
        chat_hello: "Welcome!", chat_thanks: "You're welcome!",
        chat_market: "Browse products or add yours on this page."
      }
    };

    window.applyMarketplaceTranslation = function(lang) {
      const dict = window.MARKETPLACE_TRANSLATIONS[lang] || window.MARKETPLACE_TRANSLATIONS.ar;
      if (dict.page_title) document.title = dict.page_title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          const icon = el.querySelector('i');
          if (icon) { el.innerHTML = ''; el.appendChild(icon); el.appendChild(document.createTextNode(' ' + dict[key])); }
          else el.innerText = dict[key];
        }
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (dict[key]) el.placeholder = dict[key];
      });
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;
    };

    window.setLanguage = function(lang) {
      currentLang = lang;
      localStorage.setItem('enstp_lang', lang);
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + lang);
      if (activeBtn) activeBtn.classList.add('active');
      window.applyMarketplaceTranslation(lang);
    };

    function toggleChat() {
      const chat = document.getElementById('chatWindow');
      if (!chat) return;
      chat.classList.toggle('hidden');
      chat.classList.toggle('open');
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const body = document.getElementById('chatBody');
      if (!input || !body) return;
      const msg = input.value.trim();
      if (!msg) return;
      body.innerHTML += `<div style="display:flex;justify-content:flex-end;"><div style="background:#f97316;color:white;padding:8px 12px;border-radius:12px 12px 4px 12px;max-width:80%;font-size:13px;">${msg}</div></div>`;
      input.value = '';
      body.scrollTop = body.scrollHeight;
      setTimeout(() => {
        let reply = t('chat_default');
        const m = msg.toLowerCase();
        if (m.includes("سوق") || m.includes("منتج") || m.includes("market") || m.includes("produit")) reply = "🛒 " + t('chat_market');
        else if (m.includes("سلام") || m.includes("مرحبا") || m.includes("hello") || m.includes("bonjour")) reply = "👋 " + t('chat_hello');
        else if (m.includes("شكرا") || m.includes("merci") || m.includes("thanks")) reply = "💛 " + t('chat_thanks');
        body.innerHTML += `<div style="display:flex;justify-content:flex-start;"><div style="background:#ffedd5;color:#7c2d12;padding:8px 12px;border-radius:12px 12px 12px 4px;max-width:80%;font-size:13px;">${reply}</div></div>`;
        body.scrollTop = body.scrollHeight;
      }, 500);
    }

    const kangarooContainer = document.getElementById('kangarooContainer');
    const kangarooSvg = document.getElementById('kangarooSvg');
    if (kangarooContainer) {
      kangarooContainer.addEventListener('click', () => {
        if (kangarooSvg) {
          kangarooSvg.style.animation = 'none';
          kangarooSvg.offsetHeight;
          kangarooSvg.style.animation = 'kangarooJump 0.6s ease';
          setTimeout(() => { kangarooSvg.style.animation = ''; }, 700);
        }
        toggleChat();
      });
      kangarooContainer.addEventListener('mouseenter', () => { if (kangarooSvg) kangarooSvg.style.transform = 'scale(1.1)'; });
      kangarooContainer.addEventListener('mouseleave', () => { if (kangarooSvg) kangarooSvg.style.transform = ''; });
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      const savedLang = localStorage.getItem('enstp_lang') || 'ar';
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + savedLang);
      if (activeBtn) activeBtn.classList.add('active');
      currentLang = savedLang;
      window.applyMarketplaceTranslation(savedLang);
      const chatInput = document.getElementById('chatInput');
      if (chatInput) {
        chatInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });
      }
    });
  </script>

  <!-- Firebase Marketplace -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvRORhsSl05y-8pu4fERx3gpSYT_XIwrk",
      authDomain: "enstp-forum-c5a28.firebaseapp.com",
      projectId: "enstp-forum-c5a28",
      storageBucket: "enstp-forum-c5a28.firebasestorage.app",
      messagingSenderId: "129732313908",
      appId: "1:129732313908:web:c06215b2fde653b76c9b61"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('productForm');
    const grid = document.getElementById('productsGrid');
    const loading = document.getElementById('loading');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      const originalHTML = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ...';

      try {
        await addDoc(collection(db, "marketplace"), {
          title: document.getElementById('prod-title').value,
          price: document.getElementById('prod-price').value,
          phone: document.getElementById('prod-phone').value,
          image: document.getElementById('prod-image').value,
          desc: document.getElementById('prod-desc').value,
          createdAt: serverTimestamp()
        });
        form.reset();
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-upload"></i> <span>${window.t('market_publish')}</span>`;
      }
    });

    loading.classList.remove('hidden');
    const q = query(collection(db, "marketplace"), orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      loading.classList.add('hidden');
      grid.innerHTML = '';
      
      if (snapshot.empty) {
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500 bg-white dark:bg-slate-800 rounded-2xl border dark:border-slate-700">${window.t('market_empty')}</div>`;
        return;
      }

      snapshot.forEach((docSnap) => {
        const p = docSnap.data();
        const waPhone = p.phone.replace(/^0/, '213');
        let imgHtml = p.image 
          ? `<img src="${p.image}" class="w-full h-48 object-cover" onerror="this.src='https://via.placeholder.com/400x300/f1f5f9/94a3b8?text=No+Image'">` 
          : `<div class="w-full h-48 bg-gray-100 dark:bg-slate-700 flex items-center justify-center"><i class="fa-solid fa-image text-4xl text-gray-300"></i></div>`;

        grid.innerHTML += `
          <div class="bg-white dark:bg-slate-800 rounded-2xl border border-gray-200 dark:border-slate-700 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
            ${imgHtml}
            <div class="p-4 flex-grow flex flex-col">
              <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-lg text-gray-900 dark:text-white">${p.title}</h3>
                <span class="bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400 font-black text-sm px-2 py-1 rounded-lg whitespace-nowrap">${p.price} DA</span>
              </div>
              <p class="text-sm text-gray-600 dark:text-gray-400 mb-4 flex-grow">${p.desc}</p>
              <div class="flex gap-2 mt-auto">
                <a href="https://wa.me/${waPhone}?text=Bonjour" target="_blank" class="flex-1 bg-green-500 text-white font-bold py-2 rounded-xl text-sm hover:bg-green-600 flex items-center justify-center gap-1">
                  <i class="fa-brands fa-whatsapp"></i> <span>${window.t('market_contact')}</span>
                </a>
                <button onclick="deleteProduct('${docSnap.id}')" class="bg-red-50 dark:bg-red-900/30 text-red-500 px-3 py-2 rounded-xl hover:bg-red-100">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>`;
      });
    });

    window.deleteProduct = async (id) => {
      if (!confirm("Confirmer la suppression ?")) return;
      try { await deleteDoc(doc(db, "marketplace", id)); }
      catch (e) { alert("Error: " + e.message); }
    };
  </script>
</body>
</html>
