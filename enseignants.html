<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="warm">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هيئة التدريس - ENSTP</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root { 
      --primary: #d97706;       /* برتقالي ذهبي */
      --primary-dark: #b45309;  /* برتقالي غامق */
      --primary-light: #fef3c7; /* كريمي */
      --navy: #0f172a;          /* أزرق داكن جداً */
      --blue-header: #1e3a8a;   /* أزرق الهيدر */
    }
    
    body { font-family: 'Cairo', sans-serif; background: #fffbeb; color: #1e293b; }
    
    /* خلفية متدرجة */
    .ambient-bg { 
      position: fixed; inset: 0; z-index: -1; 
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #e0f2fe 100%); 
    }

    .glass-card { 
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(16px); 
      border: 1px solid rgba(255, 255, 255, 0.9); 
      box-shadow: 0 10px 30px -10px rgba(146, 64, 14, 0.1); 
    }

    /* أزرار اختيار السنة */
    .btn-year { background: white; border: 2px solid #e2e8f0; color: #475569; }
    .btn-year.active { 
      background: linear-gradient(135deg, #d97706, #f59e0b); 
      color: white; 
      border-color: transparent;
      box-shadow: 0 10px 20px -5px rgba(217, 119, 6, 0.4); 
    }

    /* أزرار المواد */
    .badge-subject { transition: all 0.3s ease; }
    .badge-subject.active { 
      background-color: var(--primary); 
      color: white; 
      border-color: var(--primary); 
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25); 
    }
    
    /* أزرار اللغة */
    .lang-btn { background: transparent; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.2s; color: #64748b; }
    .lang-btn:hover { background: #fef3c7; color: #92400e; }
    .lang-btn.active { background: #d97706; color: white; }

    /* تصميم بطاقة الأستاذ (مطابق للصورة) */
    .teacher-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    
    .teacher-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px -15px rgba(217, 119, 6, 0.2);
    }

    /* الجزء العلوي الأزرق */
    .card-header-bg {
      height: 100px;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      position: relative;
    }

    /* زر صح في الزاوية */
    .check-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(5px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.4);
    }

    /* شارة القسم (يمين) */
    .dept-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #78350f;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4);
    }

    /* صورة الأستاذ الدائرية */
    .teacher-photo-wrap {
      position: absolute;
      bottom: -45px;
      right: 24px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid white;
      background: #f1f5f9;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    
    .teacher-photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .teacher-photo-initials {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.8rem;
    }

    /* محتوى البطاقة */
    .card-content {
      padding: 55px 24px 24px 24px;
      text-align: right;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .teacher-name {
      font-size: 1.25rem;
      font-weight: 900;
      color: #1e293b;
      margin-bottom: 4px;
    }

    .teacher-title {
      font-size: 0.85rem;
      color: #b45309;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .teacher-desc {
      font-size: 0.85rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    /* الأزرار السفلية */
    .btn-card-primary {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #451a03;
      font-weight: 800;
      padding: 12px;
      border-radius: 14px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      cursor: pointer;
      border: none;
      width: 100%;
    }
    
    .btn-card-primary:hover { 
      background: linear-gradient(135deg, #f59e0b, #d97706); 
      transform: translateY(-2px);
    }

    .btn-card-secondary {
      background: #f8fafc;
      color: #475569;
      font-weight: 700;
      padding: 12px;
      border-radius: 14px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    
    .btn-card-secondary:hover { background: #f1f5f9; }
  </style>
</head>

    let selectedYear = '1cp';
    let selectedSubject = 'all';

    function selectYear(year) {
      selectedYear = year;
      document.getElementById('btn-1cp').className = `btn-year px-6 py-3 rounded-2xl font-bold text-sm border border-gray-200 transition ${year === '1cp' ? 'active' : 'bg-white text-gray-700'}`;
      document.getElementById('btn-2cp').className = `btn-year px-6 py-3 rounded-2xl font-bold text-sm border border-gray-200 transition ${year === '2cp' ? 'active' : 'bg-white text-gray-700'}`;
      
      selectedSubject = 'all';
      renderSubjects();
      renderTeachers();
    }

    function renderSubjects() {
      const subjectsBox = document.getElementById('subjects-container');
      const list = teachersData[selectedYear];
      const uniqueSubjects = [...new Set(list.map(t => t.subject))];

      subjectsBox.innerHTML = '';
      
      const allBtn = document.createElement('button');
      allBtn.className = `badge-subject px-4 py-2 rounded-xl border text-xs font-bold ${selectedSubject === 'all' ? 'active' : 'bg-white text-gray-600 border-gray-200 hover:bg-amber-50'}`;
      allBtn.innerText = translations[currentLang].ens_all;
      allBtn.onclick = () => { selectedSubject = 'all'; renderSubjects(); renderTeachers(); };
      subjectsBox.appendChild(allBtn);

      uniqueSubjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = `badge-subject px-4 py-2 rounded-xl border text-xs font-bold ${sub === selectedSubject ? 'active' : 'bg-white text-gray-600 border-gray-200 hover:bg-amber-50'}`;
        btn.innerText = subjectTranslations[sub] ? subjectTranslations[sub][currentLang] : sub;
        btn.onclick = () => {
          selectedSubject = sub;
          renderSubjects();
          renderTeachers();
        };
        subjectsBox.appendChild(btn);
      });
    }

    function renderTeachers() {
      const grid = document.getElementById('teachers-grid');
      grid.innerHTML = '';

      let list = teachersData[selectedYear];
      if (selectedSubject !== 'all') {
        list = list.filter(t => t.subject === selectedSubject);
      }

      list.forEach(t => {
        const card = document.createElement('div');
        card.className = "teacher-card";
        
        const subjectName = subjectTranslations[t.subject] ? subjectTranslations[t.subject][currentLang] : t.subject;
        const deptName = t.dept || subjectName;

        // الصورة أو الحروف الأولى
        let imgHtml = '';
        if (t.photo) {
          imgHtml = `
            <img src="${t.photo}" alt="${t.name}" 
                 onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'teacher-photo-initials\\'>${t.name.split(' ').map(n=>n[0]).join('').substring(0,2)}</div>';">
          `;
        } else {
          imgHtml = `<div class="teacher-photo-initials">${t.name.split(' ').map(n=>n[0]).join('').substring(0,2)}</div>`;
        }

        // العنوان (أستاذ دائم/مؤقت)
        const gradeText = t.grade === 'prof' ? translations[currentLang].ens_grade_prof : translations[currentLang].ens_grade_temp;

        // وصف قصير (نصيحة أو بحث)
        let descText = t.advice || t.research || subjectName;
        if (descText.length > 100) descText = descText.substring(0, 100) + '...';

        card.innerHTML = `
          <div class="card-header-bg">
            <div class="check-badge"><i class="fa-solid fa-check"></i></div>
            <div class="dept-badge">${deptName}</div>
            <div class="teacher-photo-wrap">
              ${imgHtml}
            </div>
          </div>
          
          <div class="card-content">
            <h3 class="teacher-name" dir="ltr">${t.name}</h3>
            <p class="teacher-title">${gradeText}</p>
            <p class="teacher-desc">${descText}</p>
            
            <button class="btn-card-primary" onclick="openModal('${t.id}')">
              <span>${translations[currentLang].ens_show_card}</span>
              <i class="fa-solid fa-arrow-left"></i>
            </button>
            
            <a href="mailto:${t.email}" class="btn-card-secondary" onclick="event.stopPropagation()">
              <i class="fa-solid fa-envelope"></i>
              <span>${translations[currentLang].ens_contact}</span>
            </a>
          </div>
        `;
        
        grid.appendChild(card);
      });
    }

    function openModal(teacherId) {
      // البحث عن الأستاذ في كلتا السنتين
      let t = teachersData['1cp'].find(x => x.id === teacherId);
      if (!t) t = teachersData['2cp'].find(x => x.id === teacherId);
      if (!t) return;

      document.getElementById('modal-name').innerText = t.name;
      
      let gradeText = '';
      if (t.grade === 'prof') gradeText = translations[currentLang].ens_grade_prof;
      else if (t.grade === 'temp') gradeText = translations[currentLang].ens_grade_temp;
      else gradeText = t.grade || 'Enseignant';
      
      document.getElementById('modal-grade').innerText = gradeText;
      document.getElementById('modal-email').querySelector('span').innerText = t.email;
      
      let modulesText = t.modules || (subjectTranslations[t.subject] ? subjectTranslations[t.subject][currentLang] : t.subject);
      document.getElementById('modal-modules').innerText = modulesText;

      const advBox = document.getElementById('modal-advice-box');
      if (t.advice) {
        advBox.classList.remove('hidden');
        document.getElementById('modal-advice').innerText = t.advice;
      } else {
        advBox.classList.add('hidden');
      }

      const resBox = document.getElementById('modal-research-box');
      if (t.research) {
        resBox.classList.remove('hidden');
        document.getElementById('modal-research').innerText = t.research;
      } else {
        resBox.classList.add('hidden');
      }

      const linksBox = document.getElementById('modal-links-box');
      const linksContainer = document.getElementById('modal-links');
      if (t.links && t.links.length > 0) {
        linksBox.classList.remove('hidden');
        linksContainer.innerHTML = '';
        t.links.forEach(l => {
          linksContainer.innerHTML += `<a href="${l.url}" target="_blank" class="px-3 py-1 rounded-lg bg-blue-50 text-blue-700 border border-blue-200 text-xs font-bold hover:bg-blue-100 transition">${l.label} <i class="fa-solid fa-arrow-up-right-from-square text-[10px] ml-1"></i></a>`;
        });
      } else {
        linksBox.classList.add('hidden');
      }

      const imgBox = document.getElementById('modal-img-box');
      if (t.photo) {
        imgBox.innerHTML = `<img src="${t.photo}" alt="${t.name}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='${t.name.split(' ').map(n=>n[0]).join('').substring(0,2)}';">`;
      } else {
        const initials = t.name.split(' ').map(n => n[0]).join('').substring(0, 2);
        imgBox.innerHTML = initials;
      }

      document.getElementById('teacher-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('teacher-modal').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      selectYear('1cp');
      setTimeout(() => setLanguage(currentLang), 100);
    });
  </script>
