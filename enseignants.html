<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="indigo">
<head>
  <script src="translate.js"></script>
  <style>body{top:0!important}.skiptranslate iframe{display:none!important}.lang-btn{background:transparent;border:none;padding:4px 8px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:12px;transition:.2s;color:#64748b}.lang-btn.active{background:#4f46e5;color:#fff}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هيئة التدريس - ENSTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:'Cairo',sans-serif;background:#f8fafc}.glass-card{background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 20px 30px -10px rgba(0,0,0,.05)}.btn-year.active{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff}.badge-subject.active{background-color:#4f46e5;color:#fff}</style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 lg:p-8">
  <div class="max-w-6xl mx-auto w-full space-y-8">
    <div class="text-center space-y-2">
      <div class="flex justify-center mb-2">
        <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-gray-200 shadow-sm">
          <button onclick="setLanguage('ar')" id="btn-ar" class="lang-btn active">🇩🇿 عربي</button>
          <button onclick="setLanguage('fr')" id="btn-fr" class="lang-btn">🇫🇷 FR</button>
          <button onclick="setLanguage('en')" id="btn-en" class="lang-btn">🇬🇧 EN</button>
        </div>
      </div>
      <span class="px-4 py-1.5 rounded-full bg-indigo-50 text-indigo-600 font-bold text-xs uppercase">ENSTP Kouba</span>
      <h1 class="text-3xl font-black text-gray-900" data-i18n="ens_title">هيئة التدريس (الأساتذة)</h1>
      <p class="text-xs text-gray-500" data-i18n="ens_subtitle">اختر السنة الدراسية...</p>
    </div>

    <div class="flex flex-wrap items-center justify-center gap-4">
      <button onclick="selectYear('1cp')" id="btn-1cp" class="btn-year active px-6 py-3 rounded-2xl font-bold text-sm bg-white border border-gray-200 transition"><span data-i18n="ens_year1">السنة الأولى تحضيري (1CP)</span></button>
      <button onclick="selectYear('2cp')" id="btn-2cp" class="btn-year px-6 py-3 rounded-2xl font-bold text-sm bg-white text-gray-700 border border-gray-200 transition"><span data-i18n="ens_year2">السنة الثانية تحضيري (2CP)</span></button>
    </div>

    <div class="glass-card p-5 rounded-3xl border border-white space-y-3">
      <span class="text-xs font-bold text-gray-400 block uppercase" data-i18n="ens_select_subject">اختر المادة:</span>
      <div id="subjects-container" class="flex flex-wrap gap-2"></div>
    </div>

    <div id="teachers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <div id="teacher-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass-card bg-white rounded-3xl max-w-2xl w-full p-6 space-y-6 relative max-h-[90vh] overflow-y-auto">
      <button onclick="document.getElementById('teacher-modal').classList.add('hidden')" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      <div class="flex flex-col sm:flex-row items-center gap-5 border-b pb-6">
        <div id="modal-img-box" class="w-24 h-24 rounded-2xl bg-indigo-500 text-white flex items-center justify-center text-3xl font-black overflow-hidden"></div>
        <div class="space-y-1 text-center sm:text-left">
          <h2 id="modal-name" class="text-2xl font-black text-gray-900"></h2>
          <p id="modal-grade" class="text-xs font-bold text-indigo-600"></p>
          <p id="modal-email" class="text-xs text-gray-500 flex items-center gap-1.5 pt-1" dir="ltr"><i class="fa-solid fa-envelope text-indigo-500"></i><span></span></p>
        </div>
      </div>
      <div class="space-y-4 text-xs text-gray-600">
        <div><h4 class="font-bold text-gray-900 text-sm mb-1" data-i18n="ens_module">المواد المدرّسة:</h4><p id="modal-modules" class="bg-indigo-50 p-3 rounded-xl text-indigo-900 font-bold"></p></div>
        <div id="modal-advice-box"><h4 class="font-bold text-gray-900 text-sm mb-1" data-i18n="ens_advice">نصيحة للطلبة:</h4><p id="modal-advice" class="bg-amber-50 p-3 rounded-xl italic text-amber-900"></p></div>
        <div id="modal-research-box"><h4 class="font-bold text-gray-900 text-sm mb-1" data-i18n="ens_research">البحث العلمي:</h4><p id="modal-research" class="bg-emerald-50 p-3 rounded-xl text-emerald-900"></p></div>
        <div id="modal-links-box"><h4 class="font-bold text-gray-900 text-sm mb-1" data-i18n="ens_links">روابط مفيدة:</h4><div id="modal-links" class="flex flex-wrap gap-2"></div></div>
      </div>
    </div>
  </div>

  <script>
    const teachersData = {
      '1cp': [
        { id: 'haddouche', name: 'HADDOUCHE Abdeslam', grade: 'prof', email: 'a.haddouche@enstp.edu.dz', subject: 'Physique 1', advice: 'Time management + self confidence.', research: 'Quantum Supersymmetry.', links: [{ label: 'LinkedIn', url: '#' }], photo: 'haddouche.png' },
        { id: 'yala', name: 'YALA Ahmed', grade: 'prof', email: 'a.yala@enstp.edu.dz', subject: 'Anglais 1', advice: 'Do not study only to pass exams.', research: 'Mobile Assisted Language Learning.', links: [{ label: 'Scholar', url: '#' }], photo: 'yalla.png' }
      ],
      '2cp': [
        { id: 'berroudji', name: 'BERROUDJI Sid-Ahmed', grade: 'prof', email: 's.berroudji@enstp.edu.dz', subject: 'Physique 3 / MDF', advice: 'Travaillez régulièrement.', links: [{ label: 'LinkedIn', url: '#' }], photo: 'berroudji.png' },
        { id: 'rahoui', name: 'RAHOUI Adel', grade: 'prof', email: 'a.rahoui@enstp.edu.dz', subject: 'Electricité Gle', research: 'Electronics and power converters.', links: [{ label: 'LinkedIn', url: '#' }], photo: 'rahoui.png' }
      ]
    };

    let selectedYear = '1cp';
    let selectedSubject = 'all';
    let currentLang = localStorage.getItem('enstp_lang') || 'ar';

    window.setLanguage = function(lang) {
      currentLang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (window.translations && window.translations[lang] && window.translations[lang][key]) {
          el.innerText = window.translations[lang][key];
        }
      });
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + lang).classList.add('active');
      renderSubjects();
      renderTeachers();
    };

    function selectYear(year) {
      selectedYear = year;
      document.getElementById('btn-1cp').className = `btn-year px-6 py-3 rounded-2xl font-bold text-sm border border-gray-200 transition ${year === '1cp' ? 'active' : 'bg-white text-gray-700'}`;
      document.getElementById('btn-2cp').className = `btn-year px-6 py-3 rounded-2xl font-bold text-sm border border-gray-200 transition ${year === '2cp' ? 'active' : 'bg-white text-gray-700'}`;
      selectedSubject = 'all';
      renderSubjects();
      renderTeachers();
    }

    function renderSubjects() {
      const box = document.getElementById('subjects-container');
      box.innerHTML = '';
      const list = teachersData[selectedYear];
      const unique = [...new Set(list.map(t => t.subject))];
      
      const allBtn = document.createElement('button');
      allBtn.className = `badge-subject px-4 py-2 rounded-xl border text-xs font-bold ${selectedSubject === 'all' ? 'active' : 'bg-white text-gray-600'}`;
      allBtn.innerText = window.translations[currentLang].ens_all || 'الكل';
      allBtn.onclick = () => { selectedSubject = 'all'; renderSubjects(); renderTeachers(); };
      box.appendChild(allBtn);

      unique.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = `badge-subject px-4 py-2 rounded-xl border text-xs font-bold ${sub === selectedSubject ? 'active' : 'bg-white text-gray-600'}`;
        btn.innerText = sub;
        btn.onclick = () => { selectedSubject = sub; renderSubjects(); renderTeachers(); };
        box.appendChild(btn);
      });
    }

    function renderTeachers() {
      const grid = document.getElementById('teachers-grid');
      grid.innerHTML = '';
      let list = teachersData[selectedYear];
      if (selectedSubject !== 'all') list = list.filter(t => t.subject === selectedSubject);

      list.forEach(t => {
        const card = document.createElement('div');
        card.className = "glass-card p-5 rounded-3xl border border-white space-y-3 hover:shadow-xl transition cursor-pointer";
        card.onclick = () => openModal(t);
        card.innerHTML = `
          <div class="space-y-2">
            <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">${t.subject}</span>
            <h3 class="font-bold text-base text-gray-900" dir="ltr">${t.name}</h3>
            <p class="text-xs text-gray-500 truncate" dir="ltr">${t.email}</p>
          </div>
          <div class="pt-2 border-t flex justify-between text-xs font-bold text-indigo-600">
            <span>${window.translations[currentLang].ens_show_card || 'عرض البطاقة'}</span>
            <i class="fa-solid fa-arrow-left"></i>
          </div>`;
        grid.appendChild(card);
      });
    }

    function openModal(t) {
      document.getElementById('teacher-modal').classList.remove('hidden');
      document.getElementById('modal-name').innerText = t.name;
      document.getElementById('modal-grade').innerText = t.grade === 'prof' ? window.translations[currentLang].ens_grade_prof : window.translations[currentLang].ens_grade_temp;
      document.getElementById('modal-email').querySelector('span').innerText = t.email;
      document.getElementById('modal-modules').innerText = t.subject;

      const advBox = document.getElementById('modal-advice-box');
      if (t.advice) { advBox.classList.remove('hidden'); document.getElementById('modal-advice').innerText = t.advice; } else advBox.classList.add('hidden');
      
      const resBox = document.getElementById('modal-research-box');
      if (t.research) { resBox.classList.remove('hidden'); document.getElementById('modal-research').innerText = t.research; } else resBox.classList.add('hidden');
      
      const linksBox = document.getElementById('modal-links-box');
      if (t.links && t.links.length > 0) {
        linksBox.classList.remove('hidden');
        document.getElementById('modal-links').innerHTML = t.links.map(l => `<a href="${l.url}" target="_blank" class="px-3 py-1 rounded-lg bg-cyan-50 text-cyan-700 text-xs font-bold">${l.label}</a>`).join('');
      } else linksBox.classList.add('hidden');

      const imgBox = document.getElementById('modal-img-box');
      if (t.photo) {
        imgBox.innerHTML = `<img src="${t.photo}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='${t.name.split(' ').map(n=>n[0]).join('').substring(0,2)}';">`;
      } else {
        imgBox.innerHTML = t.name.split(' ').map(n => n[0]).join('').substring(0, 2);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      selectYear('1cp');
      setLanguage(currentLang);
    });
  </script>
</body>
</html>
