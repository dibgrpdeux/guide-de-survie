<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="indigo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guide ENSTP - Corps Enseignant & Matières</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root { --primary: #4f46e5; --primary-hover: #4338ca; --primary-light: #eef2ff; }
    body { font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif; background: #f8fafc; color: #0f172a; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 20px 30px -10px rgba(0,0,0,0.05); }
    .btn-year.active { background: linear-gradient(135deg, #4f46e5, #6366f1); color: white; box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4); }
    .badge-subject { transition: all 0.3s ease; }
    .badge-subject.active { background-color: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 lg:p-8">

  <div class="max-w-6xl mx-auto w-full space-y-8">
    
    <!-- Header -->
    <div class="text-center space-y-2">
      <span class="px-4 py-1.5 rounded-full bg-indigo-50 text-indigo-600 font-bold text-xs uppercase tracking-wider border border-indigo-100">
        <i class="fa-solid fa-graduation-cap mr-1"></i> ENSTP Kouba — Mon École
      </span>
      <h1 class="text-3xl lg:text-4xl font-black text-gray-900">Corps Enseignant</h1>
      <p class="text-xs lg:text-sm text-gray-500 font-cairo">اختر السنة الدراسية، ثم المادة، وانقر على الأستاذ لعرض بطاقته الكاملة.</p>
    </div>

    <!-- 1. اختيار السنة -->
    <div class="flex flex-wrap items-center justify-center gap-4">
      <button onclick="selectYear('1cp')" id="btn-1cp" class="btn-year active px-6 py-3 rounded-2xl font-bold text-sm bg-white text-gray-700 border border-gray-200 shadow-sm transition-all flex items-center gap-2">
        <i class="fa-solid fa-1"></i><span>1ère Année Préparatoire (1CP)</span>
      </button>
      <button onclick="selectYear('2cp')" id="btn-2cp" class="btn-year px-6 py-3 rounded-2xl font-bold text-sm bg-white text-gray-700 border border-gray-200 shadow-sm transition-all flex items-center gap-2">
        <i class="fa-solid fa-2"></i><span>2ème Année Préparatoire (2CP)</span>
      </button>
    </div>

    <!-- 2. اختيار المادة -->
    <div class="glass-card p-5 rounded-3xl border border-white space-y-3">
      <span class="text-xs font-bold text-gray-400 block uppercase tracking-wider">Sélectionner une Matière / اختر المادة:</span>
      <div id="subjects-container" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- 3. شبكة الأساتذة -->
    <div id="teachers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  </div>

  <!-- Modal: بطاقة الأستاذ -->
  <div id="teacher-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass-card bg-white rounded-3xl max-w-2xl w-full p-6 lg:p-8 space-y-6 border border-white shadow-2xl relative max-h-[90vh] overflow-y-auto">
      
      <button onclick="closeModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center transition z-10">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- رأس البطاقة -->
      <div class="flex flex-col sm:flex-row items-center gap-5 border-b pb-6">
        <div id="modal-img-box" class="w-24 h-24 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 text-white flex items-center justify-center text-3xl font-black shadow-lg overflow-hidden flex-shrink-0">
          <!-- الصورة ستوضع هنا -->
        </div>
        <div class="space-y-1 text-center sm:text-left">
          <h2 id="modal-name" class="text-2xl font-black text-gray-900"></h2>
          <p id="modal-grade" class="text-xs font-bold text-indigo-600 uppercase tracking-wide"></p>
          <p id="modal-email" class="text-xs font-semibold text-gray-500 flex items-center justify-center sm:justify-start gap-1.5 pt-1">
            <i class="fa-solid fa-envelope text-indigo-500"></i>
            <span></span>
          </p>
        </div>
      </div>

      <!-- تفاصيل البطاقة -->
      <div class="space-y-4 text-xs text-gray-600 leading-relaxed font-cairo">
        <div>
          <h4 class="font-bold text-gray-900 text-sm mb-1"><i class="fa-solid fa-book-bookmark text-indigo-500 mr-1.5"></i> Matière / Module:</h4>
          <p id="modal-modules" class="bg-indigo-50/60 p-3 rounded-xl border border-indigo-100 font-semibold text-indigo-900"></p>
        </div>

        <div id="modal-advice-box">
          <h4 class="font-bold text-gray-900 text-sm mb-1"><i class="fa-solid fa-comment-dots text-amber-500 mr-1.5"></i> Conseil aux étudiants:</h4>
          <p id="modal-advice" class="bg-amber-50/60 p-3 rounded-xl border border-amber-100 italic text-amber-900"></p>
        </div>

        <div id="modal-research-box">
          <h4 class="font-bold text-gray-900 text-sm mb-1"><i class="fa-solid fa-microscope text-emerald-500 mr-1.5"></i> Recherche:</h4>
          <p id="modal-research" class="bg-emerald-50/60 p-3 rounded-xl border border-emerald-100 text-emerald-900"></p>
        </div>

        <div id="modal-links-box">
          <h4 class="font-bold text-gray-900 text-sm mb-1"><i class="fa-solid fa-link text-cyan-500 mr-1.5"></i> Liens utiles:</h4>
          <div id="modal-links" class="flex flex-wrap gap-2 pt-1"></div>
        </div>
      </div>

    </div>
  </div>

    let selectedYear = '1cp';

    function selectYear(year) {
      selectedYear = year;
      document.getElementById('btn-1cp').className = `btn-year px-6 py-3 rounded-2xl font-bold text-sm border border-gray-200 transition ${year === '1cp' ? 'active' : 'bg-white text-gray-700'}`;
      document.getElementById('btn-2cp').className = `btn-year px-6 py-3 rounded-2xl font-bold text-sm border border-gray-200 transition ${year === '2cp' ? 'active' : 'bg-white text-gray-700'}`;
      
      selectedSubject = 'Toutes';
      renderSubjects();
      renderTeachers();
    }

    function renderSubjects() {
      const subjectsBox = document.getElementById('subjects-container');
      const list = teachersData[selectedYear];
      const uniqueSubjects = ['Toutes', ...new Set(list.map(t => t.subject))];

      subjectsBox.innerHTML = '';
      uniqueSubjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = `badge-subject px-4 py-2 rounded-xl border text-xs font-bold ${sub === selectedSubject ? 'active' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`;
        btn.innerText = sub;
        btn.onclick = () => {
          selectedSubject = sub;
          renderSubjects();
          renderTeachers();
        };
        subjectsBox.appendChild(btn);
      });
    }

    function renderTeachers() {
      const grid = document.getElementById('teachers-grid');
      grid.innerHTML = '';

      let list = teachersData[selectedYear];
      if (selectedSubject !== 'Toutes') {
        list = list.filter(t => t.subject === selectedSubject);
      }

      list.forEach(t => {
        const card = document.createElement('div');
        card.className = "glass-card p-5 rounded-3xl border border-white space-y-3 hover:shadow-xl transition cursor-pointer flex flex-col justify-between";
        card.onclick = () => openModal(t);

        card.innerHTML = `
          <div class="space-y-2">
            <span class="text-[10px] font-extrabold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100 uppercase">${t.subject}</span>
            <h3 class="font-bold text-base text-gray-900">${t.name}</h3>
            <p class="text-xs text-gray-500 flex items-center gap-1 truncate">
              <i class="fa-solid fa-envelope text-indigo-400"></i> ${t.email}
            </p>
          </div>
          <div class="pt-2 border-t border-gray-100 flex items-center justify-between text-xs font-bold text-indigo-600">
            <span>Afficher la fiche</span>
            <i class="fa-solid fa-arrow-right"></i>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(t) {
      document.getElementById('modal-name').innerText = t.name;
      document.getElementById('modal-grade').innerText = t.grade || 'Enseignant';
      document.getElementById('modal-email').querySelector('span').innerText = t.email;
      document.getElementById('modal-modules').innerText = t.modules || t.subject;

      const advBox = document.getElementById('modal-advice-box');
      if (t.advice) {
        advBox.classList.remove('hidden');
        document.getElementById('modal-advice').innerText = t.advice;
      } else {
        advBox.classList.add('hidden');
      }

      const resBox = document.getElementById('modal-research-box');
      if (t.research) {
        resBox.classList.remove('hidden');
        document.getElementById('modal-research').innerText = t.research;
      } else {
        resBox.classList.add('hidden');
      }

      const linksBox = document.getElementById('modal-links-box');
      const linksContainer = document.getElementById('modal-links');
      if (t.links && t.links.length > 0) {
        linksBox.classList.remove('hidden');
        linksContainer.innerHTML = '';
        t.links.forEach(l => {
          linksContainer.innerHTML += `<a href="${l.url}" target="_blank" class="px-3 py-1 rounded-lg bg-cyan-50 text-cyan-700 border border-cyan-200 text-xs font-bold hover:bg-cyan-100 transition">${l.label} <i class="fa-solid fa-arrow-up-right-from-square text-[10px] ml-1"></i></a>`;
        });
      } else {
        linksBox.classList.add('hidden');
      }

      // إعداد الصورة أو الحرف الأول
      const imgBox = document.getElementById('modal-img-box');
      if (t.photo) {
        // إذا كان للأستاذ صورة، نعرضها. ونضع (onerror) في حال لم يتم العثور على الملف، نرجع للأحرف الأولى
        imgBox.innerHTML = `<img src="${t.photo}" alt="${t.name}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='${t.name.split(' ').map(n=>n[0]).join('').substring(0,2)}';">`;
      } else {
        // إذا لم تكن هناك صورة، نعرض الأحرف الأولى
        const initials = t.name.split(' ').map(n => n[0]).join('').substring(0, 2);
        imgBox.innerHTML = initials;
      }

      document.getElementById('teacher-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('teacher-modal').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      selectYear('1cp');
    });
  </script>
</body>
</html>
