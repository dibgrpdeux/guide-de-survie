<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="indigo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استعمال الزمن - حسب الفوج</title>

  <!-- كود الترجمة -->
  <script src="translate.js"></script>
  <style>
    body { top: 0 !important; }
    .skiptranslate iframe { display: none !important; }
    .goog-te-banner-frame { display: none !important; }
    #goog-gt-tt { display: none !important; }
    #google_translate_element { display: none; } 
    .lang-btn { background: transparent; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.2s; color: #64748b; }
    .lang-btn:hover { background: #f1f5f9; color: #1e293b; }
    .lang-btn.active { background: #4f46e5; color: white; }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
    }
    .btn-day {
      transition: all 0.3s;
    }
    .btn-day.active {
      background-color: #4f46e5;
      color: white;
      border-color: #4f46e5;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 lg:p-8">

  <div class="ambient-bg"></div>

  <main class="max-w-5xl mx-auto w-full space-y-6">

    <!-- الترويسة -->
    <div class="glass-card rounded-3xl p-6 md:p-8 flex flex-col md:flex-row items-center gap-6 relative">
      
      <!-- أزرار الترجمة (يمين أعلى الترويسة) -->
      <div class="absolute top-4 left-4 flex items-center gap-1 bg-white p-1 rounded-xl border border-gray-200 shadow-sm">
        <button onclick="setLanguage('ar')" id="btn-ar" class="lang-btn active">🇩🇿 عربي</button>
        <button onclick="setLanguage('fr')" id="btn-fr" class="lang-btn">🇫🇷 FR</button>
        <button onclick="setLanguage('en')" id="btn-en" class="lang-btn">🇬🇧 EN</button>
      </div>

      <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-3xl shrink-0 mt-8 md:mt-0">
        <i class="fa-solid fa-calendar-days"></i>
      </div>
      <div>
        <h1 class="text-2xl md:text-3xl font-black text-gray-900 mb-2" data-i18n="sched_title">استعمال الزمن الدقيق (حسب الفوج)</h1>
        <p class="text-gray-600 text-sm" data-i18n="sched_desc">حدد قسمك، سنتك الدراسية، وفوجك للحصول على توقيتك الخاص.</p>
      </div>
    </div>

    <!-- الفلاتر -->
    <div class="glass-card rounded-3xl p-6 md:p-8 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2" data-i18n="sched_dept">القسم / التخصص:</label>
          <select id="select-dept" onchange="updateYears()" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none font-semibold text-gray-800 transition">
            <option value="prep" data-i18n="sched_dep_prep">الطبقة التحضيرية (CP)</option>
            <option value="dib" data-i18n="sched_dep_dib">المنشآت القاعدية (DIB)</option>
            <option value="dms" data-i18n="sched_dep_dms">المواد والهياكل (DMS)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2" data-i18n="sched_year">السنة الدراسية:</label>
          <select id="select-year" onchange="updateGroups()" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none font-semibold text-gray-800 transition"></select>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2" data-i18n="sched_group">الفوج (Groupe):</label>
          <select id="select-group" onchange="renderSchedule()" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none font-semibold text-gray-800 transition"></select>
        </div>

      </div>

      <hr class="border-gray-100">

      <div class="flex flex-wrap gap-2 justify-center">
        <button onclick="changeDay('Saturday')" id="day-Saturday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600" data-i18n="sched_day_sat">السبت</button>
        <button onclick="changeDay('Sunday')" id="day-Sunday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600" data-i18n="sched_day_sun">الأحد</button>
        <button onclick="changeDay('Monday')" id="day-Monday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600" data-i18n="sched_day_mon">الإثنين</button>
        <button onclick="changeDay('Tuesday')" id="day-Tuesday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600" data-i18n="sched_day_tue">الثلاثاء</button>
        <button onclick="changeDay('Wednesday')" id="day-Wednesday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600" data-i18n="sched_day_wed">الأربعاء</button>
        <button onclick="changeDay('Thursday')" id="day-Thursday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600" data-i18n="sched_day_thu">الخميس</button>
      </div>

      <div class="bg-gray-50 rounded-2xl p-4 md:p-6 border border-gray-100">
        <h3 id="schedule-title" class="font-bold text-lg text-indigo-900 mb-4 border-r-4 border-indigo-500 pr-3">برنامج الحصص</h3>
        <div id="schedule-list" class="space-y-3"></div>
      </div>

    </div>
  </main>

  <script>
    let currentLang = localStorage.getItem('enstp_lang') || 'ar';

    function t(key) {
      return window.translations[currentLang][key] || key;
    }

    // قاموس ترجمة أسماء المواد
    const subjectTrans = {
      'Calculus 1': { ar: 'التحليل الرياضي 1', fr: 'Calculus 1', en: 'Calculus 1' },
      'Calculus 3': { ar: 'التحليل الرياضي 3', fr: 'Calculus 3', en: 'Calculus 3' },
      'Algebra 1': { ar: 'الجبر 1', fr: 'Algebra 1', en: 'Algebra 1' },
      'Physics 1': { ar: 'الفيزياء 1', fr: 'Physics 1', en: 'Physics 1' },
      'Physics 3': { ar: 'الفيزياء 3', fr: 'Physics 3', en: 'Physics 3' },
      'Chemistry 1': { ar: 'الكيمياء 1', fr: 'Chemistry 1', en: 'Chemistry 1' },
      'Chemistry 3': { ar: 'الكيمياء 3', fr: 'Chemistry 3', en: 'Chemistry 3' },
      'Computer Science 1': { ar: 'الإعلام الآلي 1', fr: 'Informatique 1', en: 'Computer Science 1' },
      'Computer Science 3': { ar: 'الإعلام الآلي 3', fr: 'Informatique 3', en: 'Computer Science 3' },
      'Proba 1': { ar: 'الاحتمالات 1', fr: 'Probabilités 1', en: 'Probability 1' },
      'Proba stat': { ar: 'الإحصاء والاحتمالات', fr: 'Proba Stat', en: 'Probability & Stat' },
      'Lab(Chem/Phys/Tech Draw)': { ar: 'أعمال تطبيقية (كيمياء/فيزياء/رسم)', fr: 'TP (Chimie/Physique/Dessin)', en: 'Lab (Chem/Phys/Draw)' },
      'تاريخ الجزائر': { ar: 'تاريخ الجزائر', fr: 'Histoire de l\'Algérie', en: 'History of Algeria' },
      'English 1': { ar: 'الإنجليزية 1', fr: 'Anglais 1', en: 'English 1' },
      'French 1': { ar: 'الفرنسية 1', fr: 'Français 1', en: 'French 1' },
      'General Electricity': { ar: 'الكهرباء العامة', fr: 'Électricité Générale', en: 'General Electricity' },
      'Fluid Mechanics': { ar: 'ميكانيكا الموائع', fr: 'Mécanique des Fluides', en: 'Fluid Mechanics' },
      'Rational Mech 1': { ar: 'الميكانيكا العقلانية 1', fr: 'Mécanique Rationnelle 1', en: 'Rational Mechanics 1' },
      'Numerical Analysis 1': { ar: 'التحليل العددي 1', fr: 'Analyse Numérique 1', en: 'Numerical Analysis 1' },
      'Exp Tech': { ar: 'تقنيات التعبير', fr: 'Techniques d\'Expression', en: 'Expression Tech' },
      'Engineering': { ar: 'الهندسة', fr: 'Ingénierie', en: 'Engineering' }
    };

    // 1. تعريف الأفواج لكل سنة
    const groupsDatabase = {
      'prep_1': Array.from({length: 12}, (_, i) => ({ value: `g${i+1}`, label: `${t('sched_group_lbl')} ${i+1}` })),
      'prep_2': Array.from({length: 12}, (_, i) => ({ value: `g${i+1}`, label: `${t('sched_group_lbl')} ${i+1}` })),
      'dib_1': Array.from({length: 4}, (_, i) => ({ value: `g${i+1}`, label: `${t('sched_group_lbl')} ${i+1}` })),
      'dib_2': Array.from({length: 4}, (_, i) => ({ value: `g${i+1}`, label: `${t('sched_group_lbl')} ${i+1}` })),
      'dib_3': [{ value: 'promo', label: t('sched_promo_lbl') }],
      'dms_1': Array.from({length: 4}, (_, i) => ({ value: `sec${i+1}`, label: `${t('sched_sec_lbl')} ${i+1}` })),
      'dms_2': Array.from({length: 2}, (_, i) => ({ value: `sec${i+1}`, label: `${t('sched_sec_lbl')} ${i+1}` })),
      'dms_3': [{ value: 'promo', label: t('sched_promo_lbl') }]
    };

    // 2. قاعدة بيانات استعمال الزمن (مختصرة هنا للتوضيح، استخدم البيانات الكاملة الخاصة بك)
    // ... (ضع هنا الكود الكامل لـ scheduleDatabase الذي أرسلته سابقاً) ...
    // لقد قمت باختصارها لتوفير المساحة، ولكن يجب نسخها كاملة من الكود الخاص بك.
    const scheduleDatabase = {
      'prep_1': { 'g1': { 'Sunday': [{ time: '08:00 - 09:30', subject: 'Calculus 1', prof: 'Mr. X', room: 'Room 1', type: 'Cours' }] } }
      // ... (أكمل باقي البيانات)
    };

    let selectedDay = 'Sunday';
    const dayKeys = { 'Saturday': 'sched_day_sat', 'Sunday': 'sched_day_sun', 'Monday': 'sched_day_mon', 'Tuesday': 'sched_day_tue', 'Wednesday': 'sched_day_wed', 'Thursday': 'sched_day_thu' };

    function updateYears() {
      const dept = document.getElementById('select-dept').value;
      const yearSelect = document.getElementById('select-year');
      yearSelect.innerHTML = '';

      if (dept === 'prep') {
        yearSelect.innerHTML = `
          <option value="prep_1">${t('sched_yr_prep1')}</option>
          <option value="prep_2">${t('sched_yr_prep2')}</option>
        `;
      } else if (dept === 'dib') {
        yearSelect.innerHTML = `
          <option value="dib_1">${t('sched_yr_dib1')}</option>
          <option value="dib_2">${t('sched_yr_dib2')}</option>
          <option value="dib_3">${t('sched_yr_dib3')}</option>
        `;
      } else if (dept === 'dms') {
        yearSelect.innerHTML = `
          <option value="dms_1">${t('sched_yr_dms1')}</option>
          <option value="dms_2">${t('sched_yr_dms2')}</option>
          <option value="dms_3">${t('sched_yr_dms3')}</option>
        `;
      }
      updateGroups();
    }

    function updateGroups() {
      const year = document.getElementById('select-year').value;
      const groupSelect = document.getElementById('select-group');
      groupSelect.innerHTML = '';

      // تحديث الأفواج بناءً على اللغة
      let groups = [];
      if (year.startsWith('prep')) {
        groups = Array.from({length: 12}, (_, i) => ({ value: `g${i+1}`, label: `${t('sched_group_lbl')} ${i+1}` }));
      } else if (year.startsWith('dib')) {
        if (year === 'dib_3') groups = [{ value: 'promo', label: t('sched_promo_lbl') }];
        else groups = Array.from({length: 4}, (_, i) => ({ value: `g${i+1}`, label: `${t('sched_group_lbl')} ${i+1}` }));
      } else if (year.startsWith('dms')) {
        if (year === 'dms_3') groups = [{ value: 'promo', label: t('sched_promo_lbl') }];
        else if (year === 'dms_2') groups = Array.from({length: 2}, (_, i) => ({ value: `sec${i+1}`, label: `${t('sched_sec_lbl')} ${i+1}` }));
        else groups = Array.from({length: 4}, (_, i) => ({ value: `sec${i+1}`, label: `${t('sched_sec_lbl')} ${i+1}` }));
      }

      groups.forEach(g => {
        const option = document.createElement('option');
        option.value = g.value;
        option.textContent = g.label;
        groupSelect.appendChild(option);
      });

      renderSchedule();
    }

    function changeDay(day) {
      selectedDay = day;
      document.querySelectorAll('.btn-day').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`day-${day}`);
      if (activeBtn) activeBtn.classList.add('active');

      document.getElementById('schedule-title').innerText = `${t('sched_day_' + day.substring(0,3).toLowerCase())} - ${t('sched_title')}`;
      renderSchedule();
    }

    function renderSchedule() {
      const year = document.getElementById('select-year').value;
      const group = document.getElementById('select-group').value;
      const container = document.getElementById('schedule-list');

      container.innerHTML = '';

      let items = [];
      if (scheduleDatabase[year] && scheduleDatabase[year][group] && scheduleDatabase[year][group][selectedDay]) {
        items = scheduleDatabase[year][group][selectedDay];
      }

      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center p-6 text-gray-500 font-bold bg-white rounded-xl border border-gray-200">
            <i class="fa-regular fa-face-smile-wink text-2xl mb-2 text-indigo-300 block"></i>
            ${t('sched_no_classes')}
          </div>
        `;
        return;
      }

      items.forEach(item => {
        let typeBadge = '';
        if (item.type === 'Cours') typeBadge = `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-black">${t('sched_cours')}</span>`;
        if (item.type === 'TD') typeBadge = `<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[10px] font-black">${t('sched_td')}</span>`;
        if (item.type === 'TP') typeBadge = `<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[10px] font-black">${t('sched_tp')}</span>`;

        // ترجمة اسم المادة
        const subjName = subjectTrans[item.subject] ? subjectTrans[item.subject][currentLang] : item.subject;

        const row = document.createElement('div');
        row.className = "p-4 bg-white rounded-2xl border border-gray-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4 hover:shadow-md transition";
        row.innerHTML = `
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold shrink-0">
              <i class="fa-solid fa-clock"></i>
            </div>
            <div>
              <div class="flex items-center gap-2 mb-1">
                <h5 class="font-bold text-gray-900 text-base">${subjName}</h5>
                ${typeBadge}
              </div>
              <p class="text-sm text-gray-500 font-semibold"><i class="fa-solid fa-user-tie text-gray-400 ml-1"></i> ${t('sched_teacher')} ${item.prof}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-xl border border-gray-100 w-fit shrink-0">
            <span class="text-xs font-bold text-gray-700 px-2"><i class="fa-solid fa-hourglass-start text-indigo-400 ml-1"></i> ${item.time}</span>
            <span class="w-px h-4 bg-gray-300"></span>
            <span class="text-xs font-bold text-indigo-700 px-2"><i class="fa-solid fa-location-dot text-indigo-400 ml-1"></i> ${item.room}</span>
          </div>
        `;
        container.appendChild(row);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateYears();

      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      let today = days[new Date().getDay()];
      if (today === 'Friday') today = 'Saturday';
      changeDay(today);
      
      setTimeout(() => setLanguage(currentLang), 100);
    });
  </script>
</body>
</html>
