  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    body {
      font-family: 'Cairo', sans-serif;

    }
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
    }
    .btn-day {
      transition: all 0.3s;
    }
    .btn-day.active {
      background-color: #4f46e5;
      color: white;
      border-color: #4f46e5;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

<body class="min-h-screen flex flex-col justify-between p-4 lg:p-8">

  <div class="ambient-bg"></div>

  <main class="max-w-5xl mx-auto w-full space-y-6">

    <div class="glass-card rounded-3xl p-6 md:p-8 flex flex-col md:flex-row items-center gap-6">

        <i class="fa-solid fa-calendar-days"></i>
      </div>
      <div>
        <h1 class="text-2xl md:text-3xl font-black text-gray-900 mb-2">استعمال الزمن الدقيق (حسب الفوج)</h1>
        <p class="text-gray-600 text-sm">حدد قسمك، سنتك الدراسية، وفوجك للحصول على توقيتك الخاص (المحاضرات والأعمال التطبيقية/الموجهة).</p>
      </div>
    </div>

    <!-- الفلاتر -->
    <div class="glass-card rounded-3xl p-6 md:p-8 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">القسم / التخصص:</label>
          <select id="select-dept" onchange="updateYears()" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none font-semibold text-gray-800 transition">
            <option value="prep">الطبقة التحضيرية (CP)</option>
            <option value="dib">المنشآت القاعدية (DIB)</option>
            <option value="dms">المواد والهياكل (DMS)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">السنة الدراسية:</label>
          <select id="select-year" onchange="updateGroups()" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none font-semibold text-gray-800 transition"></select>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">الفوج (Groupe):</label>
          <select id="select-group" onchange="renderSchedule()" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none font-semibold text-gray-800 transition"></select>
        </div>

      </div>

      <hr class="border-gray-100">

      <div class="flex flex-wrap gap-2 justify-center">
        <button onclick="changeDay('Saturday')" id="day-Saturday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600">السبت</button>
        <button onclick="changeDay('Sunday')" id="day-Sunday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600">الأحد</button>
        <button onclick="changeDay('Monday')" id="day-Monday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600">الإثنين</button>
        <button onclick="changeDay('Tuesday')" id="day-Tuesday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600">الثلاثاء</button>
        <button onclick="changeDay('Wednesday')" id="day-Wednesday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600">الأربعاء</button>
        <button onclick="changeDay('Thursday')" id="day-Thursday" class="btn-day px-5 py-2 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600">الخميس</button>

            { time: '13h30 - 15h00', subject: "Calcul d'Ouvrages", prof: 'Mr. LADJEL', room: '19', type: 'Cours' },
            { time: '15h05 - 16h40', subject: 'Dév. Dur. Amen. Territ.', prof: 'Mme SAADI', room: '24', type: 'Cours' }
          ],
          'Monday': [
            { time: '08h00 - 09h30', subject: "Pathologie et Réhabilitation des Ouvrages d'Art", prof: 'Mr. FEDGHOUCHE', room: '19', type: 'Cours' },
            { time: '09h35 - 11h05', subject: 'Optimisation dans le Génie Civil', prof: 'Mr FEDGHOUCHE', room: '19', type: 'Cours' },
            { time: '11h10 - 12h40', subject: 'Organisation de chantier', prof: 'Mr MOKHTAR', room: '19', type: 'Cours' },
            { time: '13h30 - 16h40', subject: 'Thermique Bâtiment (GROUPE BAT)', prof: 'M. ANNAD', room: '19', type: 'TD' }
          ],
          'Tuesday': [

            { time: '09h35 - 11h05', subject: 'Dynamique des Sols 2', prof: 'Mr HADID', room: '19', type: 'Cours' },
            { time: '09h35 - 12h40', subject: 'TD DOSOLS', prof: 'Mr. TOUNSI / Mme ZAHAFI', room: '10 / 11', type: 'TD' },
            { time: '13h30 - 16h40', subject: 'Visites de Chantiers', prof: '---', room: 'Mape', type: 'TP' }
          ],
          'Wednesday': [
            { time: '08h00 - 09h30', subject: 'Droit des TP', prof: 'Mr HAMADI', room: '19', type: 'Cours' },
            { time: '09h35 - 11h05', subject: 'Matériaux Innovants', prof: 'Mme MSILI', room: '19', type: 'Cours' },

            { time: '13h30 - 16h40', subject: 'Esquisse Bâtiments / Tunnels', prof: 'Mr AKNOUCHE / Mr CHERCHALI', room: '19 / 17', type: 'TD' }
          ],

          ]
        }
      }
    };

    let selectedDay = 'Sunday';
    const dayNames = { 'Saturday': 'السبت', 'Sunday': 'الأحد', 'Monday': 'الإثنين', 'Tuesday': 'الثلاثاء', 'Wednesday': 'الأربعاء', 'Thursday': 'الخميس' };

    function updateYears() {
      const dept = document.getElementById('select-dept').value;
      const yearSelect = document.getElementById('select-year');
      yearSelect.innerHTML = '';

      if (dept === 'prep') {
        yearSelect.innerHTML = `
          <option value="prep_1">السنة الأولى تحضيري (1CP)</option>
          <option value="prep_2">السنة الثانية تحضيري (2CP)</option>
        `;
      } else if (dept === 'dib') {
        yearSelect.innerHTML = `
          <option value="dib_1">السنة الأولى مهندس (DIB)</option>
          <option value="dib_2">السنة الثانية مهندس (DIB)</option>
          <option value="dib_3">السنة الثالثة مهندس (DIB)</option>
        `;
      } else if (dept === 'dms') {
        yearSelect.innerHTML = `
          <option value="dms_1">السنة الأولى مهندس (DMS)</option>
          <option value="dms_2">السنة الثانية مهندس (DMS)</option>
          <option value="dms_3">السنة الثالثة مهندس (DMS)</option>
        `;
      }
      updateGroups();
    }

    function updateGroups() {
      const year = document.getElementById('select-year').value;
      const groupSelect = document.getElementById('select-group');
      groupSelect.innerHTML = '';

      const groups = groupsDatabase[year] || [];
      groups.forEach(g => {
        const option = document.createElement('option');
        option.value = g.value;
        option.textContent = g.label;
        groupSelect.appendChild(option);
      });

      renderSchedule();
    }

    function changeDay(day) {
      selectedDay = day;
      document.querySelectorAll('.btn-day').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`day-${day}`);
      if (activeBtn) activeBtn.classList.add('active');

      document.getElementById('schedule-title').innerText = `برنامج الحصص ليوم ${dayNames[day]}`;
      renderSchedule();
    }

    function renderSchedule() {
      const year = document.getElementById('select-year').value;
      const group = document.getElementById('select-group').value;
      const container = document.getElementById('schedule-list');

      container.innerHTML = '';

      let items = [];
      if (scheduleDatabase[year] && scheduleDatabase[year][group] && scheduleDatabase[year][group][selectedDay]) {
        items = scheduleDatabase[year][group][selectedDay];
      }

      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center p-6 text-gray-500 font-bold bg-white rounded-xl border border-gray-200">
            <i class="fa-regular fa-face-smile-wink text-2xl mb-2 text-indigo-300 block"></i>
            لا توجد حصص مبرمجة في هذا اليوم لهذا الفوج.
          </div>
        `;
        return;
      }

      items.forEach(item => {
        let typeBadge = '';
        if (item.type === 'Cours') typeBadge = '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-black">محاضرة</span>';
        if (item.type === 'TD') typeBadge = '<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[10px] font-black">أعمال موجهة (TD)</span>';
        if (item.type === 'TP') typeBadge = '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[10px] font-black">أعمال تطبيقية (TP)</span>';

        const row = document.createElement('div');
        row.className = "p-4 bg-white rounded-2xl border border-gray-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4 hover:shadow-md transition";
        row.innerHTML = `
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold shrink-0">
              <i class="fa-solid fa-clock"></i>
            </div>
            <div>
              <div class="flex items-center gap-2 mb-1">
                <h5 class="font-bold text-gray-900 text-base">${item.subject}</h5>
                ${typeBadge}
              </div>
              <p class="text-sm text-gray-500 font-semibold"><i class="fa-solid fa-user-tie text-gray-400 ml-1"></i> الأستاذ: ${item.prof}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-xl border border-gray-100 w-fit shrink-0">
            <span class="text-xs font-bold text-gray-700 px-2"><i class="fa-solid fa-hourglass-start text-indigo-400 ml-1"></i> ${item.time}</span>
            <span class="w-px h-4 bg-gray-300"></span>
            <span class="text-xs font-bold text-indigo-700 px-2"><i class="fa-solid fa-location-dot text-indigo-400 ml-1"></i> ${item.room}</span>
          </div>
        `;
        container.appendChild(row);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateYears();

      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      let today = days[new Date().getDay()];
      if (today === 'Friday') today = 'Saturday';
      changeDay(today);
    });
  </script>
</body>
