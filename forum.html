<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتدى الطلابي - ENSTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- شاشة تسجيل الدخول / إنشاء حساب -->
  <div id="authScreen" class="fixed inset-0 bg-slate-900 bg-opacity-90 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800">المنتدى الطلابي</h2>
        <p class="text-sm text-gray-500">خاص بطلبة المدرسة الوطنية العليا</p>
      </div>

      <!-- الاستمارة -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1">البريد الإلكتروني</label>
          <input type="email" id="emailInput" placeholder="student@enstp.edu.dz" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" dir="ltr">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">كلمة السر</label>
          <input type="password" id="passInput" placeholder="********" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" dir="ltr">
        </div>

        <!-- حقول إضافية تظهر فقط عند إنشاء حساب جديد -->
        <div id="registerFields" class="hidden space-y-4">
          <div>
            <label class="block text-sm font-bold mb-1">الاسم</label>
            <input type="text" id="firstNameInput" placeholder="مثال: أحمد" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">اللقب</label>
            <input type="text" id="lastNameInput" placeholder="مثال: بن علي" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">السنة الدراسية</label>
            <select id="yearInput" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="1CP">السنة الأولى تحضيري (1CP)</option>
              <option value="2CP">السنة الثانية تحضيري (2CP)</option>
              <option value="DIB">هندسة المنشآت القاعدية (DIB)</option>
              <option value="DMS">هندسة المواد والهياكل (DMS)</option>
            </select>
          </div>
        </div>

        <p id="errorMsg" class="text-red-500 text-sm font-bold text-center hidden"></p>

        <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">تسجيل الدخول</button>
        
        <div class="text-center mt-4 text-sm">
          <span id="toggleText" class="text-gray-500">ليس لديك حساب؟</span>
          <button id="toggleBtn" class="text-blue-600 font-bold hover:underline">إنشاء حساب جديد</button>
        </div>
      </div>
    </div>
  </div>

  <!-- واجهة المنتدى (تظهر بعد تسجيل الدخول) -->
  <div id="forumScreen" class="hidden flex-col h-screen max-w-4xl mx-auto w-full bg-white shadow-xl">
    
    <!-- الترويسة -->
    <header class="bg-white p-4 border-b flex justify-between items-center shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold">
          <span id="userAvatar">U</span>
        </div>
        <div>
          <h1 class="font-bold text-gray-800">الغرفة العامة</h1>
          <p class="text-xs text-gray-500" id="userInfo">طالب</p>
        </div>
      </div>
      <button id="logoutBtn" class="text-gray-500 hover:text-red-500 transition"><i class="fa-solid fa-power-off"></i> خروج</button>
    </header>

    <!-- المنشورات -->
    <div id="postsContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
      <!-- تضاف المنشورات هنا -->
    </div>

    <!-- صندوق النشر -->
    <div class="p-4 bg-white border-t">
      <div class="flex gap-2">
        <textarea id="postText" rows="1" placeholder="ماذا تريد أن تقول..." class="w-full p-3 bg-gray-100 border rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
        <button id="postBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-xl font-bold transition"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

  </div>

  <!-- ربط ملف الجافاسكريبت -->
  <script src="forum.js"></script>
</body>
</html>
