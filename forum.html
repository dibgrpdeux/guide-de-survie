<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منتدى الطلبة - ENSTP Survival Guide</title>
  <!-- مكتبة Tailwind CSS للتنسيق -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- شاشة تسجيل الدخول (تظهر إذا لم يقم الطالب بتسجيل الدخول) -->
  <div id="authOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full text-center">
      <h2 class="text-2xl font-bold mb-4 text-gray-800">المنتدى الطلابي ENSTP</h2>
      <p class="text-gray-600 mb-6">الدخول مخصص حصرياً لطلبة المدرسة عبر البريد الإلكتروني الرسمي (<span class="font-bold dir-ltr">@enstp.edu.dz</span>)</p>
      
      <button id="googleLoginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-3 transition">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12.24 10.285V13.4h6.887C18.2 16.14 15.65 18 12.24 18c-3.315 0-6-2.685-6-6s2.685-6 6-6c1.47 0 2.81.53 3.84 1.41l2.55-2.55C17.06 3.42 14.82 2.5 12.24 2.5 7.005 2.5 2.75 6.755 2.75 12S7.005 21.5 12.24 21.5c5.485 0 9.155-3.86 9.155-9.315 0-.63-.06-1.23-.17-1.9H12.24z"/></svg>
        تسجيل الدخول عبر بريد المدرسة
      </button>

      <p id="authError" class="text-red-500 text-sm mt-4 hidden">عذراً، يجب استخدام بريد ينتهي بـ @enstp.edu.dz</p>
    </div>
  </div>

  <!-- الواجهة الرئيسية للمنتدى -->
  <div id="forumMain" class="flex h-screen overflow-hidden hidden">

    <!-- القائمة الجانبية (الغرف) -->
    <aside class="w-80 bg-gray-900 text-white flex flex-col justify-between border-l border-gray-800">
      <div class="p-4 overflow-y-auto">
        <h1 class="text-xl font-bold border-b border-gray-700 pb-3 mb-4 flex items-center gap-2">
          💬 منتديات ENSTP
        </h1>

        <!-- غرف عامة -->
        <div class="mb-6">
          <p class="text-xs text-gray-400 font-semibold mb-2 px-2">القنوات العامة</p>
          <button onclick="selectChannel('general', '📢 الغرفة العامة')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-2 text-gray-300 active-channel">
            <span>📢</span> الغرفة العامة
          </button>
        </div>

        <!-- غرف الأفواج والأقسام -->
        <div class="mb-6">
          <p class="text-xs text-gray-400 font-semibold mb-2 px-2">غرف الأفواج (Groups)</p>
          <div class="space-y-1">
            <button onclick="selectChannel('1cp_g6', '🎓 1CP - Groupe 06')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-2 text-gray-300">
              <span>🎓</span> 1CP - Groupe 06
            </button>
            <button onclick="selectChannel('1cp_g7', '🎓 1CP - Groupe 07')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-2 text-gray-300">
              <span>🎓</span> 1CP - Groupe 07
            </button>
            <button onclick="selectChannel('2cp_g2', '🎓 2CP - Groupe 02')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-2 text-gray-300">
              <span>🎓</span> 2CP - Groupe 02
            </button>
            <button onclick="selectChannel('dib_1_g1', '🏗️ 1st DIB - Groupe 01')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-2 text-gray-300">
              <span>🏗️</span> 1st DIB - Groupe 01
            </button>
            <button onclick="selectChannel('dms_1_sec1', '🧪 1st DMS - Section 01')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-2 text-gray-300">
              <span>🧪</span> 1st DMS - Section 01
            </button>
          </div>
        </div>

        <!-- غرف الولايات -->
        <div class="mb-6">
          <p class="text-xs text-gray-400 font-semibold mb-2 px-2">غرف حسب الولايات</p>
          <div class="space-y-1 max-h-48 overflow-y-auto">
            <button onclick="selectChannel('wilaya_16', '📍 16 - الجزائر')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-2 text-gray-300">
              <span>📍</span> 16 - الجزائر
            </button>
            <button onclick="selectChannel('wilaya_09', '📍 09 - البليدة')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-2 text-gray-300">
              <span>📍</span> 09 - البليدة
            </button>
            <button onclick="selectChannel('wilaya_31', '📍 31 - وهران')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-2 text-gray-300">
              <span>📍</span> 31 - وهران
            </button>
            <button onclick="selectChannel('wilaya_25', '📍 25 - قسنطينة')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-2 text-gray-300">
              <span>📍</span> 25 - قسنطينة
            </button>
          </div>
        </div>
      </div>

      <!-- معلومات حساب الطالب الحالي -->
      <div class="p-4 border-t border-gray-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img id="userAvatar" src="" class="w-9 h-9 rounded-full bg-gray-700" alt="Avatar">
          <div class="overflow-hidden">
            <p id="userName" class="text-sm font-semibold truncate">طالب</p>
            <p id="userEmail" class="text-xs text-gray-400 truncate">student@enstp.edu.dz</p>
          </div>
        </div>
        <button id="logoutBtn" title="تسجيل الخروج" class="text-gray-400 hover:text-red-400 text-sm">🚪</button>
      </div>
    </aside>

    <!-- المنطقة المركزية للمنشورات -->
    <main class="flex-1 flex flex-col bg-gray-50">
      
      <!-- ترويسة الغرفة -->
      <header class="bg-white p-4 shadow-sm border-b border-gray-200 flex justify-between items-center">
        <h2 id="currentChannelTitle" class="text-lg font-bold text-gray-800">📢 الغرفة العامة</h2>
        <span class="text-xs bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-medium">مفتوح للجميع</span>
      </header>

      <!-- قائمة المنشورات (Scrollable) -->
      <div id="postsFeed" class="flex-1 overflow-y-auto p-6 space-y-4">
        <!-- سيتم إدراج المنشورات تلقائياً عبر JS -->
      </div>

      <!-- صندوق كتابة منشور جديد -->
      <div class="bg-white p-4 border-t border-gray-200 shadow-md">
        <div class="flex flex-col gap-2">
          <textarea id="postContent" rows="3" placeholder="اكتب مشاركتك هنا أو استفسارك بروح ممتنة وزميلة..." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none"></textarea>
          <div class="flex justify-end">
            <button id="submitPostBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition flex items-center gap-2">
              <span>نشر</span>
              <span>🚀</span>
            </button>
          </div>
        </div>
      </div>

    </main>

  </div>

  <!-- ربط خوادم Firebase والسكربت الخاص بالتطبيق -->
  <script type="module" src="forum.js"></script>
</body>
</html>
