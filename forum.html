<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتدى الطلابي - ENSTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style> 
    body { font-family: 'Cairo', sans-serif; }
    /* تخصيص شريط التمرير */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden">

  <!-- شاشة تحميل مبدئية -->
  <div id="loadingScreen" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50">
    <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="font-bold text-gray-600">جاري الاتصال بالمنتدى...</p>
  </div>

  <!-- شاشة تسجيل الدخول -->
  <div id="authScreen" class="fixed inset-0 bg-slate-900 bg-opacity-95 flex items-center justify-center z-40 p-4 backdrop-blur-md hidden">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
          <i class="fa-solid fa-users-rays"></i>
        </div>
        <h2 class="text-2xl font-black text-gray-800">ملتقى طلبة ENSTP</h2>
        <p class="text-sm text-gray-500">مساحة آمنة للنقاش وتبادل الأفكار</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1">البريد المهني</label>
          <input type="email" id="emailInput" placeholder="student@enstp.edu.dz" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" dir="ltr">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">كلمة السر</label>
          <input type="password" id="passInput" placeholder="********" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" dir="ltr">
        </div>

        <div id="registerFields" class="hidden space-y-4 pt-2 border-t">
          <div>
            <label class="block text-sm font-bold mb-1">الاسم واللقب</label>
            <input type="text" id="nameInput" placeholder="مثال: أحمد بن علي" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">السنة الدراسية</label>
            <select id="yearInput" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="1CP">1CP</option>
              <option value="2CP">2CP</option>
              <option value="DIB">DIB</option>
              <option value="DMS">DMS</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">الولاية (للدخول لغرفة ولايتك)</label>
            <select id="wilayaInput" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="16 - الجزائر">16 - الجزائر</option>
              <option value="09 - البليدة">09 - البليدة</option>
              <option value="31 - وهران">31 - وهران</option>
              <option value="25 - قسنطينة">25 - قسنطينة</option>
              <option value="19 - سطيف">19 - سطيف</option>
            </select>
          </div>
        </div>

        <p id="errorMsg" class="text-red-500 text-sm font-bold text-center hidden bg-red-50 p-2 rounded"></p>

        <button id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">تسجيل الدخول</button>
        <div class="text-center mt-4 text-sm">
          <span id="toggleText" class="text-gray-500">ليس لديك حساب؟</span>
          <button id="toggleBtn" class="text-blue-600 font-bold hover:underline">إنشاء حساب جديد</button>
        </div>
      </div>
    </div>
  </div>

  <!-- واجهة المنتدى الرئيسية -->
  <div id="forumScreen" class="hidden h-full flex flex-row relative">
    
    <!-- القائمة الجانبية (الغرف) -->
    <aside class="w-72 bg-gray-900 text-white flex flex-col h-full shrink-0">
      <div class="p-4 border-b border-gray-800 flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md">E</div>
        <div>
          <h1 class="font-bold text-sm leading-tight text-white">ملتقى الطلبة</h1>
          <p class="text-[10px] text-gray-400">ENSTP Kouba</p>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-3 space-y-6">
        <!-- الغرف العامة -->
        <div>
          <p class="text-[10px] text-gray-500 font-bold mb-2 uppercase tracking-wider px-2">القنوات العامة</p>
          <button onclick="selectChannel('general', 'Salle Général', 'عام')" class="w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-3 text-sm transition-colors text-blue-400 bg-gray-800/50">
            <i class="fa-solid fa-globe"></i> Salle Général
          </button>
        </div>

        <!-- غرف الولايات -->
        <div>
          <p class="text-[10px] text-gray-500 font-bold mb-2 uppercase tracking-wider px-2">غرف الولايات</p>
          <div id="wilayaChannels" class="space-y-1">
            <!-- سيتم توليد غرف الولايات هنا -->
          </div>
        </div>

        <!-- غرف الطلبة -->
        <div>
          <div class="flex justify-between items-center px-2 mb-2">
            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">غرف الطلبة</p>
            <button onclick="openCreateRoomModal()" class="text-blue-400 hover:text-white transition text-xs" title="إنشاء غرفة"><i class="fa-solid fa-plus-circle"></i></button>
          </div>
          <div id="customChannels" class="space-y-1">
            <!-- سيتم توليد غرف الطلبة هنا -->
          </div>
        </div>
      </div>

      <!-- معلومات الطالب -->
      <div class="p-4 border-t border-gray-800 bg-gray-950 flex items-center justify-between">
        <div class="flex items-center gap-3 overflow-hidden">
          <div id="userAvatar" class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm shrink-0 shadow-sm">U</div>
          <div class="overflow-hidden">
            <p id="userName" class="text-sm font-bold truncate text-white">طالب</p>
            <p id="userInfo" class="text-[10px] text-gray-400 truncate dir-ltr">info</p>
          </div>
        </div>
        <button id="logoutBtn" class="text-gray-500 hover:text-red-500 transition text-lg" title="خروج"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </aside>

    <!-- المحتوى الرئيسي (المنشورات) -->
    <main class="flex-1 flex flex-col bg-gray-100 h-full relative">
      <!-- ترويسة الغرفة -->
      <header class="bg-white p-4 shadow-sm border-b flex justify-between items-center z-10">
        <div>
          <h2 id="channelTitle" class="text-lg font-black text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-globe text-blue-500"></i> Salle Général
          </h2>
          <p id="channelSubtitle" class="text-xs text-gray-500 font-cairo">النقاشات العامة لجميع الطلبة</p>
        </div>
        <span class="text-[10px] bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold flex items-center gap-1">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> متصل
        </span>
      </header>

      <!-- قائمة المنشورات -->
      <div id="postsContainer" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
        <!-- تضاف المنشورات هنا -->
      </div>

      <!-- صندوق النشر (يشبه فيسبوك) -->
      <div class="absolute bottom-0 left-0 right-0 bg-white border-t p-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="max-w-3xl mx-auto flex gap-3 items-end">
          <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold shrink-0 mb-1">
            <span id="postAvatar">U</span>
          </div>
          <div class="flex-1 bg-gray-100 rounded-2xl border border-transparent focus-within:border-blue-300 focus-within:bg-white transition-all p-2">
            <textarea id="postText" rows="1" placeholder="بماذا تفكر؟..." class="w-full bg-transparent border-none outline-none resize-none px-2 text-sm text-gray-800 placeholder-gray-500 custom-scrollbar"></textarea>
            <div class="flex justify-between items-center px-2 pt-2 border-t border-gray-200 mt-1">
              <div class="flex gap-2 text-gray-400">
                <button class="hover:text-blue-500"><i class="fa-solid fa-image"></i></button>
                <button class="hover:text-blue-500"><i class="fa-solid fa-paperclip"></i></button>
              </div>
              <button id="postBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-1.5 rounded-lg font-bold text-sm transition shadow-sm flex items-center gap-2">
                نشر <i class="fa-solid fa-paper-plane text-xs"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- نافذة إنشاء غرفة جديدة -->
  <div id="createRoomModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <h3 class="text-xl font-bold mb-4">إنشاء غرفة جديدة</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1">اسم الغرفة</label>
          <input type="text" id="newRoomName" placeholder="مثال: نادي الرياضيات" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="flex gap-2 justify-end">
          <button onclick="closeCreateRoomModal()" class="px-4 py-2 text-gray-600 font-bold hover:bg-gray-100 rounded-lg">إلغاء</button>
          <button onclick="createRoom()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow-md">إنشاء</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="forum.js"></script>
</body>
</html>
