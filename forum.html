<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملتقى الطلبة - ENSTP</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' },
            bg: '#fdfbf7'
          },
          fontFamily: { sans: ['Cairo', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { background-color: var(--bg); font-family: 'Cairo', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .post-card { transition: all 0.3s ease; }
    .post-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    .chat-item { transition: background 0.2s; cursor: pointer; }
    .chat-item:hover { background: #fff7ed; }
    .chat-item.active { background: #ffedd5; border-right: 4px solid #f97316; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    
    /* Chat Bubbles */
    .chat-bubble-me { background: linear-gradient(135deg, #f97316, #ea580c); color: white; border-radius: 18px 18px 4px 18px; }
    .chat-bubble-other { background: #ffffff; color: #1e293b; border-radius: 18px 18px 18px 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); border: 1px solid #f1f5f9; }
  </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden flex flex-col">

  <!-- HEADER -->
  <header class="bg-white border-b border-gray-200 py-3 px-6 flex justify-between items-center shrink-0 z-20 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-brand-500 text-white rounded-xl flex items-center justify-center text-xl shadow-md">
        <i class="fa-solid fa-users-rays"></i>
      </div>
      <div>
        <h1 class="text-xl font-black text-gray-900 leading-tight">ملتقى الطلبة</h1>
        <p class="text-[11px] text-gray-500 font-semibold">مساحة النقاش والتبادل بين الطلبة</p>
      </div>
    </div>
    
    <div id="headerAuthArea">
      <button id="loginBtn" onclick="document.getElementById('authModal').classList.remove('hidden')" class="bg-brand-500 hover:bg-brand-600 text-white px-5 py-2 rounded-xl font-bold text-sm transition shadow-md">
        تسجيل الدخول
      </button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="flex-1 flex overflow-hidden max-w-[1600px] mx-auto w-full p-4 gap-6">

    <!-- SIDEBAR (Chats) -->
    <aside class="w-80 bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden shrink-0 hidden lg:flex">
      
      <!-- Sidebar Header -->
      <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-brand-50/50">
        <div class="flex items-center gap-2">
          <button onclick="closeChatArea()" id="backToChatListBtn" class="hidden text-gray-500 hover:text-brand-500 transition"><i class="fa-solid fa-arrow-right"></i></button>
          <h2 id="chatSidebarTitle" class="font-black text-gray-800 text-lg">الرسائل والدردشة</h2>
        </div>
        <button onclick="document.getElementById('createRoomModal').classList.remove('hidden')" class="w-8 h-8 rounded-full bg-white text-brand-500 hover:bg-brand-100 flex items-center justify-center transition shadow-sm border border-brand-100" title="إنشاء غرفة">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <!-- Chat List -->
      <div class="flex-1 overflow-y-auto" id="chatListContainer">
        <div class="p-4 text-center text-gray-400 text-sm">جاري التحميل...</div>
      </div>

      <!-- Active Chat Area -->
      <div id="activeChatArea" class="hidden flex-1 flex flex-col h-full bg-gray-50 absolute inset-0 z-30 transform translate-x-full transition-transform duration-300">
        <div class="p-3 border-b border-gray-200 flex items-center gap-3 bg-white shrink-0">
          <button onclick="closeChatArea()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition"><i class="fa-solid fa-arrow-right"></i></button>
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center font-bold"><i class="fa-solid fa-hashtag"></i></div>
            <div>
              <h3 id="activeChatName" class="font-bold text-sm text-gray-900">اسم الغرفة</h3>
              <p class="text-[10px] text-green-500 font-bold">متصل الآن</p>
            </div>
          </div>
        </div>

        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col"></div>

        <div class="p-3 border-t border-gray-200 bg-white shrink-0">
          <form id="chatForm" class="flex items-center gap-2 bg-gray-100 rounded-xl p-1 border border-transparent focus-within:border-brand-300 transition">
            <input type="text" id="chatInput" placeholder="اكتب رسالة..." class="flex-1 bg-transparent border-none outline-none px-3 py-2 text-sm text-gray-800" required autocomplete="off">
            <button type="submit" class="w-9 h-9 rounded-lg bg-brand-500 hover:bg-brand-600 text-white flex items-center justify-center transition shadow-sm shrink-0">
              <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
          </form>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT (Posts) -->
    <main class="flex-1 flex flex-col min-w-0">
      
      <!-- Top Bar -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4 flex flex-wrap items-center justify-between gap-4 shrink-0">
        <div class="flex gap-2 overflow-x-auto no-scrollbar">
          <button class="bg-brand-500 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md whitespace-nowrap">الكل</button>
          <button class="bg-gray-100 text-gray-700 px-5 py-2 rounded-xl text-sm font-bold transition whitespace-nowrap">نقاشات</button>
        </div>
        <div class="flex items-center gap-2 w-full md:w-auto">
          <button onclick="document.getElementById('createPostModal').classList.remove('hidden')" class="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-xl font-bold text-sm transition shadow-md flex items-center gap-2 whitespace-nowrap">
            <i class="fa-solid fa-plus"></i> نشر منشور
          </button>
        </div>
      </div>

      <!-- Posts Grid -->
      <div class="flex-1 overflow-y-auto pb-4" id="postsGridContainer">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4" id="postsGrid"></div>
        <div id="noPostsMessage" class="hidden text-center py-20 text-gray-400">
          <i class="fa-regular fa-folder-open text-6xl mb-4 opacity-50"></i>
          <p class="text-lg font-bold">لا توجد منشورات بعد. كن أول من ينشر!</p>
        </div>
      </div>
    </main>
  </div>

  <!-- ================= MODALS ================= -->

  <!-- Create Post Modal -->
  <div id="createPostModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 w-full max-w-lg shadow-2xl relative animate-fade-in">
      <button onclick="document.getElementById('createPostModal').classList.add('hidden')" class="absolute top-4 left-4 w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-brand-100 text-brand-500 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl"><i class="fa-solid fa-pen-nib"></i></div>
        <h2 class="text-2xl font-black text-gray-900">نشر منشور جديد</h2>
      </div>
      <form id="createPostForm" class="space-y-4">
        <div><label class="block text-sm font-bold mb-1">العنوان</label><input type="text" id="postTitle" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 outline-none focus:border-brand-500"></div>
        <div><label class="block text-sm font-bold mb-1">المحتوى</label><textarea id="postContent" required rows="3" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 outline-none focus:border-brand-500 resize-none"></textarea></div>
        <p id="postError" class="text-red-500 text-sm font-bold text-center hidden"></p>
        <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition">نشر الآن</button>
      </form>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div id="createRoomModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl relative animate-fade-in">
      <button onclick="document.getElementById('createRoomModal').classList.add('hidden')" class="absolute top-4 left-4 w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-brand-100 text-brand-500 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl"><i class="fa-solid fa-comments"></i></div>
        <h2 class="text-2xl font-black text-gray-900">إنشاء غرفة جديدة</h2>
      </div>
      <form id="createRoomForm" class="space-y-4">
        <div><label class="block text-sm font-bold mb-1">اسم الغرفة</label><input type="text" id="roomName" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 outline-none focus:border-brand-500" placeholder="مثال: مجموعة الرياضيات"></div>
        <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition">إنشاء</button>
      </form>
    </div>
  </div>

  <!-- Comments Modal -->
  <div id="commentsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl relative animate-fade-in flex flex-col max-h-[80vh]">
      <button onclick="document.getElementById('commentsModal').classList.add('hidden')" class="absolute top-4 left-4 w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
      <h2 class="text-xl font-black text-gray-900 mb-4 text-center mt-2">التعليقات</h2>
      <div id="commentsList" class="flex-1 overflow-y-auto mb-4 space-y-3 pr-2"></div>
      <form id="commentForm" class="flex gap-2 border-t border-gray-100 pt-3">
        <input type="text" id="commentInput" required class="flex-1 bg-gray-100 border border-transparent rounded-xl px-4 py-2 text-sm outline-none focus:border-brand-500" placeholder="اكتب تعليقاً...">
        <button type="submit" class="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-xl font-bold text-sm transition">نشر</button>
      </form>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl relative animate-fade-in">
      <button onclick="document.getElementById('authModal').classList.add('hidden')" class="absolute top-4 left-4 w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
      
      <div id="loginForm">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-brand-100 text-brand-500 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl"><i class="fa-solid fa-user-lock"></i></div>
          <h2 class="text-2xl font-black text-gray-900">تسجيل الدخول</h2>
        </div>
        <form id="loginFormElement" class="space-y-4">
          <div><label class="block text-sm font-bold mb-1">البريد الإلكتروني</label><input type="email" id="loginEmail" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50" dir="ltr"></div>
          <div><label class="block text-sm font-bold mb-1">كلمة المرور</label><input type="password" id="loginPassword" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50" dir="ltr"></div>
          <div class="text-left"><button type="button" onclick="showResetPassword()" class="text-sm font-bold text-brand-500 hover:underline">نسيت كلمة المرور؟</button></div>
          <p id="loginError" class="text-red-500 text-sm font-bold text-center hidden"></p>
          <button type="submit" class="w-full bg-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg">دخول</button>
        </form>
        <div class="text-center mt-6 text-sm"><span class="text-gray-500">ليس لديك حساب؟</span><button onclick="showRegister()" class="text-brand-500 font-bold hover:underline mr-1">إنشاء حساب</button></div>
      </div>

      <div id="registerForm" class="hidden">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-brand-100 text-brand-500 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl"><i class="fa-solid fa-user-plus"></i></div>
          <h2 class="text-2xl font-black text-gray-900">إنشاء حساب</h2>
        </div>
        <form id="registerFormElement" class="space-y-4">
          <div><label class="block text-sm font-bold mb-1">الاسم واللقب</label><input type="text" id="regName" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50"></div>
          <div><label class="block text-sm font-bold mb-1">البريد الإلكتروني</label><input type="email" id="regEmail" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50" dir="ltr"></div>
          <div><label class="block text-sm font-bold mb-1">كلمة المرور</label><input type="password" id="regPassword" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50" dir="ltr"></div>
          <p id="registerError" class="text-red-500 text-sm font-bold text-center hidden"></p>
          <button type="submit" class="w-full bg-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg">تسجيل</button>
        </form>
        <div class="text-center mt-6 text-sm"><span class="text-gray-500">لديك حساب؟</span><button onclick="showLogin()" class="text-brand-500 font-bold hover:underline mr-1">تسجيل الدخول</button></div>
      </div>

      <div id="resetPasswordForm" class="hidden">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-orange-100 text-brand-500 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl"><i class="fa-solid fa-key"></i></div>
          <h2 class="text-2xl font-black text-gray-900">استعادة الحساب</h2>
        </div>
        <form id="resetFormElement" class="space-y-4">
          <div><label class="block text-sm font-bold mb-1">البريد الإلكتروني</label><input type="email" id="resetEmail" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50" dir="ltr"></div>
          <p id="resetError" class="text-red-500 text-sm font-bold text-center hidden"></p>
          <p id="resetSuccess" class="text-green-600 text-sm font-bold text-center hidden"></p>
          <button type="submit" class="w-full bg-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg">إرسال رابط الاستعادة</button>
        </form>
        <div class="text-center mt-6 text-sm"><button onclick="showLogin()" class="text-gray-500 font-bold hover:text-brand-500 hover:underline">العودة لتسجيل الدخول</button></div>
      </div>
    </div>
  </div>

  <!-- ================= SCRIPTS ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, increment, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvRORhsSl05y-8pu4fERx3gpSYT_XIwrk",
      authDomain: "enstp-forum-c5a28.firebaseapp.com",
      projectId: "enstp-forum-c5a28",
      storageBucket: "enstp-forum-c5a28.firebasestorage.app",
      messagingSenderId: "129732313908",
      appId: "1:129732313908:web:c06215b2fde653b76c9b61"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const authModal = document.getElementById('authModal');

    // ===== Auth UI =====
    window.closeAuthModal = () => authModal.classList.add('hidden');
    window.showLogin = () => { document.getElementById('loginForm').classList.remove('hidden'); document.getElementById('registerForm').classList.add('hidden'); document.getElementById('resetPasswordForm').classList.add('hidden'); };
    window.showRegister = () => { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.remove('hidden'); document.getElementById('resetPasswordForm').classList.add('hidden'); };
    window.showResetPassword = () => { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.add('hidden'); document.getElementById('resetPasswordForm').classList.remove('hidden'); };

    // Login
    document.getElementById('loginFormElement').addEventListener('submit', async (e) => {
      e.preventDefault();
      try { await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); closeAuthModal(); } 
      catch (error) { const err = document.getElementById('loginError'); err.innerText = error.message; err.classList.remove('hidden'); }
    });

    // Register
    document.getElementById('registerFormElement').addEventListener('submit', async (e) => {
      e.preventDefault();
      try { 
        const u = await createUserWithEmailAndPassword(auth, document.getElementById('regEmail').value, document.getElementById('regPassword').value); 
        await updateProfile(u.user, { displayName: document.getElementById('regName').value }); 
        // Save user to DB for private chat list
        await addDoc(collection(db, "users"), { uid: u.user.uid, name: document.getElementById('regName').value, email: document.getElementById('regEmail').value });
        closeAuthModal(); 
      } 
      catch (error) { const err = document.getElementById('registerError'); err.innerText = error.message; err.classList.remove('hidden'); }
    });

    // Reset Password
    document.getElementById('resetFormElement').addEventListener('submit', async (e) => {
      e.preventDefault();
      try { await sendPasswordResetEmail(auth, document.getElementById('resetEmail').value); document.getElementById('resetSuccess').innerText = "تم الإرسال!"; document.getElementById('resetSuccess').classList.remove('hidden'); } 
      catch (error) { const err = document.getElementById('resetError'); err.innerText = error.message; err.classList.remove('hidden'); }
    });

    // Auth State
    let currentUser = null;
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const headerArea = document.getElementById('headerAuthArea');
      if (user) {
        headerArea.innerHTML = `<div class="flex items-center gap-3"><div class="text-left hidden md:block"><p class="text-sm font-bold text-gray-900">${user.displayName || 'طالب'}</p></div><div class="w-10 h-10 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center font-bold text-lg">${(user.displayName || 'U').charAt(0).toUpperCase()}</div><button onclick="signOut(auth)" class="text-gray-400 hover:text-red-500 p-2"><i class="fa-solid fa-power-off"></i></button></div>`;
        loadPrivateUsers();
      } else {
        headerArea.innerHTML = `<button id="loginBtn" onclick="document.getElementById('authModal').classList.remove('hidden')" class="bg-brand-500 text-white px-5 py-2 rounded-xl font-bold text-sm">تسجيل الدخول</button>`;
        document.getElementById('chatListContainer').innerHTML = '<div class="p-4 text-center text-gray-400 text-sm">سجل الدخول لرؤية الدردشات</div>';
      }
    });

    // ===== Posts System =====
    const postsGrid = document.getElementById('postsGrid');
    const qPosts = query(collection(db, "forum_posts"), orderBy("createdAt", "desc"));
    onSnapshot(qPosts, (snapshot) => {
      postsGrid.innerHTML = '';
      document.getElementById('noPostsMessage').classList.add('hidden');
      if(snapshot.empty) { document.getElementById('noPostsMessage').classList.remove('hidden'); return; }

      snapshot.forEach((docSnap) => {
        const post = docSnap.data();
        const postId = docSnap.id;
        const dateStr = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleDateString('ar-DZ') : 'الآن';
        
        const card = document.createElement('div');
        card.className = 'post-card bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex flex-col justify-between animate-fade-in';
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-3">
              <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center font-bold">${(post.authorName || 'U').charAt(0).toUpperCase()}</div>
                <div><h3 class="font-bold text-sm text-gray-900">${post.authorName || 'طالب'}</h3><p class="text-[10px] text-gray-400">${dateStr}</p></div>
              </div>
            </div>
            <h2 class="font-black text-lg text-gray-900 mb-2 leading-tight text-center">${post.title}</h2>
            <p class="text-sm text-gray-600 text-center mb-4 leading-relaxed">${post.content}</p>
          </div>
          <div class="flex justify-between items-center pt-3 border-t border-gray-50 mt-auto">
            <div class="flex gap-4 text-gray-500">
              <button onclick="likePost('${postId}')" class="hover:text-red-500 flex items-center gap-1 text-sm font-bold"><i class="fa-solid fa-heart text-red-500"></i> ${post.likes || 0}</button>
              <button onclick="openComments('${postId}')" class="hover:text-brand-500 flex items-center gap-1 text-sm font-bold"><i class="fa-regular fa-comment"></i> ${post.commentCount || 0}</button>
            </div>
          </div>
        `;
        postsGrid.appendChild(card);
      });
    });

    // Create Post
    document.getElementById('createPostForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if(!currentUser) { alert("سجل الدخول أولاً"); return; }
      try {
        await addDoc(collection(db, "forum_posts"), {
          title: document.getElementById('postTitle').value,
          content: document.getElementById('postContent').value,
          authorName: currentUser.displayName,
          authorId: currentUser.uid,
          likes: 0, commentCount: 0,
          createdAt: serverTimestamp()
        });
        document.getElementById('createPostForm').reset();
        document.getElementById('createPostModal').classList.add('hidden');
      } catch (error) { alert("خطأ: " + error.message); }
    });

    window.likePost = async (postId) => {
      if(!currentUser) { alert("سجل الدخول أولاً"); return; }
      await updateDoc(doc(db, "forum_posts", postId), { likes: increment(1) });
    };

    // Comments System
    let currentPostId = null;
    window.openComments = (postId) => {
      currentPostId = postId;
      document.getElementById('commentsModal').classList.remove('hidden');
      loadComments();
    };

    async function loadComments() {
      const list = document.getElementById('commentsList');
      list.innerHTML = '<p class="text-center text-sm text-gray-400">جاري التحميل...</p>';
      const q = query(collection(db, "forum_posts", currentPostId, "comments"), orderBy("createdAt", "asc"));
      onSnapshot(q, (snap) => {
        list.innerHTML = '';
        if(snap.empty) { list.innerHTML = '<p class="text-center text-sm text-gray-400">لا توجد تعليقات</p>'; return; }
        snap.forEach((doc) => {
          const c = doc.data();
          list.innerHTML += `
            <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
              <div class="flex justify-between mb-1"><span class="text-xs font-bold text-brand-600">${c.authorName}</span></div>
              <p class="text-sm text-gray-700">${c.text}</p>
            </div>
          `;
        });
      });
    }

    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if(!currentUser || !currentPostId) return;
      const text = document.getElementById('commentInput').value;
      await addDoc(collection(db, "forum_posts", currentPostId, "comments"), {
        text: text, authorName: currentUser.displayName, authorId: currentUser.uid, createdAt: serverTimestamp()
      });
      await updateDoc(doc(db, "forum_posts", currentPostId), { commentCount: increment(1) });
      document.getElementById('commentInput').value = '';
    });

    // ===== Chat System (General, Groups, Private) =====
    const chatListContainer = document.getElementById('chatListContainer');
    const activeChatArea = document.getElementById('activeChatArea');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatForm = document.getElementById('chatForm');
    const activeChatName = document.getElementById('activeChatName');
    const chatSidebarTitle = document.getElementById('chatSidebarTitle');
    const backToChatListBtn = document.getElementById('backToChatListBtn');

    let currentRoomId = null;
    let unsubMessages = null;

    window.closeChatArea = () => {
      activeChatArea.classList.add('hidden', 'translate-x-full');
      activeChatArea.classList.remove('translate-x-0');
      chatListContainer.classList.remove('hidden');
      chatSidebarTitle.classList.remove('hidden');
      backToChatListBtn.classList.add('hidden');
      currentRoomId = null;
      if(unsubMessages) unsubMessages();
    };

    function joinRoom(roomId, roomName) {
      currentRoomId = roomId;
      activeChatName.innerText = roomName;
      
      chatListContainer.classList.add('hidden');
      chatSidebarTitle.classList.add('hidden');
      backToChatListBtn.classList.remove('hidden');
      
      activeChatArea.classList.remove('hidden');
      setTimeout(() => activeChatArea.classList.remove('translate-x-full'), 10);
      
      loadMessages(roomId);
    }

    function loadMessages(roomId) {
      if(unsubMessages) unsubMessages();
      chatMessages.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">جاري التحميل...</p>';
      
      const qMsgs = query(collection(db, "forum_chats", roomId, "messages"), orderBy("createdAt", "asc"));
      unsubMessages = onSnapshot(qMsgs, (snap) => {
        chatMessages.innerHTML = '';
        if(snap.empty) { chatMessages.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">لا توجد رسائل بعد.</p>'; return; }
        snap.forEach((msgDoc) => {
          const msg = msgDoc.data();
          const isMe = currentUser && msg.senderId === currentUser.uid;
          const div = document.createElement('div');
          div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
          div.innerHTML = `
            <div class="max-w-[80%] px-3 py-2 text-sm ${isMe ? 'chat-bubble-me' : 'chat-bubble-other'}">
              ${!isMe ? `<p class="text-[10px] font-bold text-brand-600 mb-1">${msg.senderName}</p>` : ''}
              <p>${msg.text}</p>
            </div>
          `;
          chatMessages.appendChild(div);
        });
        chatMessages.scrollTop = chatMessages.scrollHeight;
      });
    }

    // Send Message
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if(!currentRoomId || !currentUser) return;
      const text = chatInput.value.trim();
      if(!text) return;
      chatInput.value = '';
      await addDoc(collection(db, "forum_chats", currentRoomId, "messages"), {
        text: text, senderId: currentUser.uid, senderName: currentUser.displayName, createdAt: serverTimestamp()
      });
    });

    // Create Group Room
    document.getElementById('createRoomForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if(!currentUser) { alert("سجل الدخول أولاً"); return; }
      const name = document.getElementById('roomName').value;
      const newRoom = await addDoc(collection(db, "forum_chats"), { name: name, type: "group", createdAt: serverTimestamp() });
      document.getElementById('createRoomForm').reset();
      document.getElementById('createRoomModal').classList.add('hidden');
      joinRoom(newRoom.id, name);
    });

    // Load Rooms & Users List
    function loadPrivateUsers() {
      // General Room
      chatListContainer.innerHTML = `
        <div class="chat-item p-3 flex gap-3 border-b border-gray-50 hover:bg-gray-50 transition" onclick="joinRoom('general_room', 'القاعة العامة')">
          <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg shrink-0"><i class="fa-solid fa-globe"></i></div>
          <div class="flex-1 min-w-0"><div class="flex justify-between items-center mb-1"><h3 class="font-bold text-sm text-gray-900 truncate">القاعة العامة</h3></div><p class="text-xs text-gray-500 truncate">دردشة عامة لجميع الطلبة</p></div>
        </div>
        <div class="p-2 text-xs font-bold text-gray-400 mt-2 mb-1">غرف المجموعات</div>
        <div id="groupsList"></div>
        <div class="p-2 text-xs font-bold text-gray-400 mt-2 mb-1">دردشات خاصة</div>
        <div id="privateList"></div>
      `;

      // Load Groups
      const qGroups = query(collection(db, "forum_chats"), orderBy("createdAt", "desc"));
      onSnapshot(qGroups, (snap) => {
        const gList = document.getElementById('groupsList');
        gList.innerHTML = '';
        snap.forEach((doc) => {
          const room = doc.data();
          if(room.type === 'group') {
            gList.innerHTML += `
              <div class="chat-item p-3 flex gap-3 border-b border-gray-50 hover:bg-gray-50 transition" onclick="joinRoom('${doc.id}', '${room.name}')">
                <div class="w-10 h-10 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center font-bold shrink-0"><i class="fa-solid fa-users"></i></div>
                <div class="flex-1 min-w-0"><h3 class="font-bold text-sm text-gray-900 truncate">${room.name}</h3></div>
              </div>
            `;
          }
        });
      });

      // Load Users for Private Chat
      const qUsers = query(collection(db, "users"));
      onSnapshot(qUsers, (snap) => {
        const pList = document.getElementById('privateList');
        pList.innerHTML = '';
        snap.forEach((doc) => {
          const u = doc.data();
          if(u.uid !== currentUser.uid) { // Don't show myself
            pList.innerHTML += `
              <div class="chat-item p-3 flex gap-3 border-b border-gray-50 hover:bg-gray-50 transition" onclick="startPrivateChat('${u.uid}', '${u.name}')">
                <div class="w-10 h-10 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center font-bold shrink-0">${u.name.charAt(0).toUpperCase()}</div>
                <div class="flex-1 min-w-0"><h3 class="font-bold text-sm text-gray-900 truncate">${u.name}</h3></div>
              </div>
            `;
          }
        });
      });
    }

    // Start Private Chat
    window.startPrivateChat = async (otherUserId, otherUserName) => {
      if(!currentUser) return;
      // Create a consistent ID for the private room (sorted so it's the same for both users)
      const roomId = [currentUser.uid, otherUserId].sort().join('_');
      
      // Check if room exists in DB, if not create it
      const roomRef = doc(db, "forum_chats", roomId);
      // (Using addDoc with specific ID by setting it is not supported directly via addDoc, 
      // so we use setDoc if we want fixed ID, but for simplicity we just join it).
      
      joinRoom(roomId, `دردشة خاصة: ${otherUserName}`);
    };

  </script>
</body>
</html>
