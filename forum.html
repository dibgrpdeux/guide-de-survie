<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منتدى الطلبة - ENSTP Survival Guide</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Cairo', sans-serif; }
    .dir-ltr { direction: ltr; display: inline-block; }
    /* شاشة تحميل مبدئية لمنع ظهور الصفحة قبل التحقق من الحساب */
    #loadingOverlay { position: fixed; inset: 0; background: #f8fafc; z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 1rem; }
    .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-100 font-sans">

  <!-- شاشة التحميل (تظهر لثواني ثم تختفي) -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p class="text-gray-600 font-bold">جاري التحقق من الجلسة...</p>
  </div>

  <!-- شاشة تسجيل الدخول -->
  <div id="authOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-80 flex items-center justify-center z-50 hidden backdrop-blur-sm p-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="text-2xl font-bold mb-2 text-gray-800">المنتدى الطلابي ENSTP</h2>
      <p class="text-gray-600 mb-6 text-sm leading-relaxed">
        الدخول مخصص حصرياً لطلبة المدرسة عبر البريد الإلكتروني الرسمي 
        <span class="font-bold text-blue-600 dir-ltr">@enstp.edu.dz</span>
      </p>
      
      <button id="googleLoginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition shadow-lg shadow-blue-200">
        <svg class="w-5 h-5 fill-current bg-white rounded-full p-0.5" viewBox="0 0 24 24"><path d="M12.24 10.285V13.4h6.887C18.2 16.14 15.65 18 12.24 18c-3.315 0-6-2.685-6-6s2.685-6 6-6c1.47 0 2.81.53 3.84 1.41l2.55-2.55C17.06 3.42 14.82 2.5 12.24 2.5 7.005 2.5 2.75 6.755 2.75 12S7.005 21.5 12.24 21.5c5.485 0 9.155-3.86 9.155-9.315 0-.63-.06-1.23-.17-1.9H12.24z"/></svg>
        تسجيل الدخول عبر Google
      </button>

      <p id="authError" class="text-red-500 text-xs mt-4 font-bold bg-red-50 p-2 rounded-lg hidden">
        <i class="fa-solid fa-circle-exclamation mr-1"></i>
        عذراً، يجب استخدام بريد ينتهي بـ <span class="dir-ltr">@enstp.edu.dz</span>
      </p>
    </div>
  </div>

  <!-- الواجهة الرئيسية للمنتدى -->
  <div id="forumMain" class="flex h-screen overflow-hidden hidden">

    <!-- القائمة الجانبية (الغرف) -->
    <aside class="w-72 bg-gray-900 text-white flex flex-col justify-between border-l border-gray-800 shrink-0">
      <div class="p-4 overflow-y-auto custom-scrollbar">
        <h1 class="text-xl font-bold border-b border-gray-700 pb-3 mb-4 flex items-center gap-2 text-blue-400">
          <i class="fa-solid fa-comments"></i> منتديات ENSTP
        </h1>

        <!-- غرف عامة -->
        <div class="mb-6">
          <p class="text-xs text-gray-500 font-bold mb-2 px-2 uppercase tracking-wider">القنوات العامة</p>
          <button onclick="selectChannel('general', 'الغرفة العامة')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-3 text-gray-200 transition-colors bg-gray-800">
            <i class="fa-solid fa-bullhorn text-blue-400"></i> الغرفة العامة
          </button>
        </div>

        <!-- غرف الأفواج والأقسام -->
        <div class="mb-6">
          <p class="text-xs text-gray-500 font-bold mb-2 px-2 uppercase tracking-wider">غرف الأفواج</p>
          <div class="space-y-1">
            <button onclick="selectChannel('1cp_g6', '1CP - Groupe 06')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-3 text-gray-400 transition-colors">
              <i class="fa-solid fa-graduation-cap text-emerald-400"></i> 1CP - Groupe 06
            </button>
            <button onclick="selectChannel('1cp_g7', '1CP - Groupe 07')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-3 text-gray-400 transition-colors">
              <i class="fa-solid fa-graduation-cap text-emerald-400"></i> 1CP - Groupe 07
            </button>
            <button onclick="selectChannel('2cp_g2', '2CP - Groupe 02')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-3 text-gray-400 transition-colors">
              <i class="fa-solid fa-graduation-cap text-emerald-400"></i> 2CP - Groupe 02
            </button>
            <button onclick="selectChannel('dib_1_g1', '1st DIB - Groupe 01')" class="channel-btn w-full text-right p-2.5 rounded-lg hover:bg-gray-800 flex items-center gap-3 text-gray-400 transition-colors">
              <i class="fa-solid fa-helmet-safety text-amber-400"></i> 1st DIB - Groupe 01
            </button>
          </div>
        </div>
      </div>

      <!-- معلومات حساب الطالب الحالي -->
      <div class="p-4 border-t border-gray-800 bg-gray-950 flex items-center justify-between">
        <div class="flex items-center gap-3 overflow-hidden">
          <img id="userAvatar" src="" class="w-9 h-9 rounded-full bg-gray-700 shrink-0" alt="Avatar">
          <div class="overflow-hidden">
            <p id="userName" class="text-sm font-bold truncate">طالب</p>
            <p id="userEmail" class="text-[10px] text-gray-500 dir-ltr truncate">student@enstp.edu.dz</p>
          </div>
        </div>
        <button id="logoutBtn" title="تسجيل الخروج" class="text-gray-500 hover:text-red-500 transition text-lg">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- المنطقة المركزية للمنشورات -->
    <main class="flex-1 flex flex-col bg-gray-50 relative">
      
      <!-- ترويسة الغرفة -->
      <header class="bg-white p-4 shadow-sm border-b border-gray-200 flex justify-between items-center z-10">
        <h2 id="currentChannelTitle" class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-hashtag text-gray-400"></i> الغرفة العامة
        </h2>
        <span class="text-[10px] bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold flex items-center gap-1">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> متصل الآن
        </span>
      </header>

      <!-- قائمة المنشورات -->
      <div id="postsFeed" class="flex-1 overflow-y-auto p-6 space-y-4 pb-24">
        <!-- سيتم إدراج المنشورات تلقائياً عبر JS -->
      </div>

      <!-- صندوق كتابة منشور جديد -->
      <div class="absolute bottom-0 left-0 right-0 bg-white p-4 border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="flex gap-3 items-end max-w-4xl mx-auto">
          <textarea id="postContent" rows="1" placeholder="اكتب مشاركتك هنا..." class="w-full p-3 bg-gray-100 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none resize-none transition-all custom-scrollbar"></textarea>
          <button id="submitPostBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-5 rounded-xl transition flex items-center justify-center shrink-0 shadow-md shadow-blue-200">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>

    </main>
  </div>

  <!-- ربط خوادم Firebase والسكربت الخاص بالتطبيق -->
  <script type="module" src="forum.js"></script>
</body>
</html>
