<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page_title">رموز QR للأفواج - ENSTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; transition: background-color 0.4s, color 0.4s; }
    html.dark body { background: #0f172a; color: #f8fafc; }
    
    .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: all 0.3s ease; }
    html.dark .glass-card { background: #1e293b; border-color: #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    
    .glass-nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; }
    html.dark .glass-nav { background: #0f172a; border-bottom-color: #334155; }

    .lang-btn { background: transparent; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: #64748b; transition: 0.2s; }
    .lang-btn:hover { background: #ffedd5; color: #9a3412; }
    .lang-btn.active { background: #f97316; color: white; }

    .filter-btn { transition: all 0.3s ease; }
    .filter-btn.active { background: linear-gradient(135deg, #f97316, #ea580c); color: white; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); border-color: transparent; }

    .qr-card { background: white; border-radius: 20px; padding: 1.25rem; text-align: center; border: 2px solid #ffedd5; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
    html.dark .qr-card { background: #1e293b; border-color: #334155; }
    .qr-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px -12px rgba(249, 115, 22, 0.3); border-color: #fb923c; }

    .qr-image { width: 100%; aspect-ratio: 1; border-radius: 12px; background: white; padding: 8px; object-fit: contain; }
    html.dark .qr-image { background: #f8fafc; }

    .qr-label { margin-top: 0.75rem; font-weight: 800; color: #7c2d12; font-size: 0.95rem; }
    html.dark .qr-label { color: #fdba74; }
    .qr-sub { font-size: 0.7rem; color: #64748b; margin-top: 0.25rem; }
    html.dark .qr-sub { color: #94a3b8; }

    .download-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 700; color: #ea580c; margin-top: 0.5rem; cursor: pointer; text-decoration: none; }
    .download-btn:hover { text-decoration: underline; }

    #chatWindow { position: fixed; bottom: 110px; right: 20px; z-index: 1001; width: 320px; max-height: 420px; background: white; border-radius: 1rem; box-shadow: 0 20px 50px rgba(0,0,0,0.25); border: 1px solid #fed7aa; display: none; flex-direction: column; }
    #chatWindow.open { display: flex; }
    html.dark #chatWindow { background: #1e293b; border-color: #334155; color: #f8fafc; }
    @media (max-width: 640px) { #chatWindow { width: calc(100vw - 2rem); right: 1rem; left: 1rem; } }

    @keyframes kangarooJump { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-20px) scale(1.1) rotate(-8deg); } 60% { transform: translateY(-10px) scale(1) rotate(5deg); } }

    button, a, .glass-card, .qr-card { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

    @media print {
      header, footer, #kangarooContainer, #chatWindow, .filter-bar, .print-hide { display: none !important; }
      body { background: white !important; }
      .qr-card { break-inside: avoid; border: 1px solid #ddd; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="sticky top-0 z-50 glass-nav px-4 lg:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-500 flex items-center justify-center text-white font-black text-lg shadow-md"><i class="fa-solid fa-qrcode"></i></div>
        <div>
          <h1 class="font-bold text-gray-900 dark:text-white text-base leading-tight" data-i18n="qr_title">رموز QR للأفواج</h1>
          <p class="text-[11px] text-gray-500 dark:text-gray-400" data-i18n="qr_subtitle">كل فوج له رمزه الخاص</p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <div class="flex items-center gap-1 bg-gray-100 dark:bg-slate-800 p-1 rounded-xl border border-gray-200 dark:border-slate-700">
          <button onclick="setLanguage('ar')" id="btn-ar" class="lang-btn active">🇩🇿 عربي</button>
          <button onclick="setLanguage('fr')" id="btn-fr" class="lang-btn">🇫🇷 FR</button>
          <button onclick="setLanguage('en')" id="btn-en" class="lang-btn">🇬🇧 EN</button>
        </div>
        <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-600 dark:text-gray-300 flex items-center justify-center shadow-sm hover:bg-orange-50 dark:hover:bg-slate-700 transition">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:block text-orange-400"></i>
        </button>
        <button onclick="window.print()" class="print-hide px-3 py-2 rounded-xl bg-orange-100 dark:bg-slate-800 text-orange-700 dark:text-orange-400 hover:bg-orange-200 text-xs font-bold transition flex items-center gap-1" data-i18n="qr_print">
          <i class="fa-solid fa-print"></i> <span>طباعة</span>
        </button>
        <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 text-xs font-bold transition" data-i18n="nav_home">الرئيسية</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 lg:px-8 py-10 flex-grow w-full space-y-8">

    <div class="text-center mb-8">
      <h2 class="text-3xl font-black text-gray-900 dark:text-white" data-i18n="qr_title">رموز QR للأفواج</h2>
      <p class="text-gray-600 dark:text-gray-400 mt-2" data-i18n="qr_desc">اختر القسم لعرض رموز QR لكل فوج. يمكنك طباعة كل الرموز أو تنزيلها.</p>
    </div>

    <div id="filtersBar" class="filter-bar flex flex-wrap gap-2 justify-center sticky top-[60px] z-40 glass-card p-2 rounded-2xl shadow-sm border border-orange-100 dark:border-slate-700">
      <button onclick="setSection('1cp')" id="filter-1cp" class="filter-btn active px-4 py-2 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">1CP</button>
      <button onclick="setSection('2cp')" id="filter-2cp" class="filter-btn px-4 py-2 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">2CP</button>
      <button onclick="setSection('dib1')" id="filter-dib1" class="filter-btn px-4 py-2 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">DIB 1</button>
      <button onclick="setSection('dib2')" id="filter-dib2" class="filter-btn px-4 py-2 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">DIB 2</button>
      <button onclick="setSection('dib3')" id="filter-dib3" class="filter-btn px-4 py-2 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">DIB 3</button>
      <button onclick="setSection('dms1')" id="filter-dms1" class="filter-btn px-4 py-2 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">DMS 1</button>
      <button onclick="setSection('dms2')" id="filter-dms2" class="filter-btn px-4 py-2 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">DMS 2</button>
      <button onclick="setSection('dms3')" id="filter-dms3" class="filter-btn px-4 py-2 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">DMS 3</button>
    </div>

    <div id="qrGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
  </main>
          <footer class="glass-nav border-t border-gray-200 dark:border-slate-800 py-6 px-4 text-center text-xs text-gray-500 dark:text-gray-400">
    <p>© 2026 ENSTP Kouba.</p>
  </footer>

  <div id="kangarooContainer" style="position:fixed;bottom:20px;right:20px;z-index:1000;cursor:pointer;user-select:none;">

      <line x1="25" y1="41" x2="28" y2="44" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="chatWindow" class="hidden">
    <div style="background: linear-gradient(135deg, #f97316, #f59e0b); color: white; padding: 12px 16px; border-radius: 1rem 1rem 0 0; font-weight: 700; display: flex; justify-content: space-between; align-items: center;">
      <span style="display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-comments"></i><span data-i18n="chat_title">المساعد الافتراضي</span></span>
      <button onclick="toggleChat()" style="background: rgba(255,255,255,0.2); border: none; color: white; width: 28px; height: 28px; border-radius: 8px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="chatBody" style="padding: 12px; overflow-y: auto; height: 300px; font-size: 14px; display: flex; flex-direction: column; gap: 8px;">
      <div style="background: #ffedd5; padding: 8px 12px; border-radius: 12px; color: #7c2d12;" data-i18n="chat_welcome">مرحباً! 👋 كيف يمكنني مساعدتك؟</div>
    </div>
    <div style="padding: 8px; border-top: 1px solid #fed7aa; display: flex; gap: 4px;">
      <input type="text" id="chatInput" data-i18n-placeholder="chat_placeholder" placeholder="اكتب سؤالك..." style="flex: 1; padding: 8px 12px; border: 1px solid #fed7aa; border-radius: 8px; font-size: 13px; outline: none; font-family: inherit;">
      <button onclick="sendMessage()" style="background: #f97316; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer;"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    let currentLang = localStorage.getItem('enstp_lang') || 'ar';
    let currentSection = '1cp';

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    function t(key) {
      const dict = window.QR_TRANSLATIONS[currentLang] || window.QR_TRANSLATIONS.ar;
      return dict[key] || key;
    }

    window.QR_TRANSLATIONS = {
      ar: {
        page_title: "رموز QR للأفواج - ENSTP", nav_home: "الرئيسية",
        qr_title: "رموز QR للأفواج",
        qr_subtitle: "كل فوج له رمزه الخاص",
        qr_desc: "اختر القسم لعرض رموز QR لكل فوج. يمكنك طباعة كل الرموز أو تنزيلها.",
        qr_print: "طباعة",
        qr_download: "تنزيل",
        group_prefix: "الفوج",
        section_1cp: "السنة الأولى تحضيري",
        section_2cp: "السنة الثانية تحضيري",
        section_dib1: "DIB - السنة الأولى مهندس",
        section_dib2: "DIB - السنة الثانية مهندس",
        section_dib3: "DIB - السنة الثالثة مهندس",
        section_dms1: "DMS - السنة الأولى مهندس",
        section_dms2: "DMS - السنة الثانية مهندس",
        section_dms3: "DMS - السنة الثالثة مهندس",
        chat_title: "المساعد الافتراضي", chat_welcome: "مرحباً! 👋 كيف يمكنني مساعدتك؟",
        chat_placeholder: "اكتب سؤالك...", chat_default: "شكراً!",
        chat_hello: "أهلاً!", chat_thanks: "على الرحب والسعة!",
        chat_qr: "هذه الصفحة تعرض رموز QR لكل فوج. اختر القسم لعرض الرموز."
      },
      fr: {
        page_title: "QR Codes des Classes - ENSTP", nav_home: "Accueil",
        qr_title: "QR Codes des Classes",
        qr_subtitle: "Chaque groupe a son propre QR",
        qr_desc: "Choisissez la section pour afficher les QR codes de chaque groupe. Vous pouvez imprimer ou télécharger.",
        qr_print: "Imprimer",
        qr_download: "Télécharger",
        group_prefix: "Groupe",
        section_1cp: "1ère Année Préparatoire",
        section_2cp: "2ème Année Préparatoire",
        section_dib1: "DIB - 1ère Année Ingénieur",
        section_dib2: "DIB - 2ème Année Ingénieur",
        section_dib3: "DIB - 3ème Année Ingénieur",
        section_dms1: "DMS - 1ère Année Ingénieur",
        section_dms2: "DMS - 2ème Année Ingénieur",
        section_dms3: "DMS - 3ème Année Ingénieur",
        chat_title: "Assistant virtuel", chat_welcome: "Bonjour ! 👋 Comment puis-je vous aider ?",
        chat_placeholder: "Votre question...", chat_default: "Merci !",
        chat_hello: "Bienvenue !", chat_thanks: "Avec plaisir !",
        chat_qr: "Cette page affiche les QR codes de chaque groupe. Choisissez une section."
      },
      en: {
        page_title: "Class QR Codes - ENSTP", nav_home: "Home",
        qr_title: "Class QR Codes",
        qr_subtitle: "Each group has its own QR",
        qr_desc: "Choose a section to display QR codes for each group. You can print or download.",
        qr_print: "Print",
        qr_download: "Download",
        group_prefix: "Group",
        section_1cp: "1st Preparatory Year",
        section_2cp: "2nd Preparatory Year",
        section_dib1: "DIB - 1st Year Engineer",
        section_dib2: "DIB - 2nd Year Engineer",
        section_dib3: "DIB - 3rd Year Engineer",
        section_dms1: "DMS - 1st Year Engineer",
        section_dms2: "DMS - 2nd Year Engineer",
        section_dms3: "DMS - 3rd Year Engineer",
        chat_title: "Virtual Assistant", chat_welcome: "Hello! 👋 How can I help you?",
        chat_placeholder: "Your question...", chat_default: "Thanks!",
        chat_hello: "Welcome!", chat_thanks: "You're welcome!",
        chat_qr: "This page displays the QR codes for each group. Choose a section."
      }
    };

    // Structure des groupes
    const sectionsData = {
      '1cp': { groups: Array.from({length: 12}, (_, i) => `g${i+1}`), title: 'section_1cp' },
      '2cp': { groups: Array.from({length: 12}, (_, i) => `g${i+1}`), title: 'section_2cp' },
      'dib1': { groups: Array.from({length: 4}, (_, i) => `g${i+1}`), title: 'section_dib1' },
      'dib2': { groups: Array.from({length: 4}, (_, i) => `g${i+1}`), title: 'section_dib2' },
      'dib3': { groups: ['promo'], title: 'section_dib3' },
      'dms1': { groups: Array.from({length: 4}, (_, i) => `sec${i+1}`), title: 'section_dms1' },
      'dms2': { groups: Array.from({length: 2}, (_, i) => `sec${i+1}`), title: 'section_dms2' },
      'dms3': { groups: ['promo'], title: 'section_dms3' }
    };

    window.applyQrTranslation = function(lang) {
      const dict = window.QR_TRANSLATIONS[lang] || window.QR_TRANSLATIONS.ar;
      if (dict.page_title) document.title = dict.page_title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          const icon = el.querySelector('i');
          if (icon) { el.innerHTML = ''; el.appendChild(icon); el.appendChild(document.createTextNode(' ' + dict[key])); }
          else el.innerText = dict[key];
        }
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (dict[key]) el.placeholder = dict[key];
      });
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;
      if (typeof renderQRs === 'function') renderQRs();
    };

    window.setLanguage = function(lang) {
      currentLang = lang;
      localStorage.setItem('enstp_lang', lang);
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + lang);
      if (activeBtn) activeBtn.classList.add('active');
      window.applyQrTranslation(lang);
    };

    function setSection(section) {
      currentSection = section;
      ['1cp','2cp','dib1','dib2','dib3','dms1','dms2','dms3'].forEach(s => {
        const btn = document.getElementById('filter-' + s);
        if (s === section) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      renderQRs();
    }

    function renderQRs() {
      const grid = document.getElementById('qrGrid');
      grid.innerHTML = '';
      const section = sectionsData[currentSection];
      const sectionTitle = t(section.title);
      
      section.groups.forEach(group => {
        // Texte du QR : nom du groupe complet
        let groupName;
        if (group === 'promo') {
          groupName = `ENSTP - ${sectionTitle}`;
        } else if (group.startsWith('sec')) {
          groupName = `ENSTP - ${sectionTitle} - Section ${group.replace('sec', '')}`;
        } else {
          groupName = `ENSTP - ${sectionTitle} - ${t('group_prefix')} ${group.replace('g', '')}`;
        }
        
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(groupName)}&color=1e293b&bgcolor=ffffff&margin=10`;
        const displayLabel = group === 'promo' ? sectionTitle : `${t('group_prefix')} ${group.replace('g', '').replace('sec', '')}`;
        
        const card = document.createElement('div');
        card.className = 'qr-card';
        card.innerHTML = `
          <img src="${qrUrl}" alt="${groupName}" class="qr-image" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300/f1f5f9/94a3b8?text=QR'">
          <div class="qr-label">${displayLabel}</div>
          <div class="qr-sub">${sectionTitle}</div>
          <a href="${qrUrl}" download="QR-${currentSection}-${group}.png" target="_blank" class="download-btn">
            <i class="fa-solid fa-download"></i> ${t('qr_download')}
          </a>
        `;
        grid.appendChild(card);
      });
    }

    function toggleChat() {
      const chat = document.getElementById('chatWindow');
      if (!chat) return;
      chat.classList.toggle('hidden');
      chat.classList.toggle('open');
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const body = document.getElementById('chatBody');
      if (!input || !body) return;
      const msg = input.value.trim();
      if (!msg) return;
      body.innerHTML += `<div style="display:flex;justify-content:flex-end;"><div style="background:#f97316;color:white;padding:8px 12px;border-radius:12px 12px 4px 12px;max-width:80%;font-size:13px;">${msg}</div></div>`;
      input.value = '';
      body.scrollTop = body.scrollHeight;
      setTimeout(() => {
        let reply = t('chat_default');
        const m = msg.toLowerCase();
        if (m.includes("qr") || m.includes("فوج") || m.includes("groupe") || m.includes("class")) reply = "📱 " + t('chat_qr');
        else if (m.includes("سلام") || m.includes("مرحبا") || m.includes("hello") || m.includes("bonjour")) reply = "👋 " + t('chat_hello');
        else if (m.includes("شكرا") || m.includes("merci") || m.includes("thanks")) reply = "💛 " + t('chat_thanks');
        body.innerHTML += `<div style="display:flex;justify-content:flex-start;"><div style="background:#ffedd5;color:#7c2d12;padding:8px 12px;border-radius:12px 12px 12px 4px;max-width:80%;font-size:13px;">${reply}</div></div>`;
        body.scrollTop = body.scrollHeight;
      }, 500);
    }

    const kangarooContainer = document.getElementById('kangarooContainer');
    const kangarooSvg = document.getElementById('kangarooSvg');
    if (kangarooContainer) {
      kangarooContainer.addEventListener('click', () => {
        if (kangarooSvg) {
          kangarooSvg.style.animation = 'none';
          kangarooSvg.offsetHeight;
          kangarooSvg.style.animation = 'kangarooJump 0.6s ease';
          setTimeout(() => { kangarooSvg.style.animation = ''; }, 700);
        }
        toggleChat();
      });
      kangarooContainer.addEventListener('mouseenter', () => { if (kangarooSvg) kangarooSvg.style.transform = 'scale(1.1)'; });
      kangarooContainer.addEventListener('mouseleave', () => { if (kangarooSvg) kangarooSvg.style.transform = ''; });
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      const savedLang = localStorage.getItem('enstp_lang') || 'ar';
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + savedLang);
      if (activeBtn) activeBtn.classList.add('active');
      currentLang = savedLang;
      window.applyQrTranslation(savedLang);
      setSection('1cp');
      const chatInput = document.getElementById('chatInput');
      if (chatInput) {
        chatInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });
      }
    });
  </script>
</body>
</html>
