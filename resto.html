<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page_title">المطاعم والمقاهي - ENSTP</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary: #fbbf24;
      --primary-hover: #f59e0b;
      --orange: #f97316;
      --orange-dark: #ea580c;
      --bg-color: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: #ffffff;
      --nav-bg: rgba(255, 255, 255, 0.95);
      --border-color: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.1);
    }
    [data-theme="dark"] {
      --bg-color: #0a1128;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: #0f1e41;
      --nav-bg: rgba(10, 17, 40, 0.95);
      --border-color: #1e3a8a;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: background-color .4s, color .4s;
      margin: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-top: 90px;
    }

    /* ===== BLOBS (identique à index) ===== */
    .animated-bg { position: fixed; inset: 0; z-index: -3; overflow: hidden; background: var(--bg-color); transition: background .6s; }
    .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .35; animation: blobFloat 25s ease-in-out infinite; }
    .blob-1 { width: 500px; height: 500px; background: #f97316; top: -10%; left: -10%; }
    .blob-2 { width: 450px; height: 450px; background: #fbbf24; bottom: -10%; right: -10%; animation-delay: -8s; }
    .blob-3 { width: 350px; height: 350px; background: #ea580c; top: 50%; left: 40%; animation-delay: -15s; opacity: .25; }
    [data-theme="dark"] .blob-1 { background:#f97316; opacity:.2 }
    [data-theme="dark"] .blob-2 { background:#3b82f6; opacity:.15 }
    [data-theme="dark"] .blob-3 { background:#1e3a8a; opacity:.3 }
    @keyframes blobFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(60px,-40px) scale(1.1); }
      66% { transform: translate(-40px,60px) scale(.95); }
    }
    .dot { position: absolute; border-radius: 50%; background: #f97316; opacity: .15; animation: dotFloat 15s linear infinite; }
    [data-theme="dark"] .dot { background: #60a5fa; opacity: .25; }
    .dot-1 { width: 12px; height: 12px; top: 15%; left: 10%; }
    .dot-2 { width: 8px; height: 8px; top: 60%; left: 85%; animation-delay: -3s; }
    .dot-3 { width: 16px; height: 16px; top: 80%; left: 20%; animation-delay: -6s; }
    .dot-4 { width: 10px; height: 10px; top: 30%; left: 70%; animation-delay: -9s; }
    .dot-5 { width: 14px; height: 14px; top: 45%; left: 50%; animation-delay: -12s; }
    @keyframes dotFloat {
      0% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-30px) translateX(20px); }
      100% { transform: translateY(0) translateX(0); }
    }

    /* ===== NAVBAR (identique à index) ===== */
    .top-navbar {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      width: 96%; max-width: 1100px;
      background: var(--nav-bg);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1.5px solid var(--border-color);
      border-radius: 22px;
      padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; z-index: 1000; box-shadow: var(--shadow-md);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .nav-title { font-size: 1rem; font-weight: 900; color: var(--text-main); line-height: 1.1; }
    .nav-title span {
      background: linear-gradient(90deg,#f97316,#fbbf24,#f97316);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% center; } }
    .nav-subtitle { font-size: .65rem; color: var(--text-muted); font-weight: 600; margin-top: 1px; }
    .nav-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg,#f97316,#ea580c); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; box-shadow: 0 6px 18px rgba(249,115,22,.35);
      flex-shrink: 0;
    }
    .nav-menu-btn {
      width: 42px; height: 42px; border-radius: 14px;
      border: 1.5px solid var(--border-color); background: var(--card-bg);
      color: var(--text-main); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .25s; font-size: 1rem; flex-shrink: 0;
    }
    .nav-menu-btn:hover {
      background: var(--orange); color: #fff; border-color: var(--orange);
      transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249,115,22,.35);
    }
    .nav-menu-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    .nav-dropdown {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%) translateY(-10px);
      width: 290px; max-width: 92%; background: var(--nav-bg);
      backdrop-filter: blur(20px); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 8px; box-shadow: var(--shadow-md);
      z-index: 1001; opacity: 0; pointer-events: none;
      transition: all .25s cubic-bezier(.34,1.56,.64,1);
    }
    .nav-dropdown.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .dropdown-section { padding: 10px 8px; border-bottom: 1px solid var(--border-color); }
    .dropdown-section:last-child { border-bottom: none; }
    .dropdown-label {
      font-size: .65rem; font-weight: 800; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; padding: 0 4px;
    }
    .dropdown-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .dropdown-btn {
      padding: 8px 12px; border-radius: 10px;
      border: 1px solid var(--border-color); background: var(--card-bg);
      color: var(--text-main); font-family: inherit; font-size: .75rem; font-weight: 700;
      cursor: pointer; transition: all .2s; display: inline-flex; align-items: center;
      gap: 6px; flex: 1; justify-content: center; min-width: fit-content; text-decoration: none;
    }
    .dropdown-btn:hover {
      background: var(--primary); color: #000; border-color: var(--primary); transform: translateY(-1px);
    }
    .dropdown-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    /* ===== HERO ===== */
    .page-hero { max-width: 1100px; margin: 0 auto 24px; padding: 0 20px; text-align: center; }
    .page-hero h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 900;
      margin: 0 0 8px; line-height: 1.2;
    }
    .page-hero h1 span {
      background: linear-gradient(90deg,#fbbf24,#f97316,#fbbf24);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }
    .page-hero p { color: var(--text-muted); font-size: .95rem; font-weight: 600; margin: 0; }

    /* ===== CONTENT ===== */
    .content-wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

    /* Filter chips */
    .filters-bar {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
      margin-bottom: 20px;
    }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 20px; border-radius: 16px;
      background: var(--card-bg); border: 1.5px solid var(--border-color);
      color: var(--text-main); font-family: inherit; font-weight: 800; font-size: .88rem;
      cursor: pointer; transition: all .3s cubic-bezier(.34,1.56,.64,1);
      box-shadow: var(--shadow-sm);
    }
    .filter-chip i {
      font-size: 1rem; color: var(--orange); transition: all .2s;
    }
    .filter-chip:hover {
      transform: translateY(-3px); border-color: var(--orange);
      box-shadow: 0 10px 25px rgba(249,115,22,.2);
    }
    .filter-chip:hover i { transform: rotate(-8deg) scale(1.15); }
    .filter-chip.active {
      background: linear-gradient(135deg,#f97316,#ea580c);
      color: #fff; border-color: transparent;
      box-shadow: 0 12px 30px rgba(249,115,22,.4);
    }
    .filter-chip.active i { color: #fff; }

    /* Sort bar */
    .sort-bar {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 22px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
      box-shadow: var(--shadow-sm);
    }
    .sort-label {
      font-size: .85rem; font-weight: 800; color: var(--text-main);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .sort-label i { color: var(--orange); }
    .sort-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .sort-btn {
      padding: 8px 14px; border-radius: 10px;
      background: var(--card-bg); border: 1.5px solid var(--border-color);
      color: var(--text-muted); font-family: inherit; font-weight: 700; font-size: .78rem;
      cursor: pointer; transition: all .2s;
    }
    .sort-btn:hover {
      background: rgba(249,115,22,.08); color: var(--orange-dark); border-color: var(--orange);
    }
    .sort-btn.active {
      background: var(--orange); color: #fff; border-color: var(--orange);
      box-shadow: 0 6px 18px rgba(249,115,22,.35);
    }

    /* Items grid */
    #itemsGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .resto-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: all .35s cubic-bezier(.34,1.56,.64,1);
    }
    .resto-card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: var(--orange);
      box-shadow: 0 25px 50px -12px rgba(249,115,22,.25);
    }
    .resto-card-cover {
      width: 100%; height: 180px; overflow: hidden;
      background: linear-gradient(135deg, #fed7aa, #fbbf24);
      position: relative;
    }
    .resto-card-cover img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .5s ease;
    }
    .resto-card:hover .resto-card-cover img { transform: scale(1.08); }
    .resto-card-cover .no-img {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; color: rgba(249,115,22,.35);
    }
    .card-type-badge {
      position: absolute; top: 10px; right: 10px;
      padding: 4px 10px; border-radius: 8px; font-size: .68rem; font-weight: 900;
      display: inline-flex; align-items: center; gap: 4px;
      color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }
    .card-type-badge.resto { background: linear-gradient(135deg,#f97316,#ea580c); }
    .card-type-badge.cafe { background: linear-gradient(135deg,#f59e0b,#d97706); }

    .resto-card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .resto-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .resto-card-title {
      font-size: 1.05rem; font-weight: 900; color: var(--text-main);
      line-height: 1.25; transition: color .25s; margin: 0;
    }
    .resto-card:hover .resto-card-title { color: var(--orange); }
    .rating-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: linear-gradient(135deg,#fef3c7,#fde68a);
      color: #92400e; padding: 4px 9px; border-radius: 8px;
      font-size: .72rem; font-weight: 900; flex-shrink: 0;
    }
    [data-theme="dark"] .rating-badge { background: rgba(251,191,36,.2); color: #fcd34d; }
    .rating-badge i { font-size: .65rem; }

    .resto-meta-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .meta-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 9px; border-radius: 8px; font-size: .7rem; font-weight: 800;
      background: rgba(249,115,22,.08); color: var(--orange-dark);
    }
    [data-theme="dark"] .meta-chip { background: rgba(249,115,22,.15); color: #fdba74; }
    .meta-chip.green { background: rgba(16,185,129,.1); color: #047857; }
    [data-theme="dark"] .meta-chip.green { background: rgba(16,185,129,.15); color: #6ee7b7; }
    .meta-chip i { font-size: .65rem; }

    .resto-card-desc {
      font-size: .8rem; color: var(--text-muted); font-weight: 600;
      line-height: 1.55; margin: 0 0 12px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .resto-card-footer {
      margin-top: auto; padding-top: 12px;
      border-top: 1px dashed var(--border-color);
      display: flex; align-items: center; justify-content: center;
      gap: 6px; font-size: .78rem; font-weight: 800; color: var(--orange);
    }

    /* ===== MODAL ===== */
    #itemModal {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(15,23,42,.8); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    #itemModal.open { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--card-bg); border-radius: 24px;
      max-width: 800px; width: 100%; max-height: 92vh;
      overflow-y: auto; padding: 28px;
      box-shadow: 0 30px 80px -10px rgba(0,0,0,.5);
      position: relative;
      transform: scale(.95); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    }
    #itemModal.open .modal-card { transform: scale(1); }
    .modal-close {
      position: absolute; top: 16px; left: 16px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(249,115,22,.12); border: none;
      color: var(--orange); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: all .2s; z-index: 5;
    }
    .modal-close:hover { background: var(--orange); color: #fff; transform: rotate(90deg); }

    .modal-header {
      padding-bottom: 16px; margin-bottom: 20px;
      border-bottom: 1.5px solid var(--border-color);
      padding-left: 50px;
    }
    .modal-title {
      font-size: 1.5rem; font-weight: 900; color: var(--text-main); margin: 0 0 6px;
    }
    .modal-subtitle {
      font-size: .85rem; color: var(--orange-dark); font-weight: 800;
      display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    [data-theme="dark"] .modal-subtitle { color: #fdba74; }
    .modal-subtitle .rating-badge { font-size: .75rem; }

    .modal-section { margin-bottom: 20px; }
    .modal-section h4 {
      margin: 0 0 8px; font-size: .9rem; font-weight: 900;
      color: var(--text-main);
      display: flex; align-items: center; gap: 8px;
    }
    .modal-section h4 i { color: var(--orange); font-size: .95rem; }
    .modal-section .section-content {
      background: rgba(249,115,22,.06);
      border: 1px solid rgba(249,115,22,.2);
      border-radius: 12px; padding: 12px 14px;
      font-size: .86rem; line-height: 1.7;
      color: var(--text-main);
    }
    [data-theme="dark"] .modal-section .section-content { background: rgba(249,115,22,.1); }
    .section-content.green { background: rgba(16,185,129,.08); border-color: rgba(16,185,129,.2); }
    [data-theme="dark"] .section-content.green { background: rgba(16,185,129,.12); }

    /* Gallery */
    .gallery-scroll {
      display: flex; overflow-x: auto; gap: 10px;
      padding-bottom: 8px; scroll-snap-type: x mandatory;
    }
    .gallery-scroll::-webkit-scrollbar { height: 6px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: rgba(249,115,22,.4); border-radius: 10px; }
    .gallery-item {
      flex: 0 0 auto; width: 200px; height: 140px;
      scroll-snap-align: start; border-radius: 12px; overflow: hidden;
      border: 2px solid var(--border-color);
      background: var(--bg-color); cursor: pointer;
      transition: all .3s ease;
    }
    .gallery-item:hover {
      transform: scale(1.05); border-color: var(--orange);
      box-shadow: 0 10px 25px -5px rgba(249,115,22,.35);
    }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    /* Video */
    .video-wrap {
      width: 100%; aspect-ratio: 16/9; border-radius: 14px;
      overflow: hidden; background: var(--bg-color);
      border: 2px solid var(--border-color);
    }
    .video-wrap iframe { width: 100%; height: 100%; border: 0; }

    /* Map */
    .map-wrap {
      width: 100%; height: 260px; border-radius: 14px;
      overflow: hidden; background: var(--bg-color);
      border: 2px solid var(--border-color);
    }
    .map-wrap iframe { width: 100%; height: 100%; border: 0; }

    /* Modal actions */
    .modal-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding-top: 16px; border-top: 1.5px solid var(--border-color);
      margin-top: 6px;
    }
    .modal-actions a {
      flex: 1; min-width: 140px;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; padding: 12px 16px;
      border-radius: 12px; font-weight: 800; font-size: .85rem;
      text-decoration: none; transition: all .2s;
    }
    .modal-actions a.call {
      background: rgba(249,115,22,.1); color: var(--orange-dark);
      border: 1.5px solid rgba(249,115,22,.3);
    }
    [data-theme="dark"] .modal-actions a.call { color: #fdba74; background: rgba(249,115,22,.15); }
    .modal-actions a.call:hover { background: var(--orange); color: #fff; border-color: var(--orange); }
    .modal-actions a.map-btn {
      background: linear-gradient(135deg,#f97316,#ea580c); color: #fff;
      box-shadow: 0 6px 18px rgba(249,115,22,.35);
    }
    .modal-actions a.map-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(249,115,22,.5); }

    /* ===== CHAT ===== */
    #chatWindow {
      position: fixed; bottom: 110px; right: 20px; z-index: 1500;
      width: 340px; max-height: 480px;
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
      border: 1.5px solid var(--border-color);
      display: none; flex-direction: column;
      overflow: hidden;
    }
    #chatWindow.open { display: flex; }
    @media(max-width:640px){ #chatWindow { width: calc(100vw - 2rem); right: 1rem; left: 1rem; } }
    .chat-header {
      background: linear-gradient(135deg,#f97316,#f59e0b);
      color: #fff; padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      font-weight: 800;
    }
    .chat-header span { display: flex; align-items: center; gap: 8px; }
    .chat-close-btn {
      width: 28px; height: 28px; border-radius: 8px;
      background: rgba(255,255,255,.25); border: none; color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    #chatBody {
      padding: 12px; overflow-y: auto; height: 320px;
      font-size: .85rem; display: flex; flex-direction: column; gap: 8px;
      background: var(--bg-color);
    }
    .chat-input-wrap {
      padding: 8px; border-top: 1px solid var(--border-color);
      display: flex; gap: 6px; background: var(--card-bg);
    }
    #chatInput {
      flex: 1; padding: 9px 12px;
      border: 1.5px solid var(--border-color); border-radius: 10px;
      font-size: .82rem; outline: none; font-family: inherit;
      background: var(--bg-color); color: var(--text-main);
    }
    #chatInput:focus { border-color: var(--orange); }
    .chat-send-btn {
      background: var(--orange); color: #fff; border: none;
      padding: 9px 14px; border-radius: 10px; cursor: pointer;
      transition: all .2s;
    }
    .chat-send-btn:hover { background: var(--orange-dark); transform: scale(1.05); }

    /* ===== KANGOUROU ===== */
    .mascot-container {
      position: fixed; bottom: 22px; right: 22px; z-index: 1000;
      cursor: pointer; user-select: none;
    }
    .mascot-kangaroo {
      width: 70px; height: 90px;
      filter: drop-shadow(0 10px 15px rgba(249,115,22,.3));
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    }
    .mascot-kangaroo.jump { animation: kangarooJump .6s ease; }
    @keyframes kangarooJump {
      0%,100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-20px) scale(1.1) rotate(-8deg); }
      60% { transform: translateY(-10px) scale(1) rotate(5deg); }
    }

    @media(max-width:768px){
      .top-navbar { padding: 8px 10px; border-radius: 16px; }
      .nav-title { font-size: .85rem; }
      .nav-subtitle { font-size: .6rem; }
    }
  </style>
</head>
<body>

  <!-- BLOBS -->
  <div class="animated-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

      html.setAttribute('data-theme', html.getAttribute('data-theme')==='dark'?'light':'dark');

      b.innerHTML = isDark
        ? '<i class="fa-solid fa-sun"></i> <span>'+t('menu_dark')+'</span>'
        : '<i class="fa-solid fa-moon"></i> <span>'+t('menu_dark')+'</span>';
    }

    // ===== MENU =====
    function toggleMenu(){
      document.getElementById('navDropdown').classList.toggle('open');
      document.getElementById('menuBtn').classList.toggle('active');
    }
    document.addEventListener('click', e=>{
      const dd = document.getElementById('navDropdown');
      const btn = document.getElementById('menuBtn');
      if(!dd.contains(e.target) && !btn.contains(e.target)){
        dd.classList.remove('open');
        btn.classList.remove('active');
      }
    });

    // ===== FILTER =====
    function setFilter(filter){
      currentFilter = filter;
      ['all','resto','cafe'].forEach(f=>{
        const b = document.getElementById('filter-'+f);
        if(b) b.classList.toggle('active', f === filter);
      });
      renderItems();
    }

    // ===== SORT =====
    function setSort(type){
      currentSort = type;
      ['default','dist','price','rating'].forEach(tp=>{
        const b = document.getElementById('sort-'+tp);
        if(b) b.classList.toggle('active', tp === type);
      });
      renderItems();
    }

    // ===== RENDER ITEMS =====
    function renderItems(){
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      let items = [...data.items];
      if(currentFilter !== 'all') items = items.filter(i => i.category === currentFilter);

      if(currentSort === 'dist') items.sort((a,b) => (a.dist||999) - (b.dist||999));
      else if(currentSort === 'price') items.sort((a,b) => a.p - b.p);
      else if(currentSort === 'rating') items.sort((a,b) => b.r - a.r);

      if(items.length === 0){
        grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--text-muted);font-weight:700;">${t('no_items')}</p>`;
        return;
      }

      items.forEach(item=>{
        let priceStr = item.p === 1 ? '$' : item.p === 2 ? '$$' : item.p === 3 ? '$$$' : '';
        const distStr = item.dist !== null ? `${item.dist} km` : '';
        const menuText = item.menu && item.menu[currentLang] ? item.menu[currentLang] : '';
        const coverImage = item.menuImages && item.menuImages.length > 0 ? item.menuImages[0] : null;

        let imageHTML;
        if(coverImage){
          imageHTML = `<div class="resto-card-cover">
            <img src="${coverImage}" alt="${item.n}" onerror="this.parentElement.innerHTML='<div class=\\'no-img\\'><i class=\\'fa-solid fa-image\\'></i></div>'">
            <div class="card-type-badge ${item.category}">
              <i class="fa-solid ${item.category==='resto'?'fa-utensils':'fa-mug-hot'}"></i>
              ${item.category==='resto'?t('filter_resto'):t('filter_cafe')}
            </div>
          </div>`;
        } else {
          imageHTML = `<div class="resto-card-cover">
            <div class="no-img"><i class="fa-solid ${item.category==='resto'?'fa-utensils':'fa-mug-hot'}"></i></div>
            <div class="card-type-badge ${item.category}">
              <i class="fa-solid ${item.category==='resto'?'fa-utensils':'fa-mug-hot'}"></i>
              ${item.category==='resto'?t('filter_resto'):t('filter_cafe')}
            </div>
          </div>`;
        }

        const deliveryBadge = item.delivery ? `<span class="meta-chip green"><i class="fa-solid fa-truck-fast"></i> ${t('delivery_yes')}</span>` : '';

        const card = document.createElement('div');
        card.className = 'resto-card';
        card.onclick = () => openModal(item);
        card.innerHTML = `
          ${imageHTML}
          <div class="resto-card-body">
            <div class="resto-card-header">
              <h3 class="resto-card-title">${item.n}</h3>
              <div class="rating-badge"><i class="fa-solid fa-star"></i> ${item.r}</div>
            </div>
            <div class="resto-meta-chips">
              ${distStr ? `<span class="meta-chip"><i class="fa-solid fa-location-dot"></i> ${distStr}</span>` : ''}
              ${priceStr ? `<span class="meta-chip green"><i class="fa-solid fa-money-bill"></i> ${priceStr}</span>` : ''}
              ${deliveryBadge}
            </div>
            ${menuText ? `<p class="resto-card-desc">${menuText}</p>` : ''}
            <div class="resto-card-footer">
              <i class="fa-solid fa-eye"></i>
              <span>${t('btn_details')}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ===== MODAL =====
    function openModal(item){
      const modal = document.getElementById('itemModal');
      modal.classList.add('open');

      document.getElementById('modalTitle').innerText = item.n;
      document.getElementById('modalSubtitle').innerHTML = `
        <span>${item.category==='resto'?t('filter_resto'):t('filter_cafe')}</span>
        <span class="rating-badge"><i class="fa-solid fa-star"></i> ${item.r}</span>
      `;

      document.getElementById('modalHours').innerText =
        item.h && item.h.length > 0 ? item.h.map(h => `${h[0]} - ${h[1]}`).join(' | ') : '-';

      // Delivery
      const dc = document.getElementById('modalDeliveryContainer');
      if(item.delivery){
        dc.style.display = 'block';
        document.getElementById('modalDelivery').innerHTML = `<span style="color:#10b981;font-weight:800;"><i class="fa-solid fa-check-circle"></i> ${t('delivery_yes')}</span>${item.deliveryInfo ? ' — ' + item.deliveryInfo : ''}`;
      } else { dc.style.display = 'none'; }

      // Text menu
      const tmc = document.getElementById('modalTextMenuContainer');
      const menuText = item.menu && item.menu[currentLang] ? item.menu[currentLang] : '';
      if(menuText){
        tmc.style.display = 'block';
        document.getElementById('modalTextMenu').innerText = menuText;
      } else { tmc.style.display = 'none'; }

      // Video
      const vc = document.getElementById('modalVideoContainer');
      const vd = document.getElementById('modalVideo');
      if(item.video){
        vc.style.display = 'block';
        vd.innerHTML = `<iframe src="https://www.youtube.com/embed/${item.video}" allowfullscreen></iframe>`;
      } else { vc.style.display = 'none'; }

      // Gallery
      const mc = document.getElementById('modalMenuContainer');
      const mg = document.getElementById('modalMenuGallery');
      mg.innerHTML = '';
      if(item.menuImages && item.menuImages.length > 0){
        mc.style.display = 'block';
        item.menuImages.forEach(img=>{
          mg.innerHTML += `<div class="gallery-item" onclick="window.open('${img}','_blank')">
            <img src="${img}" onerror="this.parentElement.innerHTML='<div style=\\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:.75rem;\\'>Image N/A</div>'">
          </div>`;
        });
      } else { mc.style.display = 'none'; }

      // Map
      const mapc = document.getElementById('modalMapContainer');
      const mapd = document.getElementById('modalMap');
      if(item.g){
        mapc.style.display = 'block';
        mapd.innerHTML = `<iframe src="https://www.google.com/maps?q=${item.g[0]},${item.g[1]}&output=embed" allowfullscreen loading="lazy"></iframe>`;
      } else { mapc.style.display = 'none'; }

      // Buttons
      const pb = document.getElementById('modalPhoneBtn');
      if(item.t){ pb.href = `tel:${item.t}`; pb.style.display = 'flex'; } else pb.style.display = 'none';

      const mb = document.getElementById('modalMapBtn');
      if(item.g){ mb.href = `https://www.google.com/maps/search/?api=1&query=${item.g[0]},${item.g[1]}`; mb.style.display = 'flex'; } else mb.style.display = 'none';

      document.querySelector('.modal-card').scrollTop = 0;
    }

    function closeModal(){
      document.getElementById('itemModal').classList.remove('open');
    }

    document.getElementById('itemModal').addEventListener('click', function(e){
      if(e.target === this) closeModal();
    });
    document.addEventListener('keydown', e=>{
      if(e.key === 'Escape') closeModal();
    });

    // ===== CHAT =====
    function toggleChat(){
      const chat = document.getElementById('chatWindow');
      if(!chat) return;
      chat.classList.toggle('open');
    }

    function sendMessage(){
      const input = document.getElementById('chatInput');
      const body = document.getElementById('chatBody');
      if(!input || !body) return;
      const msg = input.value.trim();
      if(!msg) return;
      body.innerHTML += `<div style="display:flex;justify-content:flex-end;"><div style="background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;padding:9px 13px;border-radius:12px 12px 4px 12px;max-width:80%;font-size:.82rem;font-weight:600;">${msg}</div></div>`;
      input.value = '';
      body.scrollTop = body.scrollHeight;

      setTimeout(()=>{
        let reply = t('chat_default');
        const m = msg.toLowerCase();
        if(m.includes("مطعم") || m.includes("مقهى") || m.includes("resto") || m.includes("cafe") || m.includes("eat")) reply = "🍽️ " + t('chat_resto');
        else if(m.includes("سلام") || m.includes("مرحبا") || m.includes("hello") || m.includes("bonjour")) reply = "👋 " + t('chat_hello');
        else if(m.includes("شكرا") || m.includes("merci") || m.includes("thanks")) reply = "💛 " + t('chat_thanks');
        body.innerHTML += `<div style="display:flex;justify-content:flex-start;"><div style="background:rgba(249,115,22,.12);color:var(--orange-dark);padding:9px 13px;border-radius:12px 12px 12px 4px;max-width:80%;font-size:.82rem;font-weight:600;">${reply}</div></div>`;
        body.scrollTop = body.scrollHeight;
      }, 500);
    }

    // ===== KANGOUROU =====
    const kangarooContainer = document.getElementById('kangarooContainer');
    const kangarooSvg = document.getElementById('kangarooSvg');
    if(kangarooContainer){
      kangarooContainer.addEventListener('click', ()=>{
        if(kangarooSvg){
          kangarooSvg.classList.remove('jump');
          void kangarooSvg.offsetHeight;
          kangarooSvg.classList.add('jump');
          setTimeout(()=>kangarooSvg.classList.remove('jump'), 700);
        }
        toggleChat();
      });
      kangarooContainer.addEventListener('mouseenter', ()=>{
        if(kangarooSvg) kangarooSvg.style.transform = 'scale(1.1)';
      });
      kangarooContainer.addEventListener('mouseleave', ()=>{
        if(kangarooSvg) kangarooSvg.style.transform = '';
      });
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', ()=>{
      const saved = localStorage.getItem('enstp_lang') || 'ar';
      currentLang = saved;
      document.querySelectorAll('.dropdown-btn').forEach(b=>b.classList.remove('active'));
      const b = document.getElementById('btn-'+saved); if(b) b.classList.add('active');
      applyRestoTranslation(saved);

      updateThemeBtn();
      renderItems();

      const chatInput = document.getElementById('chatInput');
      if(chatInput){
        chatInput.addEventListener('keypress', e=>{
          if(e.key === 'Enter'){ e.preventDefault(); sendMessage(); }
        });
      }
    });
  </script>
</body>
</html>
