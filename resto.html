<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page_title">المطاعم والمقاهي - ENSTP</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary: #fbbf24;
      --primary-hover: #f59e0b;
      --orange: #f97316;
      --orange-dark: #ea580c;
      --bg-color: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: #ffffff;
      --nav-bg: rgba(255, 255, 255, 0.95);
      --border-color: #e2e8f0;
      --shadow-sm: 0 4px 15px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.1);
    }
    [data-theme="dark"] {
      --bg-color: #0a1128;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: #0f1e41;
      --nav-bg: rgba(10, 17, 40, 0.95);
      --border-color: #1e3a8a;
      --shadow-sm: 0 4px 15px rgba(0,0,0,0.3);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: background-color .4s, color .4s;
      margin: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-top: 90px;
    }

    /* BLOBS */
    .animated-bg { position: fixed; inset: 0; z-index: -3; overflow: hidden; background: var(--bg-color); transition: background .6s; }
    .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .35; animation: blobFloat 25s ease-in-out infinite; }
    .blob-1 { width: 500px; height: 500px; background: #f97316; top: -10%; left: -10%; }
    .blob-2 { width: 450px; height: 450px; background: #fbbf24; bottom: -10%; right: -10%; animation-delay: -8s; }
    .blob-3 { width: 350px; height: 350px; background: #ea580c; top: 50%; left: 40%; animation-delay: -15s; opacity: .25; }
    [data-theme="dark"] .blob-1 { background:#f97316; opacity:.2 }
    [data-theme="dark"] .blob-2 { background:#3b82f6; opacity:.15 }
    [data-theme="dark"] .blob-3 { background:#1e3a8a; opacity:.3 }
    @keyframes blobFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(60px,-40px) scale(1.1); }
      66% { transform: translate(-40px,60px) scale(.95); }
    }

    /* NAVBAR */
    .top-navbar {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      width: 96%; max-width: 1100px;
      background: var(--nav-bg);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1.5px solid var(--border-color);
      border-radius: 22px;
      padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; z-index: 1000; box-shadow: var(--shadow-md);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .nav-title { font-size: 1rem; font-weight: 900; color: var(--text-main); line-height: 1.1; }
    .nav-title span {
      background: linear-gradient(90deg,#f97316,#fbbf24,#f97316);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% center; } }
    .nav-subtitle { font-size: .65rem; color: var(--text-muted); font-weight: 600; margin-top: 1px; }
    .nav-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg,#f97316,#ea580c); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; box-shadow: 0 6px 18px rgba(249,115,22,.35);
      flex-shrink: 0;
    }
    .nav-menu-btn {
      width: 42px; height: 42px; border-radius: 14px;
      border: 1.5px solid var(--border-color); background: var(--card-bg);
      color: var(--text-main); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .25s; font-size: 1rem; flex-shrink: 0;
    }
    .nav-menu-btn:hover {
      background: var(--orange); color: #fff; border-color: var(--orange);
      transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249,115,22,.35);
    }
    .nav-menu-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    .nav-dropdown {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%) translateY(-10px);
      width: 290px; max-width: 92%; background: var(--nav-bg);
      backdrop-filter: blur(20px); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 8px; box-shadow: var(--shadow-md);
      z-index: 1001; opacity: 0; pointer-events: none;
      transition: all .25s cubic-bezier(.34,1.56,.64,1);
    }
    .nav-dropdown.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .dropdown-section { padding: 10px 8px; border-bottom: 1px solid var(--border-color); }
    .dropdown-section:last-child { border-bottom: none; }
    .dropdown-label {
      font-size: .65rem; font-weight: 800; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; padding: 0 4px;
    }
    .dropdown-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .dropdown-btn {
      padding: 8px 12px; border-radius: 10px;
      border: 1px solid var(--border-color); background: var(--card-bg);
      color: var(--text-main); font-family: inherit; font-size: .75rem; font-weight: 700;
      cursor: pointer; transition: all .2s; display: inline-flex; align-items: center;
      gap: 6px; flex: 1; justify-content: center; min-width: fit-content; text-decoration: none;
    }
    .dropdown-btn:hover {
      background: var(--primary); color: #000; border-color: var(--primary); transform: translateY(-1px);
    }
    .dropdown-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    /* HERO */
    .page-hero { max-width: 1100px; margin: 0 auto 24px; padding: 0 20px; text-align: center; }
    .page-hero h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 900;
      margin: 0 0 8px; line-height: 1.2;
    }
    .page-hero h1 span {
      background: linear-gradient(90deg,#fbbf24,#f97316,#fbbf24);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }
    .page-hero p { color: var(--text-muted); font-size: .95rem; font-weight: 600; margin: 0; }

    /* CONTENT */
    .content-wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

    /* Search & Filters */
    .filters-bar {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
      margin-bottom: 20px;
    }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 20px; border-radius: 16px;
      background: var(--card-bg); border: 1.5px solid var(--border-color);
      color: var(--text-main); font-family: inherit; font-weight: 800; font-size: .88rem;
      cursor: pointer; transition: all .3s;
    }
    .filter-chip.active {
      background: var(--orange); color: #fff; border-color: var(--orange);
    }

    /* Cards Grid */
    #itemsGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    /* NOUVELLE CARTE DE RESTO (Style Image) */
    .resto-card-new {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: all .3s ease;
    }
    .resto-card-new:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    /* Image de couverture + Badges */
    .cover-wrap {
      position: relative;
      width: 100%; height: 200px;
      background: #e2e8f0;
    }
    .cover-wrap img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .badge-top-right {
      position: absolute; top: 12px; right: 12px;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(5px);
      padding: 4px 10px; border-radius: 8px;
      font-size: 0.75rem; font-weight: 800; color: #1e293b;
      display: flex; align-items: center; gap: 4px;
    }
    
    /* Body de la carte */
    .card-body-new {
      padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* Titre */
    .place-title-new {
      font-size: 1.25rem; font-weight: 900; color: var(--text-main);
      margin: 0;
    }

    /* Tags (Pizza, etc.) */
    .category-tag {
      display: inline-block;
      background: #f1f5f9; color: #475569;
      padding: 6px 14px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 700;
      width: fit-content;
    }
    [data-theme="dark"] .category-tag { background: #1e293b; color: #cbd5e1; }

    /* Prix */
    .price-tag {
      display: inline-block;
      background: #e0f2fe; color: #0369a1;
      padding: 6px 14px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 800;
      width: fit-content;
    }
    [data-theme="dark"] .price-tag { background: rgba(3,105,161,0.2); color: #38bdf8; }

    /* Description */
    .desc-new {
      font-size: 0.9rem; color: var(--text-muted); line-height: 1.6;
      margin: 0;
    }

    /* Note étoiles */
    .rating-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.9rem; font-weight: 800; color: var(--text-main);
    }
    .stars-display {
      color: #fbbf24; display: flex; gap: 2px; font-size: 0.95rem;
    }
    .rating-count {
      color: var(--text-muted); font-weight: 600; font-size: 0.8rem;
    }

    /* Téléphone */
    .phone-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.95rem; font-weight: 800; color: #047857;
      text-decoration: none;
    }
    .phone-row i { color: #10b981; }

    /* Bouton Bon Marché */
    .badge-cheap {
      display: inline-block;
      background: #e0f2fe; color: #0369a1;
      padding: 6px 14px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 800;
      width: fit-content;
    }
    [data-theme="dark"] .badge-cheap { background: rgba(3,105,161,0.2); color: #38bdf8; }

    /* Horaires */
    .hours-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.9rem; color: var(--text-muted); font-weight: 700;
    }

    /* Avis des clients (Box grise) */
    .reviews-box {
      background: #f8fafc; border-radius: 16px; padding: 16px;
      border: 1px solid #e2e8f0; margin-top: 6px;
    }
    [data-theme="dark"] .reviews-box { background: #1e293b; border-color: #334155; }
    
    .reviews-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .reviews-title {
      font-size: 0.9rem; font-weight: 900; color: var(--text-main);
      display: flex; align-items: center; gap: 6px;
    }
    .reviews-link {
      font-size: 0.8rem; color: #047857; font-weight: 800; cursor: pointer; text-decoration: none;
    }
    [data-theme="dark"] .reviews-link { color: #34d399; }

    .review-text {
      font-size: 0.88rem; color: #475569; font-style: italic; line-height: 1.6;
      margin: 0;
    }
    [data-theme="dark"] .review-text { color: #cbd5e1; }

    /* Modal details (when clicking) */
    #itemModal {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(15,23,42,.8); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    #itemModal.open { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--card-bg); border-radius: 24px;
      max-width: 600px; width: 100%; max-height: 90vh;
      overflow-y: auto; padding: 24px;
      position: relative; transform: scale(.95); transition: transform .3s;
    }
    #itemModal.open .modal-card { transform: scale(1); }
    .modal-close {
      position: absolute; top: 16px; left: 16px;
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg-color); border: 1px solid var(--border-color);
      color: var(--text-main); cursor: pointer; z-index: 5;
    }
    
    /* Comments Section */
    .comments-section { margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px; }
    .comment-form { display: flex; gap: 8px; margin-bottom: 16px; }
    .comment-form input {
      flex: 1; padding: 10px 14px; border-radius: 10px;
      border: 1.5px solid var(--border-color); background: var(--bg-color); color: var(--text-main);
      font-family: inherit; font-size: .85rem; outline: none;
    }
    .comment-form input:focus { border-color: var(--orange); }
    .comment-form button {
      padding: 10px 16px; border-radius: 10px; border: none;
      background: var(--orange); color: #fff; font-weight: 800; cursor: pointer;
    }
    .comments-list { display: flex; flex-direction: column; gap: 10px; }
    .comment-item {
      background: var(--bg-color); padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--border-color); font-size: .85rem;
    }
    
    /* Chat & Kangourou */
    #chatWindow {
      position: fixed; bottom: 110px; right: 20px; z-index: 1500;
      width: 340px; max-height: 480px; background: var(--card-bg); border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25); border: 1.5px solid var(--border-color);
      display: none; flex-direction: column; overflow: hidden;
    }
    #chatWindow.open { display: flex; }
    .chat-header { background: linear-gradient(135deg,#f97316,#f59e0b); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; }
    #chatBody { padding: 12px; overflow-y: auto; height: 320px; display: flex; flex-direction: column; gap: 8px; }
    .chat-input-wrap { padding: 8px; border-top: 1px solid var(--border-color); display: flex; gap: 6px; }
    #chatInput { flex: 1; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--border-color); outline: none; font-family: inherit; }
    
    .mascot-container { position: fixed; bottom: 22px; right: 22px; z-index: 1000; cursor: pointer; }
    .mascot-kangaroo { width: 70px; height: 90px; filter: drop-shadow(0 10px 15px rgba(249,115,22,.3)); transition: transform .3s; }
    .mascot-kangaroo.jump { animation: kangarooJump .6s ease; }
    @keyframes kangarooJump { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-20px) scale(1.1)} 60%{transform:translateY(-10px) scale(1) rotate(5deg)} }

    @media(max-width:768px){
      .top-navbar { padding: 8px 10px; border-radius: 16px; }
      .nav-title { font-size: .85rem; }
    }
  </style>
</head>
<body>

  <div class="animated-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <nav class="top-navbar">
    <div class="nav-brand">
      <div class="nav-icon"><i class="fa-solid fa-utensils"></i></div>
      <div>
        <div class="nav-title">ENSTP <span>Resto</span></div>
        <div class="nav-subtitle" data-i18n="resto_title">المطاعم والمقاهي</div>
      </div>
    </div>
    <button class="nav-menu-btn" id="menuBtn" onclick="toggleMenu()" title="القائمة">
      <i class="fa-solid fa-sliders"></i>
    </button>
  </nav>

  <div class="nav-dropdown" id="navDropdown">
    <div class="dropdown-section">
      <div class="dropdown-label">🌐 <span data-i18n="menu_lang">اللغة</span></div>
      <div class="dropdown-row">
        <button class="dropdown-btn active" onclick="setLanguage('ar')" id="btn-ar">🇩🇿 العربية</button>
        <button class="dropdown-btn" onclick="setLanguage('fr')" id="btn-fr">🇫🇷 Français</button>
        <button class="dropdown-btn" onclick="setLanguage('en')" id="btn-en">🇬🇧 English</button>
      </div>
    </div>
    <div class="dropdown-section">
      <div class="dropdown-label">⚙️ <span data-i18n="menu_settings">الإعدادات</span></div>
      <div class="dropdown-row">
        <button class="dropdown-btn" onclick="toggleDarkMode()" id="themeBtn">
          <i class="fa-solid fa-moon"></i> <span data-i18n="menu_dark">ليلي</span>
        </button>
        <a href="index.html" class="dropdown-btn">
          <i class="fa-solid fa-house"></i> <span data-i18n="nav_home">الرئيسية</span>
        </a>
      </div>
    </div>
  </div>

  <header class="page-hero">
    <h1><span data-i18n="hero_1">المطاعم</span> <span data-i18n="hero_2">والمقاهي</span></h1>
    <p data-i18n="hero_desc">اكتشف أفضل المطاعم والمقاهي القريبة من المدرسة.</p>
  </header>

  <main class="content-wrap">
    <!-- Filters -->
    <div class="filters-bar">
      <button onclick="setFilter('all')" id="filter-all" class="filter-chip active">
        <i class="fa-solid fa-list"></i> <span data-i18n="filter_all">الكل</span>
      </button>
      <button onclick="setFilter('resto')" id="filter-resto" class="filter-chip">
        <i class="fa-solid fa-utensils"></i> <span data-i18n="filter_resto">مطاعم</span>
      </button>
      <button onclick="setFilter('cafe')" id="filter-cafe" class="filter-chip">
        <i class="fa-solid fa-mug-hot"></i> <span data-i18n="filter_cafe">مقاهي</span>
      </button>
    </div>

    <div id="itemsGrid"></div>
  </main>

  <!-- MODAL -->
  <div id="itemModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- KANGOUROU -->
  <div class="mascot-container" id="kangarooContainer">
    <svg class="mascot-kangaroo" id="kangarooSvg" viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="32" cy="76" rx="18" ry="3" fill="rgba(0,0,0,0.15)"/>
      <path d="M12 60 Q4 54 6 64 Q8 72 14 66 Z" fill="#ea580c"/>
      <ellipse cx="46" cy="68" rx="10" ry="5" fill="#ea580c"/>
      <ellipse cx="34" cy="52" rx="18" ry="16" fill="#f97316"/>
      <ellipse cx="36" cy="54" rx="10" ry="10" fill="#fed7aa"/>
      <ellipse cx="26" cy="64" rx="6" ry="3.5" fill="#ea580c"/>
      <ellipse cx="44" cy="28" rx="13" ry="12" fill="#f97316"/>
      <ellipse cx="38" cy="12" rx="4" ry="9" fill="#f97316" transform="rotate(-15 38 12)"/>
      <ellipse cx="38" cy="13" rx="2" ry="5.5" fill="#fed7aa" transform="rotate(-15 38 12)"/>
      <ellipse cx="50" cy="12" rx="4" ry="9" fill="#f97316" transform="rotate(15 50 12)"/>
      <ellipse cx="50" cy="13" rx="2" ry="5.5" fill="#fed7aa" transform="rotate(15 50 12)"/>
      <ellipse cx="48" cy="33" rx="7" ry="6" fill="#fed7aa"/>
      <ellipse cx="53" cy="31" rx="2" ry="1.5" fill="#7c2d12"/>
      <circle cx="46" cy="26" r="2.5" fill="#1a1410"/>
      <circle cx="46.8" cy="25.2" r="0.9" fill="#ffffff"/>
      <path d="M47 36 Q51 38 54 36" stroke="#7c2d12" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <ellipse cx="28" cy="44" rx="5" ry="3" fill="#ea580c" transform="rotate(-30 28 44)"/>
      <circle cx="22" cy="38" r="4" fill="rgba(255,255,255,0.9)" stroke="#c2410c" stroke-width="1.5"/>
      <line x1="25" y1="41" x2="28" y2="44" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- CHAT -->
  <div id="chatWindow">
    <div class="chat-header">
      <span><i class="fa-solid fa-comments"></i> <span data-i18n="chat_title">المساعد</span></span>
      <button onclick="toggleChat()" style="background:none;border:none;color:white;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="chatBody">
      <div style="background:rgba(249,115,22,.12);padding:9px 13px;border-radius:12px;color:var(--orange-dark);font-weight:600;" data-i18n="chat_welcome">مرحباً! 👋</div>
    </div>
    <div class="chat-input-wrap">
      <input type="text" id="chatInput" data-i18n-placeholder="chat_placeholder" placeholder="اكتب سؤالك...">
      <button class="chat-send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // ============================================
    // DATA (Mise à jour avec les champs de l'image)
    // ============================================
    const data = {
      items: [
        { category: 'resto', n: "Pizza On Est Là", price: "500 - 800 DA", r: 4.0, revs: 481, dist: 0.8, loc: "Vieux Kouba", desc: "Pizza carrée populaire aux garnitures traditionnelles.", phone: "+213 558 27 70 92", cheap: true, hours: "11:00 - 23:00", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=600&q=80", review: "Excellente pâte, bien sablée et croustillante, pizza carré à l'ancienne avec garniture classique pour les puristes..." },
        { category: 'resto', n: "Mega Pizza Kouba", price: "600 - 1200 DA", r: 4.5, revs: 320, dist: 1.2, loc: "Kouba", desc: "Grande variété de pizzas et pâtes fraîches.", phone: "+213 550 12 34 56", cheap: false, hours: "11:00 - 23:30", img: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=600&q=80", review: "Toujours un régal, les ingrédients sont frais et le service est rapide." },
        { category: 'cafe', n: "Nafess Café", price: "200 - 500 DA", r: 4.6, revs: 150, dist: 0.5, loc: "Kouba Centre", desc: "Café moderne avec de délicieuses pâtisseries.", phone: "+213 770 11 22 33", cheap: true, hours: "07:30 - 23:00", img: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=600&q=80", review: "Ambiance très calme, idéal pour réviser tout en sirotant un bon café." },
        { category: 'cafe', n: "Brioch Cafétéria", price: "150 - 400 DA", r: 4.4, revs: 210, dist: 1.0, loc: "Kouba", desc: "Spécialités de brioches et cafés gourmands.", phone: "", cheap: true, hours: "06:00 - 22:00", img: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=600&q=80", review: "Les meilleures brioches du quartier, prix très abordables." },
      ]
    };

    let currentFilter = 'all';
    let currentLang = 'ar';

    // ============================================
    // TRADUCTIONS
    // ============================================
    const translations = {
      ar: {
        title: "المطاعم والمقاهي",
        subtitle: "دليل شامل لأفضل الأماكن",
        filter_all: "الكل", filter_resto: "مطاعم", filter_cafe: "مقاهي",
        loc: "الموقع", reviews: "آراء الزبائن", other_reviews: "المزيد", cheap: "اقتصادي",
        hours: "أوقات العمل", reviews_count: "تقييم"
      },
      fr: {
        title: "Restaurants & Cafés",
        subtitle: "Guide complet des meilleurs endroits",
        filter_all: "Tous", filter_resto: "Restaurants", filter_cafe: "Cafés",
        loc: "Localisation", reviews: "Avis des clients", other_reviews: "Autres avis", cheap: "Bon marché",
        hours: "Horaires", reviews_count: "avis"
      }
    };

    function t(key) {
      return translations[currentLang][key] || key;
    }

    // ============================================
    // INITIALISATION
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      // Dark mode
      if(localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      
      // Render
      renderItems();
    });

    // ============================================
    // FILTRES
    // ============================================
    function setFilter(f) {
      currentFilter = f;
      ['all', 'resto', 'cafe'].forEach(fId => {
        const b = document.getElementById('filter-' + fId);
        if(b) b.classList.toggle('active', fId === f);
      });
      renderItems();
    }

    // ============================================
    // RENDER ITEMS
    // ============================================
    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      let items = [...data.items];
      if (currentFilter !== 'all') items = items.filter(i => i.category === currentFilter);

      items.forEach(item => {
        // Étoiles
        let starsHTML = '';
        for(let i=1; i<=5; i++) {
          starsHTML += i <= Math.round(item.r) ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-regular fa-star"></i>';
        }

        // Badge category
        const catBadge = item.category === 'resto' ? 'Pizza' : 'Café';

        const card = document.createElement('div');
        card.className = 'resto-card-new';
        card.onclick = () => openModal(item);
        card.innerHTML = `
          <div class="cover-wrap">
            <img src="${item.img}" alt="${item.n}" onerror="this.src='https://via.placeholder.com/400x200?text=Image'">
            <div class="badge-top-right">
              <i class="fa-solid fa-camera"></i> 3 / 5
            </div>
          </div>
          
          <div class="card-body-new">
            <h3 class="place-title-new">${item.n}</h3>
            
            <div class="category-tag">${catBadge}</div>
            
            <div class="price-tag">${item.price}</div>
            
            <div style="display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:0.9rem; font-weight:700;">
              <i class="fa-solid fa-location-dot"></i> ${item.loc}
            </div>
            
            <p class="desc-new">${item.desc}</p>
            
            <div class="rating-row">
              <div class="stars-display">${starsHTML}</div>
              <span>${item.r}/5</span>
              <span class="rating-count">(${item.revs} ${t('reviews_count')})</span>
            </div>
            
            <a href="tel:${item.phone}" class="phone-row" onclick="event.stopPropagation();">
              <i class="fa-solid fa-phone"></i> ${item.phone}
            </a>
            
            ${item.cheap ? `<div class="badge-cheap">${t('cheap')}</div>` : ''}
            
            <div class="hours-row">
              <i class="fa-regular fa-clock"></i> ${t('hours')} : ${item.hours}
            </div>
            
            <div class="reviews-box">
              <div class="reviews-header">
                <div class="reviews-title"><i class="fa-solid fa-quote-left"></i> ${t('reviews')}</div>
                <span class="reviews-link">${t('other_reviews')} <i class="fa-solid fa-rotate-right"></i></span>
              </div>
              <p class="review-text">"${item.review}"</p>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ============================================
    // MODAL
    // ============================================
    function openModal(item) {
      const modal = document.getElementById('itemModal');
      const content = document.getElementById('modalContent');
      
      content.innerHTML = `
        <h2 style="margin:0 0 10px; font-size:1.5rem; font-weight:900;">${item.n}</h2>
        <img src="${item.img}" style="width:100%; height:200px; object-fit:cover; border-radius:12px; margin-bottom:16px;">
        <p style="font-size:1rem; font-weight:700; color:var(--text-muted);">${item.desc}</p>
        <hr style="border:0; border-top:1px solid var(--border-color); margin:16px 0;">
        <a href="tel:${item.phone}" style="display:inline-block; background:var(--orange); color:white; padding:10px 20px; border-radius:10px; text-decoration:none; font-weight:800;"><i class="fa-solid fa-phone"></i> ${item.phone}</a>
        
        <div class="comments-section">
          <h4 style="margin:0 0 10px;"><i class="fa-solid fa-comments"></i> Commentaires</h4>
          <div class="comment-form">
            <input type="text" id="commentInput" placeholder="Écrire un commentaire...">
            <button onclick="addComment('${item.n}')">Envoyer</button>
          </div>
          <div class="comments-list" id="commentsList"></div>
        </div>
      `;

      modal.classList.add('open');
      loadComments(item.n);
    }

    function closeModal() {
      document.getElementById('itemModal').classList.remove('open');
    }

    document.getElementById('itemModal').addEventListener('click', function(e) {
      if(e.target === this) closeModal();
    });

    // ============================================
    // COMMENTAIRES
    // ============================================
    function loadComments(id) {
      const list = document.getElementById('commentsList');
      if(!list) return;
      const saved = JSON.parse(localStorage.getItem('comments_' + id) || '[]');
      
      if(saved.length === 0) {
        list.innerHTML = '<p style="text-align:center;color:var(--text-muted);font-size:0.85rem;">Aucun commentaire.</p>';
        return;
      }

      saved.forEach(c => {
        list.innerHTML += `<div class="comment-item"><strong>${c.name}:</strong> ${c.text}</div>`;
      });
    }

    function addComment(id) {
      const input = document.getElementById('commentInput');
      if(!input || !input.value.trim()) return;
      
      const saved = JSON.parse(localStorage.getItem('comments_' + id) || '[]');
      saved.push({ name: "Étudiant", text: input.value.trim() });
      localStorage.setItem('comments_' + id, JSON.stringify(saved));
      
      input.value = '';
      loadComments(id);
    }

    // ============================================
    // INTERFACE
    // ============================================
    function toggleMenu() {
      document.getElementById('navDropdown').classList.toggle('open');
      document.getElementById('menuBtn').classList.toggle('active');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', html.getAttribute('data-theme'));
    }

    function setLanguage(lang) {
      currentLang = lang;
      // (Ici vous pouvez mettre à jour les textes dynamiquement si nécessaire)
      renderItems();
    }

    // Kangourou / Chat
    const kangarooContainer = document.getElementById('kangarooContainer');
    const kangarooSvg = document.getElementById('kangarooSvg');
    if(kangarooContainer){
      kangarooContainer.addEventListener('click', ()=>{
        if(kangarooSvg){
          kangarooSvg.classList.remove('jump');
          void kangarooSvg.offsetHeight;
          kangarooSvg.classList.add('jump');
          setTimeout(()=>kangarooSvg.classList.remove('jump'), 700);
        }
        toggleChat();
      });
    }

    function toggleChat() {
      document.getElementById('chatWindow').classList.toggle('open');
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const body = document.getElementById('chatBody');
      if(!input || !body || !input.value.trim()) return;

      body.innerHTML += `<div style="display:flex;justify-content:flex-end;"><div style="background:var(--orange);color:white;padding:8px 12px;border-radius:12px;max-width:80%;font-size:.85rem;">${input.value}</div></div>`;
      const msg = input.value; input.value = '';
      body.scrollTop = body.scrollHeight;

      setTimeout(() => {
        body.innerHTML += `<div style="display:flex;justify-content:flex-start;"><div style="background:var(--bg-color);border:1px solid var(--border-color);color:var(--text-main);padding:8px 12px;border-radius:12px;max-width:80%;font-size:.85rem;">Je suis un assistant virtuel. Je vous invite à consulter les restaurants ci-dessus.</div></div>`;
        body.scrollTop = body.scrollHeight;
      }, 600);
    }
  </script>
</body>
</html>
