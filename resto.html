<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المطاعم والمقاهي - ENSTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary:#fbbf24; --orange:#f97316; --orange-dark:#ea580c;
      --bg-color:#fff; --text-main:#0f172a; --text-muted:#64748b;
      --card-bg:#fff; --nav-bg:rgba(255,255,255,.95);
      --border-color:#e2e8f0;
      --shadow-sm:0 4px 15px rgba(0,0,0,.05);
      --shadow-md:0 10px 30px rgba(0,0,0,.1);
    }
    [data-theme="dark"]{
      --bg-color:#0a1128; --text-main:#f8fafc; --text-muted:#94a3b8;
      --card-bg:#0f1e41; --nav-bg:rgba(10,17,40,.95);
      --border-color:#1e3a8a;
      --shadow-sm:0 4px 15px rgba(0,0,0,.3);
      --shadow-md:0 10px 30px rgba(0,0,0,.5);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:'Cairo',sans-serif;background:var(--bg-color);color:var(--text-main);
      margin:0;overflow-x:hidden;min-height:100vh;padding-top:90px;
      transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
    .animated-bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--bg-color)}
    .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:blobFloat 25s ease-in-out infinite}
    .blob-1{width:500px;height:500px;background:#f97316;top:-10%;left:-10%}
    .blob-2{width:450px;height:450px;background:#fbbf24;bottom:-10%;right:-10%;animation-delay:-8s}
    .blob-3{width:350px;height:350px;background:#ea580c;top:50%;left:40%;animation-delay:-15s;opacity:.25}
    [data-theme="dark"] .blob-1{opacity:.2}
    [data-theme="dark"] .blob-2{background:#3b82f6;opacity:.15}
    [data-theme="dark"] .blob-3{background:#1e3a8a;opacity:.3}
    @keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.1)}66%{transform:translate(-40px,60px) scale(.95)}}

    .top-navbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);
      width:96%;max-width:1100px;background:var(--nav-bg);backdrop-filter:blur(20px) saturate(180%);
      border:1.5px solid var(--border-color);border-radius:22px;padding:10px 14px;
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      z-index:1000;box-shadow:var(--shadow-md)}
    .nav-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .nav-title{font-size:1rem;font-weight:900;color:var(--text-main);line-height:1.1}
    .nav-title span{background:linear-gradient(90deg,#f97316,#fbbf24,#f97316);background-size:200% auto;
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      animation:shimmer 3s linear infinite}
    @keyframes shimmer{to{background-position:200% center}}
    .nav-subtitle{font-size:.65rem;color:var(--text-muted);font-weight:600;margin-top:1px}
    .nav-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#f97316,#ea580c);
      color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;
      box-shadow:0 6px 18px rgba(249,115,22,.35);flex-shrink:0}
    .nav-menu-btn{width:42px;height:42px;border-radius:14px;border:1.5px solid var(--border-color);
      background:var(--card-bg);color:var(--text-main);display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all .25s;font-size:1rem;flex-shrink:0}
    .nav-menu-btn:hover,.nav-menu-btn.active{background:var(--orange);color:#fff;border-color:var(--orange)}
    .nav-dropdown{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-10px);
      width:290px;max-width:92%;background:var(--nav-bg);backdrop-filter:blur(20px);
      border:1px solid var(--border-color);border-radius:20px;padding:8px;box-shadow:var(--shadow-md);
      z-index:1001;opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
    .nav-dropdown.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
    .dropdown-section{padding:10px 8px;border-bottom:1px solid var(--border-color)}
    .dropdown-section:last-child{border-bottom:none}
    .dropdown-label{font-size:.65rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;
      letter-spacing:.5px;margin-bottom:8px;padding:0 4px}
    .dropdown-row{display:flex;gap:5px;flex-wrap:wrap}
    .dropdown-btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border-color);
      background:var(--card-bg);color:var(--text-main);font-family:inherit;font-size:.75rem;font-weight:700;
      cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;flex:1;
      justify-content:center;min-width:fit-content;text-decoration:none}
    .dropdown-btn:hover{background:var(--primary);color:#000;border-color:var(--primary)}
    .dropdown-btn.active{background:var(--orange);color:#fff;border-color:var(--orange)}

    .page-hero{max-width:1100px;margin:0 auto 24px;padding:0 20px;text-align:center}
    .page-hero h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:900;margin:0 0 8px;line-height:1.2}
    .page-hero h1 span{background:linear-gradient(90deg,#fbbf24,#f97316,#fbbf24);background-size:200% auto;
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      animation:shimmer 3s linear infinite}
    .page-hero p{color:var(--text-muted);font-size:.95rem;font-weight:600;margin:0}
    .content-wrap{max-width:1100px;margin:0 auto;padding:0 20px 60px}

    .filters-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
    .filter-chip{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:16px;
      background:var(--card-bg);border:1.5px solid var(--border-color);color:var(--text-main);
      font-family:inherit;font-weight:800;font-size:.88rem;cursor:pointer;transition:all .3s}
    .filter-chip.active{background:var(--orange);color:#fff;border-color:var(--orange)}

    /* ====== البطاقة (نفس شكل الملف الأول) ====== */
    #itemsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
    .resto-card-new{background:var(--card-bg);border:1px solid var(--border-color);border-radius:20px;
      overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
      box-shadow:var(--shadow-sm);transition:all .3s ease}
    .resto-card-new:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}

    /* ====== الكاروسيل التلقائي ====== */
    .cover-wrap{position:relative;width:100%;height:200px;background:#e2e8f0;overflow:hidden}
    .carousel-track{display:flex;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
    .carousel-track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover}
    .carousel-noimg{flex:0 0 100%;width:100%;height:100%;display:flex;align-items:center;
      justify-content:center;background:linear-gradient(135deg,#fed7aa,#fbbf24);
      font-size:3rem;color:rgba(249,115,22,.35)}
    .carousel-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
      display:flex;gap:5px;z-index:3}
    .carousel-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);
      transition:all .3s}
    .carousel-dots span.active{background:#fff;width:16px;border-radius:3px}

    .badge-top-right{position:absolute;top:12px;right:12px;z-index:3;
      background:rgba(255,255,255,.85);backdrop-filter:blur(5px);
      padding:4px 10px;border-radius:8px;font-size:.75rem;font-weight:800;color:#1e293b;
      display:flex;align-items:center;gap:4px}

    .card-body-new{padding:20px;display:flex;flex-direction:column;gap:12px}
    .place-title-new{font-size:1.25rem;font-weight:900;color:var(--text-main);margin:0}
    .category-tag{display:inline-block;background:#f1f5f9;color:#475569;padding:6px 14px;
      border-radius:20px;font-size:.8rem;font-weight:700;width:fit-content}
    [data-theme="dark"] .category-tag{background:#1e293b;color:#cbd5e1}
    .price-tag{display:inline-block;background:#e0f2fe;color:#0369a1;padding:6px 14px;
      border-radius:20px;font-size:.85rem;font-weight:800;width:fit-content}
    [data-theme="dark"] .price-tag{background:rgba(3,105,161,.2);color:#38bdf8}
    .desc-new{font-size:.9rem;color:var(--text-muted);line-height:1.6;margin:0}
    .rating-row{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:800;color:var(--text-main)}
    .stars-display{color:#fbbf24;display:flex;gap:2px;font-size:.95rem}
    .rating-count{color:var(--text-muted);font-weight:600;font-size:.8rem}
    .phone-row{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:800;color:#047857;text-decoration:none}
    .phone-row i{color:#10b981}
    .badge-cheap{display:inline-block;background:#e0f2fe;color:#0369a1;padding:6px 14px;
      border-radius:20px;font-size:.8rem;font-weight:800;width:fit-content}
    [data-theme="dark"] .badge-cheap{background:rgba(3,105,161,.2);color:#38bdf8}
    .hours-row{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--text-muted);font-weight:700}

    /* ====== التعليقات الحرة داخل البطاقة ====== */
    .reviews-box{background:#f8fafc;border-radius:16px;padding:16px;
      border:1px solid #e2e8f0;margin-top:6px}
    [data-theme="dark"] .reviews-box{background:#1e293b;border-color:#334155}
    .reviews-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .reviews-title{font-size:.9rem;font-weight:900;color:var(--text-main);
      display:flex;align-items:center;gap:6px}
    .reviews-count-badge{background:var(--orange);color:#fff;padding:2px 8px;
      border-radius:10px;font-size:.7rem;font-weight:800}
    .comment-form-inline{display:flex;gap:6px;margin-top:10px;flex-direction:column}
    .comment-form-inline .input-row{display:flex;gap:6px}
    .comment-form-inline input{flex:1;padding:8px 12px;border-radius:10px;
      border:1.5px solid var(--border-color);background:var(--bg-color);
      color:var(--text-main);font-family:inherit;font-size:.82rem;outline:none}
    .comment-form-inline input:focus{border-color:var(--orange)}
    .comment-form-inline button{padding:8px 14px;border-radius:10px;border:none;
      background:var(--orange);color:#fff;font-weight:800;cursor:pointer;
      font-family:inherit;font-size:.8rem;transition:all .2s}
    .comment-form-inline button:hover{background:var(--orange-dark);transform:scale(1.05)}
    .comments-list-inline{display:flex;flex-direction:column;gap:6px;margin-top:10px;
      max-height:180px;overflow-y:auto}
    .comment-item{background:var(--bg-color);padding:8px 12px;border-radius:10px;
      border:1px solid var(--border-color);font-size:.82rem;color:var(--text-main)}
    .comment-item strong{color:var(--orange-dark)}
    [data-theme="dark"] .comment-item strong{color:#fdba74}
    .no-comments{text-align:center;color:var(--text-muted);font-size:.8rem;margin:6px 0 0}

    /* ====== MODAL ====== */
    #itemModal{position:fixed;inset:0;z-index:2000;background:rgba(15,23,42,.8);
      backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
      padding:16px;opacity:0;pointer-events:none;transition:opacity .3s}
    #itemModal.open{opacity:1;pointer-events:auto}
    .modal-card{background:var(--card-bg);border-radius:24px;max-width:700px;width:100%;
      max-height:90vh;overflow-y:auto;padding:24px;position:relative;
      transform:scale(.95);transition:transform .3s}
    #itemModal.open .modal-card{transform:scale(1)}
    .modal-close{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;
      background:var(--bg-color);border:1px solid var(--border-color);color:var(--text-main);
      cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center}
    .modal-section{margin-bottom:18px}
    .modal-section h4{margin:0 0 8px;font-size:.9rem;font-weight:900;color:var(--text-main);
      display:flex;align-items:center;gap:8px}
    .modal-section h4 i{color:var(--orange)}
    .section-content{background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,.2);
      border-radius:12px;padding:12px 14px;font-size:.86rem;line-height:1.7;color:var(--text-main)}
    .section-content.green{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.2)}
    .gallery-scroll{display:flex;overflow-x:auto;gap:10px;padding-bottom:8px}
    .gallery-scroll::-webkit-scrollbar{height:6px}
    .gallery-scroll::-webkit-scrollbar-thumb{background:rgba(249,115,22,.4);border-radius:10px}
    .gallery-item{flex:0 0 auto;width:200px;height:140px;border-radius:12px;overflow:hidden;
      border:2px solid var(--border-color);background:var(--bg-color);cursor:pointer;transition:all .3s}
    .gallery-item:hover{transform:scale(1.05);border-color:var(--orange)}
    .gallery-item img{width:100%;height:100%;object-fit:cover}
    .video-wrap{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
      background:var(--bg-color);border:2px solid var(--border-color)}
    .video-wrap iframe{width:100%;height:100%;border:0}
    .map-wrap{width:100%;height:260px;border-radius:14px;overflow:hidden;
      background:var(--bg-color);border:2px solid var(--border-color)}
    .map-wrap iframe{width:100%;height:100%;border:0}
    .modal-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:16px;
      border-top:1.5px solid var(--border-color);margin-top:6px}
    .modal-actions a{flex:1;min-width:140px;display:inline-flex;align-items:center;
      justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;
      font-weight:800;font-size:.85rem;text-decoration:none;transition:all .2s}
    .modal-actions a.call{background:rgba(249,115,22,.1);color:var(--orange-dark);
      border:1.5px solid rgba(249,115,22,.3)}
    .modal-actions a.call:hover{background:var(--orange);color:#fff}
    .modal-actions a.map-btn{background:linear-gradient(135deg,#f97316,#ea580c);
      color:#fff;box-shadow:0 6px 18px rgba(249,115,22,.35)}
    .modal-actions a.map-btn:hover{transform:translateY(-2px)}

    /* ====== CHAT & KANGOUROU ====== */
    #chatWindow{position:fixed;bottom:110px;right:20px;z-index:1500;width:340px;
      max-height:480px;background:var(--card-bg);border-radius:18px;
      box-shadow:0 20px 50px rgba(0,0,0,.25);border:1.5px solid var(--border-color);
      display:none;flex-direction:column;overflow:hidden}
    #chatWindow.open{display:flex}
    @media(max-width:640px){#chatWindow{width:calc(100vw - 2rem);right:1rem;left:1rem}}
    .chat-header{background:linear-gradient(135deg,#f97316,#f59e0b);color:#fff;
      padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
    .chat-close-btn{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.25);
      border:none;color:#fff;cursor:pointer}
    #chatBody{padding:12px;overflow-y:auto;height:320px;display:flex;
      flex-direction:column;gap:8px;background:var(--bg-color)}
    .chat-input-wrap{padding:8px;border-top:1px solid var(--border-color);
      display:flex;gap:6px;background:var(--card-bg)}
    #chatInput{flex:1;padding:9px 12px;border:1.5px solid var(--border-color);
      border-radius:10px;outline:none;font-family:inherit;
      background:var(--bg-color);color:var(--text-main)}
    .chat-send-btn{background:var(--orange);color:#fff;border:none;padding:9px 14px;
      border-radius:10px;cursor:pointer}
    .mascot-container{position:fixed;bottom:22px;right:22px;z-index:1000;cursor:pointer}
    .mascot-kangaroo{width:70px;height:90px;
      filter:drop-shadow(0 10px 15px rgba(249,115,22,.3));transition:transform .3s}
    .mascot-kangaroo.jump{animation:kangarooJump .6s ease}
    @keyframes kangarooJump{0%,100%{transform:translateY(0)}30%{transform:translateY(-20px) scale(1.1) rotate(-8deg)}60%{transform:translateY(-10px) scale(1) rotate(5deg)}}
    @media(max-width:768px){
      .top-navbar{padding:8px 10px;border-radius:16px}
      .nav-title{font-size:.85rem}
    }
  </style>
</head>
<body>

  <div class="animated-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <nav class="top-navbar">
    <div class="nav-brand">
      <div class="nav-icon"><i class="fa-solid fa-utensils"></i></div>
      <div>
        <div class="nav-title">ENSTP <span>Resto</span></div>
        <div class="nav-subtitle" data-i18n="resto_title">المطاعم والمقاهي</div>
      </div>
    </div>
    <button class="nav-menu-btn" id="menuBtn" onclick="toggleMenu()"><i class="fa-solid fa-sliders"></i></button>
  </nav>

  <div class="nav-dropdown" id="navDropdown">
    <div class="dropdown-section">
      <div class="dropdown-label">🌐 <span data-i18n="menu_lang">اللغة</span></div>
      <div class="dropdown-row">
        <button class="dropdown-btn active" onclick="setLanguage('ar')" id="btn-ar">🇩🇿 العربية</button>
        <button class="dropdown-btn" onclick="setLanguage('fr')" id="btn-fr">🇫🇷 Français</button>
        <button class="dropdown-btn" onclick="setLanguage('en')" id="btn-en">🇬🇧 English</button>
      </div>
    </div>
    <div class="dropdown-section">
      <div class="dropdown-label">⚙️ <span data-i18n="menu_settings">الإعدادات</span></div>
      <div class="dropdown-row">
        <button class="dropdown-btn" onclick="toggleDarkMode()" id="themeBtn">
          <i class="fa-solid fa-moon"></i> <span data-i18n="menu_dark">ليلي</span>
        </button>
        <a href="index.html" class="dropdown-btn"><i class="fa-solid fa-house"></i> <span data-i18n="nav_home">الرئيسية</span></a>
      </div>
    </div>
  </div>

  <header class="page-hero">
    <h1><span data-i18n="hero_1">المطاعم</span> <span data-i18n="hero_2">والمقاهي</span></h1>
    <p data-i18n="hero_desc">اكتشف أفضل المطاعم والمقاهي القريبة من المدرسة.</p>
  </header>

  <main class="content-wrap">
    <div class="filters-bar">
      <button onclick="setFilter('all')" id="filter-all" class="filter-chip active">
        <i class="fa-solid fa-list"></i> <span data-i18n="filter_all">الكل</span>
      </button>
      <button onclick="setFilter('resto')" id="filter-resto" class="filter-chip">
        <i class="fa-solid fa-utensils"></i> <span data-i18n="filter_resto">مطاعم</span>
      </button>
      <button onclick="setFilter('cafe')" id="filter-cafe" class="filter-chip">
        <i class="fa-solid fa-mug-hot"></i> <span data-i18n="filter_cafe">مقاهي</span>
      </button>
    </div>
    <div id="itemsGrid"></div>
  </main>

  <!-- MODAL -->
  <div id="itemModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-header" style="padding-bottom:16px;margin-bottom:20px;border-bottom:1.5px solid var(--border-color);padding-left:50px;">
        <h2 id="modalTitle" style="font-size:1.5rem;font-weight:900;color:var(--text-main);margin:0 0 6px;"></h2>
        <div id="modalSubtitle" style="font-size:.85rem;color:var(--orange-dark);font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;"></div>
      </div>
      <div id="modalVideoContainer" class="modal-section" style="display:none;">
        <h4><i class="fa-brands fa-youtube" style="color:#ef4444;"></i> <span data-i18n="modal_video">فيديو تعريفي:</span></h4>
        <div id="modalVideo" class="video-wrap"></div>
      </div>
      <div id="modalMenuContainer" class="modal-section" style="display:none;">
        <h4><i class="fa-solid fa-images"></i> <span data-i18n="modal_gallery">معرض الصور:</span></h4>
        <div id="modalMenuGallery" class="gallery-scroll"></div>
      </div>
      <div class="modal-section">
        <h4><i class="fa-regular fa-clock" style="color:#3b82f6;"></i> <span data-i18n="label_hours">أوقات العمل:</span></h4>
        <div class="section-content" id="modalHours"></div>
      </div>
      <div id="modalDeliveryContainer" class="modal-section">
        <h4><i class="fa-solid fa-truck-fast" style="color:#10b981;"></i> <span data-i18n="label_delivery">خدمة التوصيل:</span></h4>
        <div class="section-content green" id="modalDelivery"></div>
      </div>
      <div id="modalTextMenuContainer" class="modal-section">
        <h4><i class="fa-solid fa-book-open" style="color:#10b981;"></i> <span data-i18n="label_menu">القائمة:</span></h4>
        <div class="section-content green" id="modalTextMenu"></div>
      </div>
      <div id="modalMapContainer" class="modal-section" style="display:none;">
        <h4><i class="fa-solid fa-map-location-dot"></i> <span data-i18n="label_map">الموقع على الخريطة:</span></h4>
        <div id="modalMap" class="map-wrap"></div>
      </div>
      <div class="modal-actions">

  <!-- ============ المنطق ============ -->
  <script>
    const data = window.RESTO_DATA;
    let currentFilter = 'all';

    // Dark mode
    const html = document.documentElement;
    if(localStorage.getItem('theme')==='dark') html.setAttribute('data-theme','dark');
    function toggleDarkMode(){
      html.setAttribute('data-theme', html.getAttribute('data-theme')==='dark'?'light':'dark');
      localStorage.setItem('theme', html.getAttribute('data-theme'));
    }
    function toggleMenu(){
      document.getElementById('navDropdown').classList.toggle('open');
      document.getElementById('menuBtn').classList.toggle('active');
    }
    document.addEventListener('click', e=>{
      const dd = document.getElementById('navDropdown');
      const btn = document.getElementById('menuBtn');
      if(!dd.contains(e.target) && !btn.contains(e.target)){
        dd.classList.remove('open'); btn.classList.remove('active');
      }
    });

    function setFilter(filter){
      currentFilter = filter;
      ['all','resto','cafe'].forEach(f=>{
        const b = document.getElementById('filter-'+f);
        if(b) b.classList.toggle('active', f === filter);
      });
      renderItems();
    }

    // ============ الكاروسيل التلقائي ============
    let carouselIntervals = [];
    function startCarousels(){
      carouselIntervals.forEach(i=>clearInterval(i));
      carouselIntervals = [];
      document.querySelectorAll('.cover-wrap[data-carousel]').forEach(wrap=>{
        const track = wrap.querySelector('.carousel-track');
        const dots = wrap.querySelectorAll('.carousel-dots span');
        const count = track.children.length;
        if(count <= 1) return;
        let idx = 0;
        const interval = setInterval(()=>{
          idx = (idx + 1) % count;
          track.style.transform = `translateX(-${idx*100}%)`;
          dots.forEach((d,i)=>d.classList.toggle('active', i===idx));
        }, 3000);
        carouselIntervals.push(interval);
      });
    }

    // ============ عرض البطاقات ============
    function renderItems(){
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      let items = [...data.items];
      if(currentFilter !== 'all') items = items.filter(i => i.category === currentFilter);

      if(items.length === 0){
        grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);font-weight:700;">${t('no_items')}</p>`;
        return;
      }

      items.forEach(item=>{
        // étoiles
        let starsHTML = '';
        for(let i=1;i<=5;i++){
          starsHTML += i<=Math.round(item.r) ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-regular fa-star"></i>';
        }

        // carrousel images
        let carouselHTML = '';
        if(item.menuImages && item.menuImages.length > 0){
          const imgs = item.menuImages.map(src=>`<img src="${src}" alt="${item.n}" onerror="this.style.display='none'">`).join('');
          const dots = item.menuImages.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('');
          carouselHTML = `
            <div class="cover-wrap" data-carousel>
              <div class="carousel-track">${imgs}</div>
              ${item.menuImages.length>1?`<div class="carousel-dots">${dots}</div>`:''}
              <div class="badge-top-right"><i class="fa-solid fa-camera"></i> ${item.menuImages.length}</div>
            </div>
          `;
        } else {
          carouselHTML = `
            <div class="cover-wrap">
              <div class="carousel-noimg"><i class="fa-solid ${item.category==='resto'?'fa-utensils':'fa-mug-hot'}"></i></div>
              <div class="badge-top-right"><i class="fa-solid fa-camera"></i> 0</div>
            </div>
          `;
        }

        // catégorie + prix
        const catLabel = item.category==='resto' ? t('filter_resto') : t('filter_cafe');
        const priceStr = item.p===1?'$':item.p===2?'$$':item.p===3?'$$$':'';
        const distStr = item.dist!==null ? `${item.dist} km` : '';
        const menuText = item.menu && item.menu[currentLang] ? item.menu[currentLang] : '';
        const hoursStr = item.h && item.h.length>0 ? item.h.map(h=>`${h[0]} - ${h[1]}`).join(' | ') : '';

        const card = document.createElement('div');
        card.className = 'resto-card-new';
        card.innerHTML = `
          ${carouselHTML}
          <div class="card-body-new">
            <h3 class="place-title-new">${item.n}</h3>
            <div class="category-tag">${catLabel}</div>
            ${priceStr?`<div class="price-tag">${priceStr} ${item.price||''}</div>`:''}
            ${distStr?`<div style="display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:.9rem;font-weight:700;"><i class="fa-solid fa-location-dot"></i> ${distStr}</div>`:''}
            ${menuText?`<p class="desc-new">${menuText}</p>`:''}
            <div class="rating-row">
              <div class="stars-display">${starsHTML}</div>
              <span>${item.r}/5</span>
            </div>
            ${item.t?`<a href="tel:${item.t}" class="phone-row" onclick="event.stopPropagation();"><i class="fa-solid fa-phone"></i> ${item.t}</a>`:''}
            ${item.delivery?`<div class="badge-cheap"><i class="fa-solid fa-truck-fast"></i> ${t('delivery_yes')}</div>`:''}
            ${hoursStr?`<div class="hours-row"><i class="fa-regular fa-clock"></i> ${t('hours')} : ${hoursStr}</div>`:''}

            <!-- التعليقات الحرة -->
            <div class="reviews-box">
              <div class="reviews-header">
                <div class="reviews-title">
                  <i class="fa-solid fa-comments"></i> ${t('reviews')}
                  <span class="reviews-count-badge" id="count-${safeId(item.n)}">0</span>
                </div>
              </div>
              <div class="comments-list-inline" id="list-${safeId(item.n)}"></div>
              <div class="comment-form-inline">
                <div class="input-row">
                  <input type="text" id="name-${safeId(item.n)}" placeholder="${t('your_name')}" maxlength="30">
                </div>
                <div class="input-row">
                  <input type="text" id="cmt-${safeId(item.n)}" placeholder="${t('add_comment')}" maxlength="200">
                  <button onclick="addComment(event,'${escapeAttr(item.n)}')">${t('send')}</button>
                </div>
              </div>
            </div>

            <div style="display:flex;gap:6px;margin-top:6px;">
              <button onclick="openModalByIndex(${data.items.indexOf(item)})" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--orange);background:transparent;color:var(--orange);font-weight:800;font-family:inherit;cursor:pointer;font-size:.8rem;">
                <i class="fa-solid fa-eye"></i> ${t('btn_details')}
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      // charger les commentaires + démarrer carrousels
      items.forEach(item=>loadComments(item.n));
      startCarousels();
    }

    function safeId(name){ return name.replace(/[^a-zA-Z0-9]/g,'_'); }
    function escapeAttr(s){ return s.replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
    function openModalByIndex(i){ openModal(data.items[i]); }

    // ============ التعليقات الحرة ============
    function loadComments(itemName){
      const sid = safeId(itemName);
      const list = document.getElementById('list-'+sid);
      const badge = document.getElementById('count-'+sid);
      if(!list) return;
      const saved = JSON.parse(localStorage.getItem('comments_'+sid) || '[]');
      if(badge) badge.innerText = saved.length;
      if(saved.length === 0){
        list.innerHTML = `<p class="no-comments">${t('no_comments')}</p>`;
        return;
      }
      list.innerHTML = saved.map(c=>`<div class="comment-item"><strong>${c.name||'👤'}:</strong> ${c.text}</div>`).join('');
    }

    function addComment(e, itemName){
      if(e) e.stopPropagation();
      const sid = safeId(itemName);
      const nameEl = document.getElementById('name-'+sid);
      const cmtEl = document.getElementById('cmt-'+sid);
      if(!cmtEl || !cmtEl.value.trim()) return;
      const saved = JSON.parse(localStorage.getItem('comments_'+sid) || '[]');
      saved.push({
        name: (nameEl && nameEl.value.trim()) || '👤',
        text: cmtEl.value.trim(),
        date: new Date().toISOString()
      });
      localStorage.setItem('comments_'+sid, JSON.stringify(saved));
      if(cmtEl) cmtEl.value = '';
      if(nameEl) nameEl.value = '';
      loadComments(itemName);
    }

    // ============ MODAL ============
    function openModal(item){
      const modal = document.getElementById('itemModal');
      modal.classList.add('open');
      document.getElementById('modalTitle').innerText = item.n;
      document.getElementById('modalSubtitle').innerHTML = `
        <span>${item.category==='resto'?t('filter_resto'):t('filter_cafe')}</span>
        <span class="rating-badge" style="display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;padding:4px 9px;border-radius:8px;font-size:.75rem;font-weight:900;">
          <i class="fa-solid fa-star"></i> ${item.r}
        </span>
      `;
      document.getElementById('modalHours').innerText =
        item.h && item.h.length>0 ? item.h.map(h=>`${h[0]} - ${h[1]}`).join(' | ') : '-';

      const dc = document.getElementById('modalDeliveryContainer');
      if(item.delivery){
        dc.style.display='block';
        document.getElementById('modalDelivery').innerHTML = `<span style="color:#10b981;font-weight:800;"><i class="fa-solid fa-check-circle"></i> ${t('delivery_yes')}</span>${item.deliveryInfo?' — '+item.deliveryInfo:''}`;
      } else { dc.style.display='none'; }

      const tmc = document.getElementById('modalTextMenuContainer');
      const menuText = item.menu && item.menu[currentLang] ? item.menu[currentLang] : '';
      if(menuText){ tmc.style.display='block'; document.getElementById('modalTextMenu').innerText = menuText; }
      else tmc.style.display='none';

      const vc = document.getElementById('modalVideoContainer');
      const vd = document.getElementById('modalVideo');
      if(item.video){
        vc.style.display='block';
        vd.innerHTML = `<iframe src="https://www.youtube.com/embed/${item.video}" allowfullscreen></iframe>`;
      } else vc.style.display='none';

      const mc = document.getElementById('modalMenuContainer');
      const mg = document.getElementById('modalMenuGallery');
      mg.innerHTML = '';
      if(item.menuImages && item.menuImages.length>0){
        mc.style.display='block';
        item.menuImages.forEach(img=>{
          mg.innerHTML += `<div class="gallery-item" onclick="window.open('${img}','_blank')"><img src="${img}" onerror="this.parentElement.innerHTML='<div style=\\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:.75rem;\\'>Image N/A</div>'"></div>`;
        });
      } else mc.style.display='none';

      const mapc = document.getElementById('modalMapContainer');
      const mapd = document.getElementById('modalMap');
      if(item.g){
        mapc.style.display='block';
        mapd.innerHTML = `<iframe src="https://www.google.com/maps?q=${item.g[0]},${item.g[1]}&output=embed" allowfullscreen loading="lazy"></iframe>`;
      } else mapc.style.display='none';

      const pb = document.getElementById('modalPhoneBtn');
      if(item.t){ pb.href = `tel:${item.t}`; pb.style.display='flex'; } else pb.style.display='none';
      const mb = document.getElementById('modalMapBtn');
      if(item.g){ mb.href = `https://www.google.com/maps/search/?api=1&query=${item.g[0]},${item.g[1]}`; mb.style.display='flex'; } else mb.style.display='none';

      document.querySelector('.modal-card').scrollTop = 0;
    }

    function closeModal(){ document.getElementById('itemModal').classList.remove('open'); }
    document.getElementById('itemModal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

    // ============ CHAT ============
    function toggleChat(){ document.getElementById('chatWindow').classList.toggle('open'); }
    function sendMessage(){
      const input = document.getElementById('chatInput');
      const body = document.getElementById('chatBody');
      if(!input || !body) return;
      const msg = input.value.trim(); if(!msg) return;
      body.innerHTML += `<div style="display:flex;justify-content:flex-end;"><div style="background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;padding:9px 13px;border-radius:12px 12px 4px 12px;max-width:80%;font-size:.82rem;font-weight:600;">${msg}</div></div>`;
      input.value='';
      body.scrollTop = body.scrollHeight;
      setTimeout(()=>{
        let reply = t('chat_default');
        const m = msg.toLowerCase();
        if(m.includes("مطعم")||m.includes("مقهى")||m.includes("resto")||m.includes("cafe")||m.includes("eat")) reply = "🍽️ " + t('chat_resto');
        else if(m.includes("سلام")||m.includes("مرحبا")||m.includes("hello")||m.includes("bonjour")) reply = "👋 " + t('chat_hello');
        else if(m.includes("شكرا")||m.includes("merci")||m.includes("thanks")) reply = "💛 " + t('chat_thanks');
        body.innerHTML += `<div style="display:flex;justify-content:flex-start;"><div style="background:rgba(249,115,22,.12);color:var(--orange-dark);padding:9px 13px;border-radius:12px 12px 12px 4px;max-width:80%;font-size:.82rem;font-weight:600;">${reply}</div></div>`;
        body.scrollTop = body.scrollHeight;
      }, 500);
    }

    // ============ KANGOUROU ============
    const kangarooContainer = document.getElementById('kangarooContainer');
    const kangarooSvg = document.getElementById('kangarooSvg');
    if(kangarooContainer){
      kangarooContainer.addEventListener('click', ()=>{
        if(kangarooSvg){
          kangarooSvg.classList.remove('jump');
          void kangarooSvg.offsetHeight;
          kangarooSvg.classList.add('jump');
          setTimeout(()=>kangarooSvg.classList.remove('jump'), 700);
        }
        toggleChat();
      });
    }

    // ============ INIT ============
    document.addEventListener('DOMContentLoaded', ()=>{
      const saved = localStorage.getItem('enstp_lang') || 'ar';
      currentLang = saved;
      document.querySelectorAll('.dropdown-btn').forEach(b=>b.classList.remove('active'));
      const b = document.getElementById('btn-'+saved); if(b) b.classList.add('active');
      applyRestoTranslation(saved);
      renderItems();
      const ci = document.getElementById('chatInput');
      if(ci) ci.addEventListener('keypress', e=>{ if(e.key==='Enter'){ e.preventDefault(); sendMessage(); } });
    });
  </script>
</body>
</html>
