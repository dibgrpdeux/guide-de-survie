    function setTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('enstp_theme', themeName);
    }

    function setFontSize(size) {
      document.documentElement.setAttribute('data-size', size);
      localStorage.setItem('enstp_size', size);
    }

    function setLanguage(lang) {
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      
      ['fr', 'ar', 'en'].forEach(l => {
        // FIXED: Added backticks around the template literal
        const btn = document.getElementById(`lang-${l}`);
        if (l === lang) {
          btn.className = "px-2 py-1 rounded-lg font-bold transition bg-white text-gray-900 shadow-xs";
        } else {
          btn.className = "px-2 py-1 rounded-lg font-bold transition text-gray-500 hover:text-gray-900";
        }
      });

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          // Changed to innerHTML to support <br/> in the hero title
          el.innerHTML = translations[lang][key]; 
        }
      });

      localStorage.setItem('enstp_lang', lang);
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTheme(localStorage.getItem('enstp_theme') || 'indigo');
      setFontSize(localStorage.getItem('enstp_size') || 'normal');
      setLanguage(localStorage.getItem('enstp_lang') || 'fr');
    });
