<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- كود الترجمة -->
  <script src="translate.js"></script>
  <style>
    body { top: 0 !important; }
    .skiptranslate iframe { display: none !important; }
    .goog-te-banner-frame { display: none !important; }
    #goog-gt-tt { display: none !important; }
    #google_translate_element { display: none; } 
    .lang-btn { background: transparent; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.2s; color: #64748b; }
    .lang-btn:hover { background: #f1f5f9; color: #1e293b; }
    .lang-btn.active { background: #4f46e5; color: white; }
  </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التسوق والمطاعم - ENSTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style> 
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; } 
    .gallery-scroll::-webkit-scrollbar { height: 6px; }
    .gallery-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen">

  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <h1 class="font-bold text-gray-900 text-lg"><i class="fa-solid fa-store text-indigo-600"></i> المطاعم والتسوق</h1>
      <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-xs font-bold">الرئيسية</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
    <div id="categoriesBar" class="flex flex-wrap gap-2"></div>
    <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <!-- نافذة التفاصيل -->
  <div id="itemModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-4xl w-full p-6 lg:p-8 space-y-6 shadow-2xl relative max-h-[95vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 flex items-center justify-center transition z-20"><i class="fa-solid fa-xmark text-lg"></i></button>
      
      <div class="border-b pb-4 pr-10">
        <h2 id="modalTitle" class="text-2xl font-black text-gray-900"></h2>
        <p id="modalSubtitle" class="text-sm text-indigo-600 font-bold mt-1"></p>
      </div>

      <!-- معرض صور القائمة -->
      <div id="modalMenuContainer" class="space-y-2 hidden">
        <h4 class="font-bold text-gray-900 text-sm"><i class="fa-solid fa-images text-indigo-500 mr-1.5"></i> صور قائمة الطعام (Menu):</h4>
        <div id="modalMenuGallery" class="flex overflow-x-auto gap-3 pb-2 gallery-scroll snap-x"></div>
      </div>

      <div class="space-y-4 text-sm text-gray-700 leading-relaxed">
        <div>
          <h4 class="font-bold text-gray-900 text-sm mb-1"><i class="fa-regular fa-clock text-gray-500 mr-1.5"></i> أوقات العمل:</h4>
          <p id="modalHours" class="bg-gray-50 p-3 rounded-xl border border-gray-100"></p>
        </div>
        <div id="modalTextMenuContainer">
          <h4 class="font-bold text-gray-900 text-sm mb-1"><i class="fa-solid fa-book-open text-emerald-500 mr-1.5"></i> قائمة الطعام والأسعار (نصية):</h4>
          <p id="modalTextMenu" class="bg-emerald-50/60 p-3 rounded-xl border border-emerald-100"></p>
        </div>
      </div>

      <div class="flex gap-2 pt-4 border-t border-gray-100">
        <a id="modalPhoneBtn" href="#" class="hidden flex-1 bg-gray-100 hover:bg-gray-200 text-center py-3 rounded-xl font-bold text-gray-700"><i class="fa-solid fa-phone"></i> اتصل</a>
        <a id="modalMapBtn" href="#" target="_blank" class="hidden flex-1 bg-indigo-50 hover:bg-indigo-100 text-center py-3 rounded-xl font-bold text-indigo-700"><i class="fa-solid fa-map-location-dot"></i> الموقع على الخريطة</a>
        <button id="modalVideoBtn" onclick="openVideo()" class="hidden bg-red-50 hover:bg-red-100 text-red-600 px-4 py-3 rounded-xl font-bold"><i class="fa-brands fa-youtube"></i></button>
      </div>
    </div>
  </div>

  <script src="data/shopping.js"></script>
  
  <script>
    const data = window.SHOP_DATA;
    let currentCat = 'manger';
    let currentVideoId = '';

    function renderCategories() {
      const bar = document.getElementById('categoriesBar');
      bar.innerHTML = '';
      Object.keys(data.cats).forEach(key => {
        if (data.items.some(i => i.c === key)) {
          const cat = data.cats[key];
          const btn = document.createElement('button');
          btn.className = `px-4 py-2 rounded-xl font-bold text-sm transition ${key === currentCat ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-gray-600 border hover:bg-gray-50'}`;
          btn.innerText = cat.icon + ' ' + cat.ar;
          btn.onclick = () => { currentCat = key; renderCategories(); renderItems(); };
          bar.appendChild(btn);
        }
      });
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      const items = data.items.filter(i => i.c === currentCat);
      
      if (items.length === 0) {
        grid.innerHTML = '<p class="text-center text-gray-500 col-span-full py-10">لا توجد عناصر في هذا القسم.</p>';
        return;
      }

      items.forEach(item => {
        let priceStr = item.p === 1 ? '($)' : item.p === 2 ? '($$)' : item.p === 3 ? '($$$)' : '';
        const distStr = item.dist !== null ? `${item.dist} كم` : '';

        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition cursor-pointer";
        card.onclick = () => openModal(item);
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg text-gray-900">${item.n}</h3>
              <div class="flex gap-1 text-xs font-bold text-amber-500 bg-amber-50 px-2 py-1 rounded"><i class="fa-solid fa-star"></i> ${item.r}</div>
            </div>
            <div class="flex flex-wrap gap-2 text-xs text-gray-600 mb-3">
              ${distStr ? `<span class="bg-gray-100 px-2 py-1 rounded"><i class="fa-solid fa-location-dot text-indigo-500 mr-1"></i> ${distStr}</span>` : ''}
              ${priceStr ? `<span class="bg-gray-100 px-2 py-1 rounded"><i class="fa-solid fa-money-bill text-emerald-500 mr-1"></i> ${priceStr}</span>` : ''}
            </div>
            <p class="text-sm text-gray-600 line-clamp-2">${item.note}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-gray-100 text-center text-xs font-bold text-indigo-600">
            <i class="fa-solid fa-eye"></i> عرض التفاصيل والقائمة
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(item) {
      document.getElementById('itemModal').classList.remove('hidden');
      document.getElementById('modalTitle').innerText = item.n;
      document.getElementById('modalSubtitle').innerText = `الفئة: ${data.cats[item.c].ar} | التقييم: ${item.r} ⭐`;
      
      let hoursStr = 'غير محدد';
      if (item.h && item.h.length > 0) {
        hoursStr = item.h.map(h => `${h[0]} - ${h[1]}`).join(' | ');
      }
      document.getElementById('modalHours').innerText = hoursStr;

      const textMenuContainer = document.getElementById('modalTextMenuContainer');
      if (item.menu) {
        textMenuContainer.classList.remove('hidden');
        document.getElementById('modalTextMenu').innerText = item.menu;
      } else {
        textMenuContainer.classList.add('hidden');
      }

      const menuContainer = document.getElementById('modalMenuContainer');
      const menuGallery = document.getElementById('modalMenuGallery');
      menuGallery.innerHTML = '';
      if (item.menuImages && item.menuImages.length > 0) {
        menuContainer.classList.remove('hidden');
        item.menuImages.forEach(img => {
          menuGallery.innerHTML += `<div class="flex-shrink-0 w-64 h-80 snap-center rounded-xl overflow-hidden border border-gray-200 bg-gray-50"><img src="${img}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-gray-400 text-xs p-2 text-center\\'>الصورة غير متوفرة<br>${img}</div>'"></div>`;
        });
      } else {
        menuContainer.classList.add('hidden');
      }

      const phoneBtn = document.getElementById('modalPhoneBtn');
      if (item.t) {
        phoneBtn.href = `tel:${item.t}`;
        phoneBtn.classList.remove('hidden');
      } else { phoneBtn.classList.add('hidden'); }

      const mapBtn = document.getElementById('modalMapBtn');
      if (item.g) {
        mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${item.g[0]},${item.g[1]}`;
        mapBtn.classList.remove('hidden');
      } else { mapBtn.classList.add('hidden'); }

      const videoBtn = document.getElementById('modalVideoBtn');
      if (item.video) {
        currentVideoId = item.video;
        videoBtn.classList.remove('hidden');
      } else { videoBtn.classList.add('hidden'); }

      document.querySelector('#itemModal > div').scrollTop = 0;
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function openVideo() {
      if (!currentVideoId) return;
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4";
      modal.innerHTML = `
        <div class="bg-white rounded-2xl overflow-hidden w-full max-w-3xl relative">
          <button onclick="this.parentElement.parentElement.remove()" class="absolute top-2 right-2 bg-white/80 w-8 h-8 rounded-full flex items-center justify-center text-gray-800 z-10"><i class="fa-solid fa-xmark"></i></button>
          <div class="relative pt-[56.25%] h-0">
            <iframe src="https://www.youtube.com/embed/${currentVideoId}" class="absolute inset-0 w-full h-full" allowfullscreen></iframe>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof window.SHOP_DATA === 'undefined') {
        document.getElementById('itemsGrid').innerHTML = '<p class="text-red-500 font-bold text-center col-span-full">خطأ: لم يتم تحميل ملف shopping.js.</p>';
        return;
      }
      renderCategories();
      renderItems();
    });
  </script>
</body>
</html>
