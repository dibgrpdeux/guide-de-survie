<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التسوق والمطاعم - ENSTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style> 
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; } 
  </style>
</head>
<body class="min-h-screen">

  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <h1 class="font-bold text-gray-900 text-lg"><i class="fa-solid fa-store text-indigo-600"></i> المطاعم والتسوق</h1>
      <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-xs font-bold">الرئيسية</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
    
    <!-- شريط التصنيفات -->
    <div id="categoriesBar" class="flex flex-wrap gap-2"></div>

    <!-- شريط الفرز -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between flex-wrap gap-2">
      <span class="text-sm font-bold text-gray-700"><i class="fa-solid fa-sort text-indigo-500"></i> فرز حسب:</span>
      <div class="flex gap-2">
        <button onclick="setSort('default')" id="sort-default" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white">الافتراضي</button>
        <button onclick="setSort('dist')" id="sort-dist" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200">المسافة (الأقرب)</button>
        <button onclick="setSort('price')" id="sort-price" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200">السعر (الأرخص)</button>
        <button onclick="setSort('rating')" id="sort-rating" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200">التقييم (الأعلى)</button>
      </div>
    </div>

    <!-- عرض البطاقات -->
    <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <!-- ربط ملف البيانات -->
  <script src="data/shopping.js"></script>
  
  <script>
    const data = window.SHOP_DATA;
    let currentCat = 'manger';
    let currentSort = 'default'; // default, dist, price, rating

    function renderCategories() {
      const bar = document.getElementById('categoriesBar');
      bar.innerHTML = '';
      Object.keys(data.cats).forEach(key => {
        if (data.items.some(i => i.c === key)) {
          const cat = data.cats[key];
          const btn = document.createElement('button');
          btn.className = `px-4 py-2 rounded-xl font-bold text-sm transition ${key === currentCat ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-gray-600 border hover:bg-gray-50'}`;
          btn.innerText = cat.icon + ' ' + cat.ar;
          btn.onclick = () => { currentCat = key; renderCategories(); renderItems(); };
          bar.appendChild(btn);
        }
      });
    }

    function setSort(type) {
      currentSort = type;
      // تحديث تصميم الأزرار
      ['default', 'dist', 'price', 'rating'].forEach(t => {
        const btn = document.getElementById(`sort-${t}`);
        if (t === type) btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white";
        else btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200";
      });
      renderItems();
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      
      let items = data.items.filter(i => i.c === currentCat);
      
      // تطبيق الفرز
      if (currentSort === 'dist') {
        items.sort((a, b) => (a.dist || 999) - (b.dist || 999));
      } else if (currentSort === 'price') {
        items.sort((a, b) => a.p - b.p); // السعر الأقل أولاً
      } else if (currentSort === 'rating') {
        items.sort((a, b) => b.r - a.r); // التقييم الأعلى أولاً
      }

      if (items.length === 0) {
        grid.innerHTML = '<p class="text-center text-gray-500 col-span-full py-10">لا توجد عناصر في هذا القسم.</p>';
        return;
      }

      items.forEach(item => {
        let priceStr = item.p === 1 ? 'مقبول ($)' : item.p === 2 ? 'متوسط ($$)' : item.p === 3 ? 'غالي ($$$)' : 'غير محدد';
        const distStr = item.dist !== null ? `${item.dist} كم` : 'غير محدد';
        
        let hoursStr = '';
        if (item.h && item.h.length > 0) {
          hoursStr = item.h.map(h => `${h[0]} - ${h[1]}`).join(' | ');
        }

        // تحويل النص إلى قائمة منسقة
        let menuHTML = '';
        if (item.menu) {
          menuHTML = `<div class="mt-2 text-xs bg-indigo-50 text-indigo-900 p-2 rounded-lg border border-indigo-100"><strong class="block mb-1"><i class="fa-solid fa-book-open"></i> القائمة والأسعار:</strong> ${item.menu}</div>`;
        }

        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg text-gray-900">${item.n}</h3>
              <div class="flex gap-1 text-xs font-bold text-amber-500 bg-amber-50 px-2 py-1 rounded">
                <i class="fa-solid fa-star"></i> ${item.r}
              </div>
            </div>
            
            <div class="flex flex-wrap gap-2 text-xs text-gray-600 mb-3">
              <span class="bg-gray-100 px-2 py-1 rounded"><i class="fa-solid fa-location-dot text-indigo-500 mr-1"></i> ${distStr}</span>
              <span class="bg-gray-100 px-2 py-1 rounded"><i class="fa-solid fa-money-bill text-emerald-500 mr-1"></i> ${priceStr}</span>
            </div>

            <div class="space-y-2 text-sm text-gray-700">
              <p><i class="fa-regular fa-clock text-gray-400 mr-1"></i> ${hoursStr || 'أوقات غير محددة'}</p>
              ${menuHTML}
              ${item.note ? `<p class="text-xs text-gray-500 italic mt-1">${item.note}</p>` : ''}
            </div>
          </div>

          <div class="mt-4 pt-3 border-t border-gray-100 flex gap-2">
            ${item.t ? `<a href="tel:${item.t}" class="flex-1 bg-gray-100 hover:bg-gray-200 text-center py-2 rounded-lg text-xs font-bold text-gray-700"><i class="fa-solid fa-phone"></i> اتصل</a>` : ''}
            ${item.g ? `<a href="https://www.google.com/maps/search/?api=1&query=${item.g[0]},${item.g[1]}" target="_blank" class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-center py-2 rounded-lg text-xs font-bold text-indigo-700"><i class="fa-solid fa-map-location-dot"></i> الخريطة</a>` : ''}
            ${item.video ? `<button onclick="openVideo('${item.video}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-lg text-xs font-bold"><i class="fa-brands fa-youtube"></i></button>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openVideo(videoId) {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4";
      modal.innerHTML = `
        <div class="bg-white rounded-2xl overflow-hidden w-full max-w-2xl relative">
          <button onclick="this.parentElement.parentElement.remove()" class="absolute top-2 right-2 bg-white/80 w-8 h-8 rounded-full flex items-center justify-center text-gray-800 z-10"><i class="fa-solid fa-xmark"></i></button>
          <div class="relative pt-[56.25%] h-0">
            <iframe src="https://www.youtube.com/embed/${videoId}" class="absolute inset-0 w-full h-full" allowfullscreen></iframe>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof window.SHOP_DATA === 'undefined') {
        document.getElementById('itemsGrid').innerHTML = '<p class="text-red-500 font-bold text-center col-span-full">خطأ: لم يتم تحميل ملف shopping.js بشكل صحيح.</p>';
        return;
      }
      renderCategories();
      renderItems();
    });
  </script>
</body>
</html>
