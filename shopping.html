  <style> 
    body { font-family: 'Cairo', sans-serif; background: #fff7ed; transition: background-color 0.4s, color 0.4s; }
    html.dark body { background: #1a1410; color: #f8fafc; }
    
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(249, 115, 22, 0.15); transition: all 0.3s ease; }
    html.dark .glass-card { background: rgba(30, 20, 15, 0.95); border-color: rgba(249, 115, 22, 0.2); }
    
    .gallery-scroll { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .gallery-scroll::-webkit-scrollbar { height: 6px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: #fdba74; border-radius: 10px; }
    .gallery-item { flex: 0 0 auto; width: 240px; height: 160px; scroll-snap-align: start; border-radius: 0.75rem; overflow: hidden; border: 1px solid #e2e8f0; background: #f8fafc; cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .gallery-item:hover { transform: scale(1.05); box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.3); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    .lang-btn { background: transparent; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: #64748b; transition: 0.2s; }
    .lang-btn:hover { background: #ffedd5; color: #9a3412; }
    .lang-btn.active { background: #f97316; color: white; }

    .filter-btn { transition: all 0.3s ease; }
    .filter-btn.active { background: #f97316; color: white; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); }

    .card-cover { width: 100%; height: 180px; object-fit: cover; border-radius: 1rem 1rem 0 0; transition: transform 0.4s ease; }
    .glass-card:hover .card-cover { transform: scale(1.05); }

    /* Chat window */
    #chatWindow { position: fixed; bottom: 110px; right: 20px; z-index: 1001; width: 320px; max-height: 420px; background: white; border-radius: 1rem; box-shadow: 0 20px 50px rgba(0,0,0,0.25); border: 1px solid #fed7aa; display: none; flex-direction: column; }
    #chatWindow.open { display: flex; }
    html.dark #chatWindow { background: #1e293b; border-color: #334155; color: #f8fafc; }
    @media (max-width: 640px) { #chatWindow { width: calc(100vw - 2rem); right: 1rem; left: 1rem; } }

    @keyframes kangarooJump { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-20px) scale(1.1) rotate(-8deg); } 60% { transform: translateY(-10px) scale(1) rotate(5deg); } }

    button, a, .glass-card { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #f97316 !important; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15) !important; }
  </style>

        { c: "beaute", n: "Salon El-Wafa", r: 4.6, p: 2, dist: 0.9, h: [["09:00", "21:00"]], t: "", g: [36.7260, 3.0720], video: "", menu: { ar: "حلاقة رجالية", fr: "Coiffure homme", en: "Men's haircut" }, menuImages: [] }

  </script>
    <script>
    const data = window.SHOP_DATA;
    let currentCat = 'pharma';
    let currentSort = 'default';
    let currentLang = localStorage.getItem('enstp_lang') || 'ar';

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    function t(key) {
      const dict = window.SHOPPING_TRANSLATIONS[currentLang] || window.SHOPPING_TRANSLATIONS.ar;
      return dict[key] || key;
    }

    window.SHOPPING_TRANSLATIONS = {
      ar: {
        page_title: "التسوق والخدمات - ENSTP", nav_home: "الرئيسية",
        shop_title: "التسوق والخدمات اليومية",
        sort_by: "فرز حسب:", sort_default: "الافتراضي", sort_dist: "المسافة", sort_price: "السعر", sort_rating: "التقييم",
        shop_hours: "أوقات العمل:", shop_extra: "تفاصيل إضافية:",
        label_map: "الموقع على الخريطة:", modal_video: "فيديو تعريفي:", modal_gallery: "معرض الصور:",
        btn_call: "اتصل", btn_map: "فتح الخريطة", btn_details: "عرض التفاصيل",
        no_items: "لا توجد عناصر في هذا القسم.",
        chat_title: "المساعد الافتراضي", chat_welcome: "مرحباً! 👋 كيف يمكنني مساعدتك؟",
        chat_placeholder: "اكتب سؤالك...", chat_default: "شكراً!",
        chat_hello: "أهلاً!", chat_thanks: "على الرحب والسعة!",
        chat_shopping: "تصفح المتاجر والخدمات في هذه الصفحة."
      },
      fr: {
        page_title: "Shopping et services - ENSTP", nav_home: "Accueil",
        shop_title: "Shopping et services",
        sort_by: "Trier par :", sort_default: "Par défaut", sort_dist: "Distance", sort_price: "Prix", sort_rating: "Note",
        shop_hours: "Horaires :", shop_extra: "Détails :",
        label_map: "Emplacement :", modal_video: "Vidéo :", modal_gallery: "Galerie :",
        btn_call: "Appeler", btn_map: "Ouvrir la carte", btn_details: "Voir détails",
        no_items: "Aucun élément dans cette catégorie.",
        chat_title: "Assistant virtuel", chat_welcome: "Bonjour ! 👋 Comment puis-je vous aider ?",
        chat_placeholder: "Votre question...", chat_default: "Merci !",
        chat_hello: "Bienvenue !", chat_thanks: "Avec plaisir !",
        chat_shopping: "Parcourez les commerces sur cette page."
      },
      en: {
        page_title: "Shopping & Services - ENSTP", nav_home: "Home",
        shop_title: "Shopping & Daily Services",
        sort_by: "Sort by:", sort_default: "Default", sort_dist: "Distance", sort_price: "Price", sort_rating: "Rating",
        shop_hours: "Hours:", shop_extra: "Additional details:",
        label_map: "Location:", modal_video: "Video:", modal_gallery: "Gallery:",
        btn_call: "Call", btn_map: "Open map", btn_details: "View details",
        no_items: "No items in this category.",
        chat_title: "Virtual Assistant", chat_welcome: "Hello! 👋 How can I help you?",
        chat_placeholder: "Your question...", chat_default: "Thanks!",
        chat_hello: "Welcome!", chat_thanks: "You're welcome!",
        chat_shopping: "Browse shops on this page."
      }
    };

    window.applyShoppingTranslation = function(lang) {
      const dict = window.SHOPPING_TRANSLATIONS[lang] || window.SHOPPING_TRANSLATIONS.ar;
      if (dict.page_title) document.title = dict.page_title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          const icon = el.querySelector('i');
          if (icon) { el.innerHTML = ''; el.appendChild(icon); el.appendChild(document.createTextNode(' ' + dict[key])); }
          else el.innerText = dict[key];
        }
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (dict[key]) el.placeholder = dict[key];
      });
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;
      if (typeof renderCategories === 'function') renderCategories();
      if (typeof renderItems === 'function') renderItems();
    };

    window.setLanguage = function(lang) {
      currentLang = lang;
      localStorage.setItem('enstp_lang', lang);
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + lang);
      if (activeBtn) activeBtn.classList.add('active');
      window.applyShoppingTranslation(lang);
    };

    function renderCategories() {
      const bar = document.getElementById('categoriesBar');
      bar.innerHTML = '';
      Object.keys(data.cats).forEach(key => {
        if (data.items.some(i => i.c === key)) {
          const cat = data.cats[key];
          const btn = document.createElement('button');
          btn.className = `filter-btn px-4 py-2 rounded-xl font-bold text-sm border border-orange-200 dark:border-slate-700 ${key === currentCat ? 'active' : 'bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300'}`;
          btn.innerHTML = `${cat.icon} ${cat.title[currentLang] || cat.title.ar}`;
          btn.onclick = () => { currentCat = key; renderCategories(); renderItems(); };
          bar.appendChild(btn);
        }
      });
    }

    function setSort(type) {
      currentSort = type;
      ['default', 'dist', 'price', 'rating'].forEach(tp => {
        const btn = document.getElementById(`sort-${tp}`);
        if (tp === type) btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-orange-500 text-white";
        else btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200";
      });
      renderItems();
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      let items = data.items.filter(i => i.c === currentCat);
      if (currentSort === 'dist') items.sort((a, b) => (a.dist || 999) - (b.dist || 999));
      else if (currentSort === 'price') items.sort((a, b) => a.p - b.p);
      else if (currentSort === 'rating') items.sort((a, b) => b.r - a.r);

      if (items.length === 0) {
        grid.innerHTML = `<p class="text-center text-gray-500 col-span-full py-10">${t('no_items')}</p>`;
        return;
      }

      items.forEach(item => {
        let priceStr = item.p === 1 ? '($)' : item.p === 2 ? '($$)' : item.p === 3 ? '($$$)' : '';
        const distStr = item.dist !== null ? `${item.dist} km` : '';
        const menuText = item.menu && item.menu[currentLang] ? item.menu[currentLang] : '';

        const coverImage = item.menuImages && item.menuImages.length > 0 ? item.menuImages[0] : null;
        let imageHTML = '';
        if (coverImage) {
          imageHTML = `<div class="overflow-hidden rounded-t-2xl"><img src="${coverImage}" alt="${item.n}" class="card-cover" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-44 flex items-center justify-center bg-orange-50 dark:bg-slate-800 text-orange-300 text-3xl\\'><i class=\\'fa-solid fa-image\\'></i></div>'"></div>`;
        } else {
          imageHTML = `<div class="w-full h-44 flex items-center justify-center bg-orange-50 dark:bg-slate-800 text-orange-300 text-3xl rounded-t-2xl"><i class="fa-solid fa-image"></i></div>`;
        }

        const card = document.createElement('div');
        card.className = "glass-card rounded-2xl flex flex-col justify-between hover:shadow-lg hover:border-orange-300 transition cursor-pointer border border-orange-100 dark:border-slate-700 overflow-hidden";
        card.onclick = () => openModal(item);
        card.innerHTML = `
          ${imageHTML}
          <div class="p-4 flex flex-col justify-between flex-grow">
            <div>
              <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-lg text-gray-900 dark:text-white">${item.n}</h3>
                <div class="flex gap-1 text-xs font-bold text-amber-500 bg-amber-50 dark:bg-amber-900/20 px-2 py-1 rounded"><i class="fa-solid fa-star"></i> ${item.r}</div>
              </div>
              <div class="flex flex-wrap gap-2 text-xs text-gray-600 dark:text-gray-400 mb-3">
                ${distStr ? `<span class="bg-orange-50 dark:bg-slate-800 px-2 py-1 rounded"><i class="fa-solid fa-location-dot text-orange-500 mr-1"></i> ${distStr}</span>` : ''}
                ${priceStr ? `<span class="bg-orange-50 dark:bg-slate-800 px-2 py-1 rounded"><i class="fa-solid fa-money-bill text-emerald-500 mr-1"></i> ${priceStr}</span>` : ''}
              </div>
              ${menuText ? `<p class="text-sm text-gray-600 dark:text-gray-400 line-clamp-2">${menuText}</p>` : ''}
            </div>
            <div class="mt-4 pt-3 border-t border-orange-100 dark:border-slate-700 text-center text-xs font-bold text-orange-600 dark:text-orange-400">
              <i class="fa-solid fa-eye"></i> ${t('btn_details')}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(item) {
      document.getElementById('itemModal').classList.remove('hidden');
      document.getElementById('modalTitle').innerText = item.n;
      document.getElementById('modalSubtitle').innerText = `${data.cats[item.c].title[currentLang] || data.cats[item.c].title.ar} | ${item.r} ⭐`;

      let hoursStr = t('shop_hours') + ' ' + (item.h && item.h.length > 0 ? item.h.map(h => `${h[0]} - ${h[1]}`).join(' | ') : '-');
      document.getElementById('modalHours').innerText = hoursStr;

      const videoContainer = document.getElementById('modalVideoContainer');
      const videoDiv = document.getElementById('modalVideo');
      if (item.video) {
        videoContainer.classList.remove('hidden');
        videoDiv.innerHTML = `<iframe src="https://www.youtube.com/embed/${item.video}" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>`;
      } else videoContainer.classList.add('hidden');

      const textMenuContainer = document.getElementById('modalTextMenuContainer');
      const menuText = item.menu && item.menu[currentLang] ? item.menu[currentLang] : '';
      if (menuText) {
        textMenuContainer.classList.remove('hidden');
        document.getElementById('modalTextMenu').innerText = menuText;
      } else textMenuContainer.classList.add('hidden');

      const menuContainer = document.getElementById('modalMenuContainer');
      const menuGallery = document.getElementById('modalMenuGallery');
      menuGallery.innerHTML = '';
      if (item.menuImages && item.menuImages.length > 0) {
        menuContainer.classList.remove('hidden');
        item.menuImages.forEach(img => {
          menuGallery.innerHTML += `<div class="gallery-item" onclick="window.open('${img}', '_blank')"><img src="${img}" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-gray-400 text-xs p-2 text-center\\'>Image N/A</div>'"></div>`;
        });
      } else menuContainer.classList.add('hidden');

      const mapContainer = document.getElementById('modalMapContainer');
      const mapDiv = document.getElementById('modalMap');
      if (item.g) {
        mapContainer.classList.remove('hidden');
        mapDiv.innerHTML = `<iframe src="https://www.google.com/maps?q=${item.g[0]},${item.g[1]}&output=embed" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>`;
      } else mapContainer.classList.add('hidden');

      const phoneBtn = document.getElementById('modalPhoneBtn');
      if (item.t) { phoneBtn.href = `tel:${item.t}`; phoneBtn.classList.remove('hidden'); } else phoneBtn.classList.add('hidden');

      const mapBtn = document.getElementById('modalMapBtn');
      if (item.g) { mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${item.g[0]},${item.g[1]}`; mapBtn.classList.remove('hidden'); } else mapBtn.classList.add('hidden');

      document.querySelector('#itemModal > div').scrollTop = 0;
    }

    function closeModal() { document.getElementById('itemModal').classList.add('hidden'); }

    function toggleChat() {
      const chat = document.getElementById('chatWindow');
      if (!chat) return;
      chat.classList.toggle('hidden');
      chat.classList.toggle('open');
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const body = document.getElementById('chatBody');
      if (!input || !body) return;
      const msg = input.value.trim();
      if (!msg) return;
      body.innerHTML += `<div style="display:flex;justify-content:flex-end;"><div style="background:#f97316;color:white;padding:8px 12px;border-radius:12px 12px 4px 12px;max-width:80%;font-size:13px;">${msg}</div></div>`;
      input.value = '';
      body.scrollTop = body.scrollHeight;
      setTimeout(() => {
        let reply = t('chat_default');
        const m = msg.toLowerCase();
        if (m.includes("تسوق") || m.includes("صيدلية") || m.includes("مطعم") || m.includes("shop") || m.includes("pharmacie")) reply = "🛒 " + t('chat_shopping');
        else if (m.includes("سلام") || m.includes("مرحبا") || m.includes("hello") || m.includes("bonjour")) reply = "👋 " + t('chat_hello');
        else if (m.includes("شكرا") || m.includes("merci") || m.includes("thanks")) reply = "💛 " + t('chat_thanks');
        body.innerHTML += `<div style="display:flex;justify-content:flex-start;"><div style="background:#ffedd5;color:#7c2d12;padding:8px 12px;border-radius:12px 12px 12px 4px;max-width:80%;font-size:13px;">${reply}</div></div>`;
        body.scrollTop = body.scrollHeight;
      }, 500);
    }

    const kangarooContainer = document.getElementById('kangarooContainer');
    const kangarooSvg = document.getElementById('kangarooSvg');
    if (kangarooContainer) {
      kangarooContainer.addEventListener('click', () => {
        if (kangarooSvg) {
          kangarooSvg.style.animation = 'none';
          kangarooSvg.offsetHeight;
          kangarooSvg.style.animation = 'kangarooJump 0.6s ease';
          setTimeout(() => { kangarooSvg.style.animation = ''; }, 700);
        }
        toggleChat();
      });
      kangarooContainer.addEventListener('mouseenter', () => { if (kangarooSvg) kangarooSvg.style.transform = 'scale(1.1)'; });
      kangarooContainer.addEventListener('mouseleave', () => { if (kangarooSvg) kangarooSvg.style.transform = ''; });
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      const savedLang = localStorage.getItem('enstp_lang') || 'ar';
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + savedLang);
      if (activeBtn) activeBtn.classList.add('active');
      currentLang = savedLang;
      window.applyShoppingTranslation(savedLang);
      renderCategories();
      renderItems();
      const chatInput = document.getElementById('chatInput');
      if (chatInput) {
        chatInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });
      }
    });
  </script>
</body>
