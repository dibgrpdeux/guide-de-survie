<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script src="translate.js"></script>
  <style>body{top:0!important}.lang-btn.active{background:#4f46e5;color:#fff}.tab-content{display:none}.tab-content.active{display:block}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>النقل - ENSTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="sticky top-0 z-50 bg-white/90 border-b px-4 py-3">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="font-bold text-gray-900" data-i18n="trans_title">دليل النقل</h1>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1 bg-white p-1 rounded-xl border">
          <button onclick="setLanguage('ar')" id="btn-ar" class="lang-btn active">عربي</button>
          <button onclick="setLanguage('fr')" id="btn-fr" class="lang-btn">FR</button>
          <button onclick="setLanguage('en')" id="btn-en" class="lang-btn">EN</button>
        </div>
        <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 text-xs font-bold" data-i18n="nav_home">الرئيسية</a>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
    <div class="flex gap-2 justify-center flex-wrap">
      <button onclick="openTab('bus')" class="px-4 py-2 rounded-xl font-bold bg-indigo-600 text-white"><span data-i18n="trans_tab_bus">الحافلات الجامعية</span></button>
      <button onclick="openTab('metro')" class="px-4 py-2 rounded-xl font-bold bg-white text-gray-700 border"><span data-i18n="trans_tab_metro">المترو</span></button>
    </div>

    <div id="tab-bus" class="tab-content active bg-white p-6 rounded-2xl shadow-sm border">
      <h2 class="font-bold text-lg mb-4" data-i18n="trans_bus_title">مواقيت الحافلات الجامعية</h2>
      <ul class="text-sm space-y-2">
        <li>شاطوناي: 7:30 - 16:00</li>
        <li>تافورة: 7:15 - 16:00</li>
        <li>زرالدة: 7:30</li>
      </ul>
    </div>

    <div id="tab-metro" class="tab-content bg-white p-6 rounded-2xl shadow-sm border">
      <h2 class="font-bold text-lg mb-4" data-i18n="trans_metro_title">محطات المترو</h2>
      <ul class="text-sm grid grid-cols-2 gap-2">
        <li>ساحة الشهداء</li><li>تافورة</li><li>1 ماي</li><li>حي البدر</li>
      </ul>
    </div>
  </main>

  <script>
    function openTab(id) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
    }
  </script>
</body>
</html>
