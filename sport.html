<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="indigo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الرياضة والأنشطة - ENSTP</title>
  
  <!-- كود الترجمة -->
  <script src="translate.js"></script>
  <style>
    body { top: 0 !important; }
    .skiptranslate iframe { display: none !important; }
    .goog-te-banner-frame { display: none !important; }
    #goog-gt-tt { display: none !important; }
    #google_translate_element { display: none; } 
    .lang-btn { background: transparent; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.2s; color: #64748b; }
    .lang-btn:hover { background: #f1f5f9; color: #1e293b; }
    .lang-btn.active { background: #4f46e5; color: white; }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; }
    .ambient-bg { position: fixed; inset: 0; z-index: -1; background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%); }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.95); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05); }
    .glass-nav { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <div class="ambient-bg"></div>

  <!-- الهيدر -->
  <header class="sticky top-0 z-50 glass-nav px-4 lg:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-orange-500 flex items-center justify-center text-white font-black text-lg shadow-md">E</div>
        <div>
          <h1 class="font-bold text-gray-900 text-base leading-tight">ENSTP <span class="text-orange-500">Sports</span></h1>
          <p class="text-[11px] text-gray-500" data-i18n="nav_app_sub">المدرسة الوطنية العليا</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- أزرار الترجمة -->
        <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-gray-200 shadow-sm">
          <button onclick="setLanguage('ar')" id="btn-ar" class="lang-btn active">🇩🇿 عربي</button>
          <button onclick="setLanguage('fr')" id="btn-fr" class="lang-btn">🇫🇷 FR</button>
          <button onclick="setLanguage('en')" id="btn-en" class="lang-btn">🇬🇧 EN</button>
        </div>
        <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs font-bold" data-i18n="nav_home">الرئيسية</a>
      </div>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="max-w-5xl mx-auto px-4 py-10 flex-grow w-full space-y-8">

    <!-- قسم الترحيب -->
    <div class="glass-card rounded-3xl p-8 border border-white space-y-4 text-center">
      <div class="w-20 h-20 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center text-4xl mx-auto shadow-sm">
        <i class="fa-solid fa-dumbbell"></i>
      </div>
      <h2 class="text-3xl font-black text-gray-900" data-i18n="sport_title">الرياضة في ENSTP</h2>
      <p class="text-sm text-gray-600 max-w-2xl mx-auto leading-relaxed" data-i18n="sport_desc">
        شاهد الفيديوهات أدناه لاستكشاف المرافق الرياضية في المدرسة والمحيط.
      </p>
    </div>

    <!-- حاوية الفيديوهات (شبكة) -->
    <div id="sportContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

  </main>

  <footer class="glass-nav border-t border-gray-200 py-6 px-4 text-center text-xs text-gray-500">
    <p>© 2026 ENSTP Kouba.</p>
  </footer>

  <!-- استدعاء ملف البيانات -->
  <script src="data/sport.js"></script>

  <script>
    let currentLang = localStorage.getItem('enstp_lang') || 'ar';

    // تحديث اللغة
    const originalSetLanguage = window.setLanguage;
    window.setLanguage = function(lang) {
      currentLang = lang;
      originalSetLanguage(lang);
      renderSport();
    };

    // دالة استخراج معرف الفيديو من روابط يوتيوب (بما فيها Shorts)
    function getYoutubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // دالة عرض الفيديوهات فقط (بدون عناوين أو أوصاف)
    function renderSport() {
      const container = document.getElementById('sportContainer');
      container.innerHTML = '';

      const sportSection = window.SECTIONS.find(s => s.id === 'sport');
      if (!sportSection || !sportSection.items) return;

      sportSection.items.forEach(item => {
        // استخراج معرف الفيديو
        let videoId = item.video;
        if (!videoId && item.videoUrl) {
          videoId = getYoutubeId(item.videoUrl);
        }

        const card = document.createElement('div');
        card.className = "glass-card p-2 rounded-2xl border border-gray-100 shadow-sm";
        
        // عرض الفيديو فقط
        card.innerHTML = `
          <div class="video-container bg-gray-200">
            ${videoId ? `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>` : '<div class="flex items-center justify-center h-full text-gray-400">Video unavailable</div>'}
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderSport();
      setTimeout(() => setLanguage(currentLang), 100);
    });
  </script>
</body>
</html>
