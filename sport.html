<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page_title">صحتي ورياضتي - ENSTP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Cairo', sans-serif; transition: background-color 0.4s ease, color 0.4s ease; background-color: #fff7ed; }
    html.dark body { background-color: #1a1410; color: #f8fafc; }
    
    .glass-card { background: #ffffff; border: 1px solid #ffedd5; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: all 0.3s ease; }
    html.dark .glass-card { background: #1e293b; border-color: #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    
    .glass-nav { background: #fff7ed; border-bottom: 1px solid #fed7aa; transition: all 0.3s ease; }
    html.dark .glass-nav { background: #1a1410; border-bottom-color: #334155; }

    .filter-btn { transition: all 0.3s ease; }
    .filter-btn.active { background: linear-gradient(135deg, #f97316, #ea580c); color: white; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); border-color: transparent; }

    .card-item { background: white; border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.04); transition: all 0.3s ease; display: flex; flex-direction: column; border: 1px solid #f1f5f9; }
    html.dark .card-item { background: #1e293b; border-color: #334155; }
    .card-item:hover { transform: translateY(-5px); box-shadow: 0 15px 35px -10px rgba(249, 115, 22, 0.25); border-color: #fb923c; }
    
    .map-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 0.75rem; }
    .map-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .gallery-scroll { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .gallery-scroll::-webkit-scrollbar { height: 6px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: #fdba74; border-radius: 10px; }
    .gallery-item { flex: 0 0 auto; width: 220px; height: 150px; scroll-snap-align: start; border-radius: 0.75rem; overflow: hidden; border: 1px solid #e2e8f0; background: #f8fafc; cursor: pointer; transition: transform 0.3s ease; }
    .gallery-item:hover { transform: scale(1.05); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    .lang-btn { padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; transition: 0.2s; color: #64748b; background: transparent; border: none; cursor: pointer; }
    .lang-btn:hover { background: #ffedd5; color: #9a3412; }
    .lang-btn.active { background: #f97316; color: white; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="sticky top-0 z-50 glass-nav px-4 lg:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-brand-500 to-amber-500 flex items-center justify-center text-white font-black text-lg shadow-md">E</div>
        <div>
          <h1 class="font-bold text-gray-900 dark:text-white text-base leading-tight">ENSTP <span class="text-brand-500">Santé & Sport</span></h1>
          <p class="text-[11px] text-gray-500 dark:text-gray-400" data-i18n="nav_app_sub">المدرسة الوطنية العليا</p>
        </div>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <div class="flex items-center gap-1 bg-white dark:bg-slate-800 p-1 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm">
          <button onclick="setLanguage('ar')" id="btn-ar" class="lang-btn active">🇩🇿 عربي</button>
          <button onclick="setLanguage('fr')" id="btn-fr" class="lang-btn">🇫🇷 FR</button>
          <button onclick="setLanguage('en')" id="btn-en" class="lang-btn">🇬🇧 EN</button>
        </div>
        <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-600 dark:text-gray-300 flex items-center justify-center shadow-sm hover:bg-orange-50 dark:hover:bg-slate-700 transition">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:block text-brand-400"></i>
        </button>
        <a href="index.html" class="px-4 py-2 rounded-xl bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-slate-700 text-xs font-bold" data-i18n="nav_home">الرئيسية</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-10 flex-grow w-full space-y-8">

    <div class="text-center mb-8">
      <h2 class="text-3xl font-black text-gray-900 dark:text-white" data-i18n="sport_title">صحتي ورياضتي</h2>
      <p class="text-gray-600 dark:text-gray-400 mt-2" data-i18n="sport_desc">دليل الأطباء، عيادات الأسنان، صالات الرياضة، والأنشطة البدنية.</p>
    </div>

    <!-- Filtres -->
    <div id="filtersBar" class="flex flex-wrap gap-2 justify-center sticky top-[60px] z-40 bg-white/95 dark:bg-slate-800/95 backdrop-blur p-2 rounded-2xl shadow-sm border border-orange-100 dark:border-slate-700">
      <button onclick="setFilter('all')" id="filter-all" class="filter-btn active px-5 py-2.5 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">
        <i class="fa-solid fa-list"></i> <span data-i18n="filter_all">الكل</span>
      </button>
      <button onclick="setFilter('medecin')" id="filter-medecin" class="filter-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">
        <i class="fa-solid fa-stethoscope"></i> <span data-i18n="filter_medecin">الأطباء</span>
      </button>
      <button onclick="setFilter('dentiste')" id="filter-dentiste" class="filter-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">
        <i class="fa-solid fa-tooth"></i> <span data-i18n="filter_dentiste">الأسنان</span>
      </button>
      <button onclick="setFilter('salle')" id="filter-salle" class="filter-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">
        <i class="fa-solid fa-dumbbell"></i> <span data-i18n="filter_salle">الصالات</span>
      </button>
      <button onclick="setFilter('video')" id="filter-video" class="filter-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-300 border border-orange-200 dark:border-slate-700">
        <i class="fa-solid fa-video"></i> <span data-i18n="filter_video">الفيديوهات</span>
      </button>
    </div>

    <!-- Grille -->
    <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <footer class="glass-nav border-t border-gray-200 dark:border-slate-700 py-6 px-4 text-center text-xs text-gray-500 dark:text-gray-400">
    <p>© 2026 ENSTP Kouba.</p>
  </footer>

  <!-- Modal -->
  <div id="itemModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-3xl w-full p-6 lg:p-8 space-y-6 shadow-2xl relative max-h-[95vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 flex items-center justify-center transition z-20"><i class="fa-solid fa-xmark text-lg"></i></button>
      
      <div class="border-b border-orange-100 dark:border-slate-700 pb-4 pr-10">
        <h2 id="modalTitle" class="text-2xl font-black text-gray-900 dark:text-white"></h2>
        <p id="modalSubtitle" class="text-sm text-orange-600 dark:text-orange-400 font-bold mt-1"></p>
      </div>

      <div id="modalVideoContainer" class="space-y-2 hidden">
        <div id="modalVideo" class="w-full aspect-video rounded-xl overflow-hidden bg-gray-200 dark:bg-slate-700"></div>
      </div>

      <div id="modalGalleryContainer" class="space-y-2 hidden">
        <h4 class="font-bold text-gray-900 dark:text-white text-sm"><i class="fa-solid fa-images text-orange-500 mr-1.5"></i> <span data-i18n="modal_gallery">معرض الصور:</span></h4>
        <div id="modalGallery" class="gallery-scroll"></div>
      </div>

      <div class="space-y-4 text-sm text-gray-700 dark:text-gray-300">
        <div id="modalAddressContainer">
          <h4 class="font-bold text-gray-900 dark:text-white text-sm mb-1"><i class="fa-solid fa-location-dot text-orange-500 mr-1.5"></i> <span data-i18n="modal_address">العنوان:</span></h4>
          <p id="modalAddress" class="bg-orange-50 dark:bg-slate-900 p-3 rounded-xl border border-orange-100 dark:border-slate-700"></p>
        </div>
        <div id="modalPhoneContainer">
          <h4 class="font-bold text-gray-900 dark:text-white text-sm mb-1"><i class="fa-solid fa-phone text-orange-500 mr-1.5"></i> <span data-i18n="modal_phone">الهاتف:</span></h4>
          <p id="modalPhone" class="bg-orange-50 dark:bg-slate-900 p-3 rounded-xl border border-orange-100 dark:border-slate-700" dir="ltr"></p>
        </div>
      </div>

      <div id="modalMapContainer" class="space-y-2 hidden">
        <h4 class="font-bold text-gray-900 dark:text-white text-sm"><i class="fa-solid fa-map-location-dot text-orange-500 mr-1.5"></i> <span data-i18n="modal_map">الموقع:</span></h4>
        <div id="modalMap" class="map-container bg-gray-200 dark:bg-slate-700"></div>
        <a id="modalMapBtn" href="#" target="_blank" class="inline-flex items-center gap-2 bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-bold text-xs transition">
          <i class="fa-solid fa-map-location-dot"></i> <span data-i18n="open_in_maps">فتح في خرائط جوجل</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Chargement des données -->
  <script src="data/sport.js"></script>

  <script>
    let currentLang = localStorage.getItem('enstp_lang') || 'ar';
    let currentFilter = 'all';

    // ============================================================
    // DARK MODE
    // ============================================================
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

    // ============================================================
    // TRADUCTIONS
    // ============================================================
    window.SPORT_TRANSLATIONS = {
      ar: {
        page_title: "صحتي ورياضتي - ENSTP",
        nav_app_sub: "المدرسة الوطنية العليا", nav_home: "الرئيسية",
        sport_title: "صحتي ورياضتي",
        sport_desc: "دليل الأطباء، عيادات الأسنان، صالات الرياضة، والأنشطة البدنية.",
        filter_all: "الكل", filter_medecin: "الأطباء", filter_dentiste: "الأسنان", filter_salle: "الصالات", filter_video: "الفيديوهات",
        modal_gallery: "معرض الصور:", modal_address: "العنوان:", modal_phone: "الهاتف:", modal_map: "الموقع:",
        open_in_maps: "فتح في خرائط جوجل",
        no_items: "لا توجد عناصر.",
        group_medecin: "طبيب", group_dentiste: "عيادة أسنان", group_salle: "صالة رياضية", group_video: "فيديو"
      },
      fr: {
        page_title: "Santé & Sport - ENSTP",
        nav_app_sub: "École Nationale Supérieure", nav_home: "Accueil",
        sport_title: "Santé & Sport",
        sport_desc: "Médecins, dentistes, salles de sport et activités physiques.",
        filter_all: "Tous", filter_medecin: "Médecins", filter_dentiste: "Dentistes", filter_salle: "Salles", filter_video: "Vidéos",
        modal_gallery: "Galerie:", modal_address: "Adresse:", modal_phone: "Téléphone:", modal_map: "Emplacement:",
        open_in_maps: "Ouvrir dans Google Maps",
        no_items: "Aucun élément.",
        group_medecin: "Médecin", group_dentiste: "Dentiste", group_salle: "Salle de sport", group_video: "Vidéo"
      },
      en: {
        page_title: "Health & Sport - ENSTP",
        nav_app_sub: "National Higher School", nav_home: "Home",
        sport_title: "Health & Sport",
        sport_desc: "Doctors, dentists, gyms and physical activities.",
        filter_all: "All", filter_medecin: "Doctors", filter_dentiste: "Dentists", filter_salle: "Gyms", filter_video: "Videos",
        modal_gallery: "Gallery:", modal_address: "Address:", modal_phone: "Phone:", modal_map: "Location:",
        open_in_maps: "Open in Google Maps",
        no_items: "No items.",
        group_medecin: "Doctor", group_dentiste: "Dentist", group_salle: "Gym", group_video: "Video"
      }
    };

    function t(key) {
      const dict = window.SPORT_TRANSLATIONS[currentLang] || window.SPORT_TRANSLATIONS.ar;
      return dict[key] || key;
    }
    window.t = t;

    // ============================================================
    // SET LANGUAGE
    // ============================================================
    function applyTranslation(lang) {
      const dict = window.SPORT_TRANSLATIONS[lang] || window.SPORT_TRANSLATIONS.ar;
      if (dict.page_title) document.title = dict.page_title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          const icon = el.querySelector('i');
          if (icon) {
            el.innerHTML = '';
            el.appendChild(icon);
            el.appendChild(document.createTextNode(' ' + dict[key]));
          } else {
            el.innerText = dict[key];
          }
        }
      });
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;
      renderItems();
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('enstp_lang', lang);
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + lang);
      if (activeBtn) activeBtn.classList.add('active');
      applyTranslation(lang);
    }

    // ============================================================
    // FILTER
    // ============================================================
    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'medecin', 'dentiste', 'salle', 'video'].forEach(f => {
        const btn = document.getElementById('filter-' + f);
        if (btn) {
          if (f === filter) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });
      renderItems();
    }

    // ============================================================
    // RENDER ITEMS
    // ============================================================
    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      if (typeof window.SECTIONS === 'undefined') {
        grid.innerHTML = `<p class="text-red-500 font-bold text-center col-span-full">Erreur: data/sport.js non chargé.</p>`;
        return;
      }

      const sport = window.SECTIONS.find(s => s.id === 'sport');
      if (!sport) {
        grid.innerHTML = `<p class="text-red-500 font-bold text-center col-span-full">Section sport introuvable.</p>`;
        return;
      }

      let items = sport.items;
      if (currentFilter !== 'all') {
        items = items.filter(i => i.category === currentFilter);
      }

      if (items.length === 0) {
        grid.innerHTML = `<p class="text-gray-500 text-center col-span-full py-10">${t('no_items')}</p>`;
        return;
      }

      items.forEach(item => {
        const title = item.title ? (item.title[currentLang] || item.title.ar || item.title.fr) : '';
        const specialty = item.specialty ? (item.specialty[currentLang] || item.specialty.ar || item.specialty.fr) : '';
        const desc = item.desc ? (item.desc[currentLang] || item.desc.ar || item.desc.fr) : '';
        const categoryLabel = t('group_' + item.category);

        // Image de couverture
        let coverImage = null;
        if (item.images && item.images.length > 0) coverImage = item.images[0];

        let mediaHtml = '';
        if (item.video || item.videoUrl) {
          const videoId = item.video || extractYoutubeId(item.videoUrl);
          mediaHtml = `<div class="video-container bg-gray-200 dark:bg-slate-900"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen loading="lazy"></iframe></div>`;
        } else if (coverImage) {
          mediaHtml = `<div class="h-48 overflow-hidden rounded-t-2xl"><img src="${coverImage}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center bg-orange-50 dark:bg-slate-800 text-orange-300 text-4xl\\'>${item.icon || '📷'}</div>'"></div>`;
        } else {
          mediaHtml = `<div class="h-48 flex items-center justify-center bg-orange-50 dark:bg-slate-800 text-orange-300 text-5xl rounded-t-2xl">${item.icon || '📷'}</div>`;
        }

        const card = document.createElement('div');
        card.className = 'card-item cursor-pointer';
        card.onclick = () => openModal(item);
        card.innerHTML = `
          ${mediaHtml}
          <div class="p-4 flex flex-col flex-grow">
            <div class="flex items-center gap-2 mb-2">
              <span class="text-2xl">${item.icon || '📌'}</span>
              <span class="text-[10px] font-bold text-orange-600 bg-orange-50 dark:bg-orange-900/20 px-2 py-0.5 rounded">${categoryLabel}</span>
            </div>
            <h3 class="font-bold text-lg text-gray-900 dark:text-white">${title}</h3>
            ${specialty ? `<p class="text-xs text-brand-600 dark:text-brand-400 font-bold mt-1">${specialty}</p>` : ''}
            ${desc ? `<p class="text-sm text-gray-600 dark:text-gray-400 mt-2 line-clamp-2">${desc}</p>` : ''}
            ${item.address ? `<p class="text-xs text-gray-500 dark:text-gray-400 mt-2"><i class="fa-solid fa-location-dot text-orange-500 mr-1"></i> ${item.address}</p>` : ''}
            ${item.phone ? `<p class="text-xs text-gray-500 dark:text-gray-400 mt-1" dir="ltr"><i class="fa-solid fa-phone text-orange-500 mr-1"></i> ${item.phone}</p>` : ''}
            <div class="mt-3 pt-3 border-t border-orange-100 dark:border-slate-700 text-center text-xs font-bold text-orange-600 dark:text-orange-400">
              <i class="fa-solid fa-eye"></i> ${t('filter_all') === 'Tous' ? 'Voir détails' : (currentLang === 'en' ? 'View details' : 'عرض التفاصيل')}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function extractYoutubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // ============================================================
    // MODAL
    // ============================================================
    function openModal(item) {
      document.getElementById('itemModal').classList.remove('hidden');

      const title = item.title ? (item.title[currentLang] || item.title.ar || item.title.fr) : '';
      const specialty = item.specialty ? (item.specialty[currentLang] || item.specialty.ar || item.specialty.fr) : '';
      const categoryLabel = t('group_' + item.category);

      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalSubtitle').innerText = specialty || categoryLabel;

      // Vidéo
      const videoContainer = document.getElementById('modalVideoContainer');
      const videoDiv = document.getElementById('modalVideo');
      const videoId = item.video || (item.videoUrl ? extractYoutubeId(item.videoUrl) : null);
      if (videoId) {
        videoContainer.classList.remove('hidden');
        videoDiv.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
      } else {
        videoContainer.classList.add('hidden');
      }

      // Galerie
      const galleryContainer = document.getElementById('modalGalleryContainer');
      const gallery = document.getElementById('modalGallery');
      gallery.innerHTML = '';
      if (item.images && item.images.length > 0) {
        galleryContainer.classList.remove('hidden');
        item.images.forEach(img => {
          gallery.innerHTML += `<div class="gallery-item" onclick="window.open('${img}', '_blank')"><img src="${img}" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-gray-400 text-xs\\'>Image</div>'"></div>`;
        });
      } else {
        galleryContainer.classList.add('hidden');
      }

      // Adresse
      const addressContainer = document.getElementById('modalAddressContainer');
      if (item.address) {
        addressContainer.classList.remove('hidden');
        document.getElementById('modalAddress').innerText = item.address;
      } else {
        addressContainer.classList.add('hidden');
      }

      // Téléphone
      const phoneContainer = document.getElementById('modalPhoneContainer');
      if (item.phone) {
        phoneContainer.classList.remove('hidden');
        document.getElementById('modalPhone').innerText = item.phone;
      } else {
        phoneContainer.classList.add('hidden');
      }

      // Map
      const mapContainer = document.getElementById('modalMapContainer');
      const mapDiv = document.getElementById('modalMap');
      const mapBtn = document.getElementById('modalMapBtn');
      if (item.map || item.mapCoords) {
        mapContainer.classList.remove('hidden');
        const query = item.mapCoords ? `${item.mapCoords[0]},${item.mapCoords[1]}` : encodeURIComponent(item.map);
        mapDiv.innerHTML = `<iframe src="https://www.google.com/maps?q=${query}&output=embed" allowfullscreen loading="lazy"></iframe>`;
        mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${query}`;
      } else {
        mapContainer.classList.add('hidden');
      }

      document.querySelector('#itemModal > div').scrollTop = 0;
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
      document.getElementById('modalMap').innerHTML = '';
      document.getElementById('modalVideo').innerHTML = '';
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('enstp_lang') || 'ar';
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + savedLang);
      if (activeBtn) activeBtn.classList.add('active');
      currentLang = savedLang;
      applyTranslation(savedLang);
    });
  </script>
</body>
</html>
